<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <meta name="description" content="The world's smallest violin. A tiny performance for your troubles.">
  <title>World's Smallest Violin</title>
  <style>
    :root { color-scheme:light; --ink:#27231f; --muted:#807970; --accent:#a75a39; }
    * {box-sizing:border-box}
    html,body {margin:0; min-width:280px; min-height:100%; }
    body {background:#f7f5f0; color:var(--ink); font-family:Georgia,'Times New Roman',serif; overflow:hidden; -webkit-tap-highlight-color:transparent;}
    main {position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100svh; padding:36px 18px 52px; overflow:hidden; isolation:isolate;}
    main::before {content:""; position:absolute; z-index:-1; inset:0; background:radial-gradient(ellipse 38% 44% at 50% 54%,#fffaf1 0%,#f7f5f0 92%); pointer-events:none;}
    .topline {font:600 10px/1.3 system-ui,-apple-system,sans-serif; letter-spacing:.26em; color:#9b836c; text-transform:uppercase; margin:0 0 16px;}
    h1 {font-weight:400; font-size:clamp(36px,5.2vw,67px); letter-spacing:-.057em; line-height:1.04; text-align:center; max-width:900px; margin:0;}
    .subtitle {font:400 clamp(13px,1.4vw,15px)/1.5 system-ui,-apple-system,sans-serif; color:#827a71; text-align:center; margin:14px 0 0;}
    .stage {position:relative; flex:none; display:grid; place-items:center; width:min(94vw,580px); height:min(54svh,510px); min-height:220px; margin:5px 0 0;}
    .halo {position:absolute; inset:10% 16%; border-radius:50%; background:radial-gradient(circle,rgba(222,168,110,.14) 0,rgba(222,168,110,.06) 42%,transparent 70%); pointer-events:none;}
    .ring {position:absolute; pointer-events:none; width:49%; aspect-ratio:1; border:1px solid rgba(173,132,94,.14); border-radius:50%; animation:ripple 4.4s ease-out infinite;}
    .ring.two {animation-delay:2.2s;}
    @keyframes ripple {0% {opacity:0; transform:scale(.58)} 25%{opacity:.76} 100%{opacity:0; transform:scale(1.42)}}
    .stage::after {content:""; position:absolute; bottom:7%; left:30%; right:30%; height:13px; border-radius:50%; background:rgba(98,57,29,.1); filter:blur(15px); pointer-events:none; z-index:-1;}
    .violin-button {appearance:none; border:0; background:none; color:inherit; width:100%; height:100%; padding:0; cursor:pointer; position:relative; z-index:2; display:grid; place-items:center; touch-action:manipulation;}
    .violin-button:focus-visible {outline:2px solid var(--accent); outline-offset:-6px; border-radius:28px;}
    svg.violin {display:block; height:100%; width:100%; overflow:visible; filter:drop-shadow(0 16px 11px rgba(72,45,28,.10));}
    .instrument,.bow {transform-box:view-box;}
    .note {opacity:0; font-family:Georgia,serif; font-size:32px; fill:#b98858; pointer-events:none;}
    .note-a {animation:floatNote 3.2s .05s infinite ease-out;}
    .note-b {animation:floatNote 3.2s 1.1s infinite ease-out;}
    .note-c {animation:floatNote 3.2s 2.15s infinite ease-out;}
    @keyframes floatNote {0%{opacity:0;transform:translate(0,10px) scale(.72)} 17%{opacity:.85} 66%{opacity:.55} 100%{opacity:0;transform:translate(17px,-90px) scale(1.05)}}
    .status {display:flex; justify-content:center; align-items:center; gap:12px; min-height:36px; margin:0; font:600 11px/1.4 system-ui,-apple-system,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#886f59;}
    .sound-bars {height:20px; display:flex; gap:3px; align-items:center;}
    .sound-bars i {display:block; width:3px; height:5px; background:#a47752; border-radius:3px; transform-origin:center;}
    .playing .sound-bars i {animation:barPulse .65s ease-in-out infinite alternate;}
    .playing .sound-bars i:nth-child(2) {animation-delay:-.32s}
    .playing .sound-bars i:nth-child(3) {animation-delay:-.18s}
    .playing .sound-bars i:nth-child(4) {animation-delay:-.46s}
    .playing .sound-bars i:nth-child(5) {animation-delay:-.13s}
    @keyframes barPulse {from{height:4px} to{height:19px}}
    .footer {position:absolute; left:15px; right:15px; bottom:25px; text-align:center; color:#ad9f91; font:400 11px/1.4 system-ui,-apple-system,sans-serif; letter-spacing:.02em;}
    @media(max-height:710px) {main{padding-top:16px;padding-bottom:29px}.topline{margin-bottom:8px}h1{font-size:clamp(30px,4vw,50px)}.subtitle{margin-top:6px}.stage{height:52svh;min-height:160px}.footer{bottom:8px}}
    @media(max-width:540px){.stage{width:100vw;height:min(53svh,450px)}.topline{margin-bottom:11px}h1{max-width:360px}.status{font-size:10px}.footer{font-size:10px;bottom:18px}}
    @media(prefers-reduced-motion:reduce){.note,.ring,.sound-bars i{animation:none!important}.ring{opacity:0}}
  </style>
</head>
<body>
<main id="page">
  <p class="topline">A very special performance</p>
  <h1>The world's smallest violin.</h1>
  <p class="subtitle">Playing a song just for your troubles.</p>

  <div class="stage">
    <div class="halo" aria-hidden="true"></div>
    <div class="ring one" aria-hidden="true"></div>
    <div class="ring two" aria-hidden="true"></div>
    <button class="violin-button" id="violinButton" type="button" aria-label="Play the tiny violin" aria-pressed="false" title="Click to play or stop">
      <svg class="violin" viewBox="0 0 520 435" role="img" aria-label="A little wooden violin with a moving bow">
        <defs>
          <linearGradient id="varnish" x1="0" x2="1" y1=".1" y2=".9">
            <stop offset="0" stop-color="#df9a59"/>
            <stop offset=".30" stop-color="#bf703e"/>
            <stop offset=".73" stop-color="#a74e32"/>
            <stop offset="1" stop-color="#833922"/>
          </linearGradient>
          <linearGradient id="neck" x1="0" x2="1">
            <stop offset="0" stop-color="#402c26"/>
            <stop offset=".55" stop-color="#654537"/>
            <stop offset="1" stop-color="#2d211f"/>
          </linearGradient>
          <linearGradient id="bowWood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5b3426"/>
            <stop offset=".45" stop-color="#c88d59"/>
            <stop offset="1" stop-color="#4d2b23"/>
          </linearGradient>
        </defs>

        <text class="note note-a" x="381" y="237">♪</text>
        <text class="note note-b" x="128" y="306">♫</text>
        <text class="note note-c" x="381" y="335">♪</text>

        <g class="instrument" id="instrumentGroup">
          <!-- Scroll, pegbox, and pegs -->
          <path d="M253 100 C238 91 239 73 255 66 C273 58 287 43 281 28 C278 19 265 17 256 25 C249 32 254 40 263 37" fill="none" stroke="#523022" stroke-width="13" stroke-linecap="round"/>
          <path d="M252 100 L250 65 Q250 53 259 51 Q269 54 269 65 L267 100Z" fill="#7a4935" stroke="#4b3026" stroke-width="3"/>
          <g fill="#503226" stroke="#382821" stroke-width="2">
            <path d="M250 79 L232 71 L231 83 L250 88Z"/>
            <path d="M269 76 L287 68 L288 80 L269 87Z"/>
            <path d="M250 95 L232 87 L231 98 L250 103Z"/>
            <path d="M269 92 L287 85 L288 96 L269 102Z"/>
          </g>
          <!-- Neck and ebony fingerboard -->
          <path d="M248 96 L272 96 L279 208 L241 208Z" fill="url(#neck)" stroke="#503428" stroke-width="3"/>
          <path d="M250 93 L270 93 L273 219 L247 219Z" fill="#332b28"/>
          <path d="M251 93 L255 93 L251 216 L247 217Z" fill="#6a5650" opacity=".45"/>
          <!-- Back edge -->
          <path d="M260 174 C233 156 198 166 195 203 C193 226 206 239 217 249 C231 260 227 271 209 286 C188 304 184 327 195 353 C208 383 232 395 260 381 C288 395 312 383 325 353 C336 327 332 304 311 286 C293 271 289 260 303 249 C314 239 327 226 325 203 C322 166 287 156 260 174Z"
                fill="#703723" stroke="#643322" stroke-width="8" stroke-linejoin="round"/>
          <!-- Violin front -->
          <path d="M260 177 C234 159 201 169 200 205 C199 224 211 238 223 249 C236 260 233 277 214 291 C193 308 190 330 200 351 C213 381 236 387 260 375 C284 387 307 381 320 351 C330 330 327 308 306 291 C287 277 284 260 297 249 C309 238 321 224 320 205 C319 169 286 159 260 177Z"
                fill="url(#varnish)" stroke="#e0a16c" stroke-width="3"/>
          <!-- Highlights and violin purfling -->
          <path d="M259 186 C231 168 210 176 209 205 C207 231 239 245 238 268 C238 293 198 305 208 345 C219 369 239 376 260 366 C281 376 301 369 312 345 C322 305 282 293 282 268 C281 245 313 231 311 205 C310 176 289 168 261 186"
                fill="none" stroke="#713b29" stroke-width="2" opacity=".63"/>
          <path d="M214 207 C215 187 229 181 245 186" fill="none" stroke="#ffe0a0" stroke-width="5" stroke-linecap="round" opacity=".25"/>
          <path d="M208 331 C208 359 233 376 254 368" fill="none" stroke="#f9c17b" stroke-width="7" opacity=".17" stroke-linecap="round"/>
          <!-- F-holes -->
          <g fill="none" stroke="#492d24" stroke-linecap="round">
            <path d="M236 250 C219 260 221 278 232 286 C241 293 232 307 223 315" stroke-width="4.5"/>
            <path d="M284 250 C301 260 299 278 288 286 C279 293 288 307 297 315" stroke-width="4.5"/>
          </g>
          <g fill="#492d24">
            <ellipse cx="238" cy="249" rx="5" ry="6" transform="rotate(20 238 249)"/>
            <ellipse cx="282" cy="249" rx="5" ry="6" transform="rotate(-20 282 249)"/>
            <ellipse cx="221" cy="317" rx="4.5" ry="5.5"/>
            <ellipse cx="299" cy="317" rx="4.5" ry="5.5"/>
          </g>
          <!-- Saddle, tailpiece and bridge -->
          <path d="M249 331 Q260 327 271 331 L267 365 Q260 369 253 365Z" fill="#382b25"/>
          <path d="M254 365 L266 365 L263 377 L257 377Z" fill="#46322a"/>
          <path d="M243 273 Q260 265 277 273 L275 283 Q260 279 245 283Z" fill="#eed5a7" stroke="#cfa472" stroke-width="1.5"/>
          <!-- Strings -->
          <g stroke="#f9ebca" stroke-width="1" opacity=".8">
            <path d="M253 94 L254 363"/>
            <path d="M258 94 L258 364"/>
            <path d="M263 94 L262 364"/>
            <path d="M268 94 L266 363"/>
          </g>
          <!-- Chin rest -->
          <path d="M285 353 Q303 348 313 357 Q302 380 281 374 Q273 370 285 353Z" fill="#3d2a25" stroke="#281f1d" stroke-width="2"/>
          <path d="M284 362 Q297 356 306 362" fill="none" stroke="#77544a" stroke-width="2" opacity=".5"/>
        </g>

        <!-- Bow runs across strings; this group moves while the music plays -->
        <g class="bow" id="bowGroup">
          <path d="M104 251 Q259 233 423 253" fill="none" stroke="#f6e8c8" stroke-width="6" stroke-linecap="round"/>
          <path d="M91 242 Q264 233 435 238" fill="none" stroke="url(#bowWood)" stroke-width="5" stroke-linecap="round"/>
          <path d="M102 244 L127 246" fill="none" stroke="#2f2926" stroke-width="11" stroke-linecap="round"/>
          <path d="M119 237 L119 252" stroke="#c7a47c" stroke-width="3"/>
          <circle cx="429" cy="238" r="5" fill="#7b4d2c"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="status" aria-live="polite"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="statusLabel">Click violin for sound</span></div>
  <div class="footer">An exceptionally small amount of sympathy.</div>
</main>

<script>
(() => {
  'use strict';
  const page = document.getElementById('page');
  const button = document.getElementById('violinButton');
  const label = document.getElementById('statusLabel');
  const instrumentGroup = document.getElementById('instrumentGroup');
  const bowGroup = document.getElementById('bowGroup');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The physical motion starts as soon as the page opens; sound requires a user click.
  function renderMotion(now) {
    const t = now / 1000;
    const sway = -18 + 2.4 * Math.sin(t * 2.1);
    const stroke = Math.sin(t * (Math.PI * 2 / 1.3)) * 64;
    const lift = Math.cos(t * (Math.PI * 2 / 1.3)) * 4;
    instrumentGroup.setAttribute('transform', 'rotate(' + sway.toFixed(2) + ' 260 260)');
    bowGroup.setAttribute('transform', 'translate(' + stroke.toFixed(2) + ' ' + lift.toFixed(2) + ') rotate(' + (sway + 1).toFixed(2) + ' 260 250)');
    if (!reducedMotion) requestAnimationFrame(renderMotion);
  }
  if (reducedMotion) renderMotion(0); else requestAnimationFrame(renderMotion);

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  let audioContext, compressor, dry, delay, feedback, wet;
  let playing = false, sessionBus = null, repeatTimer = null;

  // A short original, wistful violin tune. Stored as MIDI note number + seconds.
  const score = [
    [74,.86],[72,.86],[70,1.15],[69,.63],[67,1.35],
    [69,.78],[70,1.04],[69,1.27],
    [65,.82],[67,.78],[69,.94],[74,1.15],
    [72,.86],[70,.97],[69,.93],[62,1.75]
  ];

  function setupAudio() {
    if (!AudioContextClass) throw Error('Audio playback is unavailable');
    if (audioContext) return;
    audioContext = new AudioContextClass();
    compressor = audioContext.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 18;
    compressor.ratio.value = 2;
    compressor.attack.value = .015;
    compressor.release.value = .24;
    const output = audioContext.createGain();
    output.gain.value = .72;
    compressor.connect(output).connect(audioContext.destination);

    dry = audioContext.createGain();
    dry.gain.value = .85;
    dry.connect(compressor);
    delay = audioContext.createDelay(.8);
    delay.delayTime.value = .22;
    feedback = audioContext.createGain();
    feedback.gain.value = .20;
    wet = audioContext.createGain();
    wet.gain.value = .14;
    delay.connect(feedback).connect(delay);
    delay.connect(wet).connect(compressor);
  }

  function soundNote(midi, at, duration, bus, volume=1) {
    const ctx = audioContext;
    const hz = 440 * Math.pow(2, (midi - 69) / 12);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = Math.min(3100, 1700 + hz * 1.5);
    filter.Q.value = .38;

    const envelope = ctx.createGain();
    envelope.gain.setValueAtTime(.0001, at);
    envelope.gain.linearRampToValueAtTime(.5 * volume, at + .11);
    envelope.gain.linearRampToValueAtTime(.34 * volume, at + .28);
    envelope.gain.setValueAtTime(.34 * volume, at + Math.max(.29,duration - .20));
    envelope.gain.exponentialRampToValueAtTime(.0001, at + duration + .17);
    filter.connect(envelope).connect(bus);

    const vibrato = ctx.createOscillator();
    const vibratoDepth = ctx.createGain();
    vibrato.type = 'sine';
    vibrato.frequency.value = 5.2;
    vibratoDepth.gain.setValueAtTime(0, at);
    vibratoDepth.gain.linearRampToValueAtTime(8, at + .24);
    vibrato.connect(vibratoDepth);
    vibrato.start(at);
    vibrato.stop(at + duration + .18);

    // Additive harmonics make the bowed string sound, without external audio files.
    const partials = [[1,.40,'sawtooth'],[2,.23,'sine'],[3,.14,'sine'],[4,.075,'sine']];
    partials.forEach(([multiple,level,wave],i) => {
      const osc = ctx.createOscillator();
      const partGain = ctx.createGain();
      osc.type = wave;
      osc.frequency.value = hz * multiple;
      osc.detune.value = [-3,0,2,-2][i];
      vibratoDepth.connect(osc.detune);
      partGain.gain.value = level;
      osc.connect(partGain).connect(filter);
      osc.start(at);
      osc.stop(at + duration + .18);
    });
  }

  function playPhrase(bus) {
    if (!playing || bus !== sessionBus) return;
    const start = audioContext.currentTime + .055;
    let t = start;
    score.forEach(([midi,duration], index) => {
      soundNote(midi, t, duration + .08, bus, .94);
      if (index === 0 || index === 8) soundNote(50, t, Math.min(duration + 2.2, 3.1), bus, .12);
      t += duration;
    });
    repeatTimer = window.setTimeout(() => playPhrase(bus), (t - start + .6) * 1000);
  }

  function setVisualState(value) {
    page.classList.toggle('playing', value);
    button.setAttribute('aria-pressed', String(value));
    button.setAttribute('aria-label', value ? 'Stop the tiny violin' : 'Play the tiny violin');
    label.textContent = value ? 'Sound on · click to mute' : 'Click violin for sound';
  }

  function stop() {
    playing = false;
    clearTimeout(repeatTimer);
    if (sessionBus && audioContext) {
      const bus = sessionBus;
      bus.gain.cancelScheduledValues(audioContext.currentTime);
      bus.gain.setTargetAtTime(.0001, audioContext.currentTime, .055);
      sessionBus = null;
      window.setTimeout(() => { try { bus.disconnect(); } catch (_) {} }, 1200);
    }
    setVisualState(false);
  }

  async function start() {
    try {
      setupAudio();
      await audioContext.resume();
      if (playing) return;
      const bus = audioContext.createGain();
      bus.gain.value = .9;
      bus.connect(dry);
      bus.connect(delay);
      sessionBus = bus;
      playing = true;
      setVisualState(true);
      playPhrase(bus);
    } catch (err) {
      label.textContent = 'Your browser could not play sound';
    }
  }

  button.addEventListener('click', () => { playing ? stop() : start(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stop(); });
})();
</script>
</body>
</html>
