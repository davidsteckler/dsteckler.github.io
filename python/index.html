<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,rgba(127,156,255,.12),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}header{padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:rgba(8,13,24,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#5d7dff,#89a7ff);color:#081126;font-weight:900;font-size:19px;box-shadow:0 10px 28px rgba(93,125,255,.28)}h1{font-size:18px;line-height:1.1;margin:0;letter-spacing:-.02em}.sub{font-size:12px;color:var(--muted);margin:3px 0 0}.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}button,select{appearance:none;-webkit-appearance:none;min-height:40px;border:1px solid var(--line);border-radius:11px;background:#151f36;color:var(--text);padding:0 12px;font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation}button:hover,select:hover{border-color:#405177;background:#192540}button:focus-visible,select:focus-visible{outline:3px solid rgba(127,156,255,.35);outline-offset:2px}.run{background:var(--accent);border-color:var(--accent);color:#071025;font-weight:850;min-width:94px}.run:hover{background:var(--accent2);border-color:var(--accent2)}button:disabled{opacity:.55;cursor:wait}main{padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:14px;min-height:0}.pane{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);min-height:0}.paneHead{height:48px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#121a2e}.title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px rgba(89,216,156,.45)}.status{font-size:12px;color:var(--muted);white-space:nowrap}.editorWrap{height:calc(100dvh - 153px);min-height:430px}.editor{width:100%;height:100%;font-size:16px}.right{display:grid;grid-template-rows:minmax(300px,1fr) auto;gap:14px;min-height:0}.consolePane{display:grid;grid-template-rows:48px 1fr;min-height:0}.output{margin:0;padding:15px;overflow:auto;overscroll-behavior:contain;white-space:pre-wrap;word-break:break-word;background:#070c16;color:#dce6ff;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.error{color:#ffb5bf}.tips{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.tips strong{font-size:13px}.tips p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}kbd{padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:#151f36;color:var(--text);font:11px ui-monospace,monospace}.mobileRun{display:none}.loading{color:var(--muted)}
@media(max-width:900px){header{align-items:flex-start;flex-direction:column}.toolbar{width:100%;justify-content:flex-start}.toolbar>*{flex:1 1 auto}main{grid-template-columns:1fr;overflow:visible}.editorWrap{height:54dvh;min-height:360px}.right{grid-template-rows:minmax(280px,42dvh) auto}.pane{box-shadow:none}.sub{display:none}}
@media(max-width:560px){header{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));gap:10px}.mark{width:38px;height:38px;border-radius:11px}h1{font-size:17px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr}.toolbar select{grid-column:1/-1;width:100%}.toolbar button{padding:0 8px;font-size:13px}.toolbar .run{display:none}main{padding:10px max(10px,env(safe-area-inset-right)) calc(82px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:10px}.paneHead{height:44px;padding:0 11px}.status{font-size:11px}.editorWrap{height:52dvh;min-height:330px}.right{gap:10px}.tips{display:none}.mobileRun{display:block;position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;height:52px;border-radius:14px;background:var(--accent);border-color:var(--accent);color:#071025;font-weight:900;box-shadow:0 12px 36px rgba(0,0,0,.42)}.ace_mobile-menu{display:none!important}.ace_editor{font-size:16px!important}}

<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">Py</div><div><h1>Python Editor</h1><p class="sub">Write and run real Python in your browser.</p></div></div>
  <div class="toolbar">
    <select id="examples" aria-label="Load example"><option value="">Examples</option><option value="hello">Hello World</option><option value="loop">For Loop</option><option value="function">Function</option><option value="list">Lists</option><option value="input">Input</option></select>
    <button id="resetBtn">Reset</button><button id="downloadBtn">Download .py</button><button id="runBtn" class="run">▶ Run</button>
  </div>
</header>
<main>
  <section class="pane">
    <div class="paneHead"><div class="title"><span class="dot"></span>main.py</div><div class="status" id="engineStatus">Loading Python…</div></div>
    <div class="editorWrap"><div id="editor" class="editor" aria-label="Python code editor"></div></div>
  </section>
  <section class="right">
    <section class="pane consolePane"><div class="paneHead"><div class="title">Console</div><button id="clearBtn">Clear</button></div><pre id="output" class="output"><span class="loading">Loading Python…</span></pre></section>
    <section class="tips"><strong>Shortcuts</strong><p><kbd>Ctrl</kbd> + <kbd>Enter</kbd> on Windows or <kbd>⌘</kbd> + <kbd>Enter</kbd> on Mac runs the program.</p><p>Your code saves automatically on this device. Python runs locally in the browser.</p></section>
  </section>
</main>
<button id="mobileRun" class="mobileRun">▶ Run Python</button>
</div>
<script>
(function(){
'use strict';
var STARTER = '# Welcome to the Python Editor!\n\nname = "Python"\nprint("Hello from", name)\n\nfor number in range(1, 6):\n    print("Count:", number)\n';
var EXAMPLES = {
 hello:'print("Hello, world!")',
 loop:'for i in range(10):\n    print(i)',
 function:'def greet(name):\n    return f"Hello, {name}!"\n\nprint(greet("Ada"))',
 list:'languages = ["Python", "JavaScript", "Java", "C++"]\n\nfor language in languages:\n    print(language)',
 input:'name = input("What is your name? ")\nprint("Hello,", name)'
};
var output=document.getElementById('output');
var runBtn=document.getElementById('runBtn');
var mobileRun=document.getElementById('mobileRun');
var clearBtn=document.getElementById('clearBtn');
var resetBtn=document.getElementById('resetBtn');
var downloadBtn=document.getElementById('downloadBtn');
var examples=document.getElementById('examples');
var engineStatus=document.getElementById('engineStatus');
var pyodide=null, running=false;
var editor=ace.edit('editor');
editor.setTheme('ace/theme/tomorrow_night');
editor.session.setMode('ace/mode/python');
editor.session.setUseWorker(false);
editor.setOptions({fontSize:'16px',showPrintMargin:false,tabSize:4,useSoftTabs:true,wrap:true,highlightActiveLine:true,displayIndentGuides:true,showFoldWidgets:true});
editor.renderer.setScrollMargin(8,8,0,0);
var saved='';
try{saved=localStorage.getItem('dsteckler-python-code')||'';}catch(e){}
editor.setValue(saved||STARTER,-1);
var saveTimer=null;
editor.session.on('change',function(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){try{localStorage.setItem('dsteckler-python-code',editor.getValue());}catch(e){}},150);});
function setOutput(text,isError){output.textContent=text||'';output.classList.toggle('error',!!isError);output.scrollTop=output.scrollHeight;}
function appendOutput(text,isError){if(output.querySelector('.loading'))output.textContent='';if(isError)output.classList.add('error');output.textContent+=text;output.scrollTop=output.scrollHeight;}
function setRunState(on){running=on;runBtn.disabled=on||!pyodide;mobileRun.disabled=on||!pyodide;runBtn.textContent=on?'Running…':'▶ Run';mobileRun.textContent=on?'Running…':'▶ Run Python';}
async function boot(){setRunState(false);try{pyodide=await loadPyodide();pyodide.setStdout({batched:function(t){appendOutput(t+'\n',false);}});pyodide.setStderr({batched:function(t){appendOutput(t+'\n',true);}});pyodide.setStdin({stdin:function(){var v=window.prompt('Python input:');return v===null?'':v;}});engineStatus.textContent='Python 3 • Ready';setOutput('Python is ready.\n',false);setRunState(false);}catch(err){engineStatus.textContent='Python failed to load';setOutput('Python could not load. Check your internet connection and refresh the page.\n\n'+String(err),true);}}
async function run(){if(!pyodide||running)return;setRunState(true);setOutput('',false);try{await pyodide.runPythonAsync(editor.getValue());if(!output.textContent.trim())setOutput('Program finished with no output.\n',false);}catch(err){appendOutput(String(err)+'\n',true);}finally{setRunState(false);}}
runBtn.addEventListener('click',run);mobileRun.addEventListener('click',run);clearBtn.addEventListener('click',function(){setOutput('',false);});
resetBtn.addEventListener('click',function(){if(!window.confirm('Reset the editor to the starter code?'))return;editor.setValue(STARTER,-1);try{localStorage.setItem('dsteckler-python-code',STARTER);}catch(e){}setOutput('Editor reset.\n',false);editor.focus();});
downloadBtn.addEventListener('click',function(){var blob=new Blob([editor.getValue()],{type:'text/x-python;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='main.py';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);});
examples.addEventListener('change',function(){var key=examples.value;if(key&&EXAMPLES[key]){editor.setValue(EXAMPLES[key],-1);editor.focus();}examples.value='';});
editor.commands.addCommand({name:'runPython',bindKey:{win:'Ctrl-Enter',mac:'Command-Enter'},exec:run});
window.addEventListener('orientationchange',function(){setTimeout(function(){editor.resize();},250);});
window.addEventListener('resize',function(){editor.resize();});
setRunState(false);boot();
})();
</script>
</body>
</html>
