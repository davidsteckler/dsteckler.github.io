<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Caverns: Bastion — Visual Overhaul</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#03050a;color:#dfeaff;font-family:system-ui}#boot{opacity:.8;letter-spacing:.08em}</style></head><body><div id="boot">Forging the Crystal Bastion…</div><script>(async()=>{const patchFiles=['assets/crystal6patch.1.b64?v=6.1','assets/crystal6patch.2.b64?v=6.1','assets/crystal6patch.3.b64?v=6.1','assets/crystal6patch.4.b64?v=6.1','assets/crystal6patch.5.b64?v=6.1'];const [base,css,...encodedParts]=await Promise.all([fetch('crystal5.html?v=6.1').then(r=>{if(!r.ok)throw Error('base '+r.status);return r.text()}),fetch('assets/crystal6.css?v=6.1').then(r=>{if(!r.ok)throw Error('css '+r.status);return r.text()}),...patchFiles.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()}))]);const enc=encodedParts.join('').trim();const bytes=Uint8Array.from(atob(enc),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const patch=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();let html=base.replace('<title>Crystal Caverns: Bastion</title>','<title>Crystal Caverns: Bastion — Visual Overhaul</title>').replace('</head>','<style id="visual-overhaul-v6">'+css+'</style></head>');html=html.replace('dist(u,p)<28','dist(u,p)<42').replace('dist(u,p)<34','dist(u,p)<48').replace('dist(u,p)<30','dist(u,p)<42');html=html.replace('function loop(now){',patch+'\nfunction loop(now){');document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">Could not load Crystal Caverns v6: '+e+'</pre>'})</script></body></html>
