<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Caverns: Bastion v9</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#03050a;color:#dfeaff;font-family:system-ui}#boot{opacity:.8;letter-spacing:.08em}</style></head><body><div id="boot">Opening the Bastion…</div><script>(async()=>{const files=['assets/crystal9.1.b64','assets/crystal9.2.b64','assets/crystal9.3.b64','assets/crystal9.4.b64','assets/crystal9.5.b64'];const parts=await Promise.all(files.map(x=>fetch(x+'?v=9.0').then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.text()})));const s=parts.join('').trim();const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">Could not load Crystal Caverns v9: '+e+'</pre>'})</script></body></html>
