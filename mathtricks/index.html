function stepHTML(p,count=p.steps.length){return `<ol class="steps">${p.steps.slice(0,count).map((s,i)=>`<li class="step"><strong>Step ${i+1}</strong>${s.text}<code>${s.value}</code></li>`).join('')}</ol>`}
function render(){if(mode==='learn'){let l=lessons[selected];if(!example)example=l.solve(...l.gen());work.innerHTML=heading()+`<div class="equation">${example.q}${shown>example.steps.length?' = '+F(example.answer):''}</div><div class="small">Step ${Math.min(shown,example.steps.length)} of ${example.steps.length}</div>`+stepHTML(example,shown)+`<div class="controls"><button id="back" ${shown<=1?'disabled':''}>← Back</button><button class="primary" id="next" ${shown>example.steps.length?'disabled':''}>${shown===example.steps.length?'Reveal answer':'Next step →'}</button><button id="new">New example</button><button id="try">Try it yourself</button></div><details><summary>Why it works</summary><p>${l.why}</p></details>`+(l.range?`<div class="numberedit"><label>Your number (${l.range[0]}–${l.range[1]})<input id="a" type="number" min="${l.range[0]}" max="${l.range[1]}" value="${l.gen()[0]}"></label>${l.gen().length>1?`<label>Second number<input id="b" type="number" min="${l.range[0]}" max="${l.range[1]}" value="${l.gen()[1]}"></label>`:''}<button id="custom">Explore these numbers</button></div><p id="customerr" role="status"></p>`:'');$('back').onclick=()=>{shown--;render()};$('next').onclick=()=>{shown++;render()};$('new').onclick=()=>{example=l.solve(...l.gen());shown=1;render()};$('try').onclick=()=>setMode('practice');if($('custom'))$('custom').onclick=()=>{let inputs=[$('a'),$('b')].filter(Boolean),ns=inputs.map(i=>Number(i.value));if(inputs.some((i,j)=>!i.value||!Number.isInteger(ns[j])||ns[j]<l.range[0]||ns[j]>l.range[1])){$('customerr').textContent='Enter whole numbers in the stated range.';return}if(l.title==='Doubling and halving'&&ns[0]%2){$('customerr').textContent='Make the first factor even.';return}example=l.solve(...ns);shown=1;render()};}else if(mode==='practice'){work.innerHTML=heading()+`<p class="small">No timer. Use a hint when you need one.</p><div class="stats" id="stats"></div><div id="question"></div>`;newQuestion();}else{work.innerHTML=`<span class="badge">GAME MODE</span><h2 style="margin-top:16px">Math sprint</h2><p>60 seconds. Earn 10 points per answer, plus a streak bonus. Wrong answers stay available for review.</p><label for="pool">Question pool</label> <select id="pool"><option value="selected">Selected trick: ${lessons[selected].title}</option><option value="mixed">Mix all tricks</option></select><p><button id="start" class="primary">Start game</button></p><div id="gamearea"></div>`;$('start').onclick=startGame;}}
function newQuestion(){let index=mode==='game'&&mixed?R(0,lessons.length-1):selected;question={...lessons[index].solve(...lessons[index].gen()),index};answered=false;let host=mode==='game'?$('gamearea'):$('question');host.innerHTML=`${mode==='game'?'<div class="stats" id="stats"></div><div class="meter"><span id="timebar" style="width:100%"></span></div><p class="small">'+lessons[index].title+'</p>':''}<div class="equation">${question.q}</div><form id="answerform"><div class="controls">${typeof question.answer==='string'?'<button type="button" data-answer="yes">Yes</button><button type="button" data-answer="no">No</button>':'<label for="answer" class="small">Your answer</label><input id="answer" class="answer" inputmode="decimal" autocomplete="off"><button class="primary" id="check">Check answer</button>'}</div></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="controls"><button id="hint">${mode==='game'?'Skip & review':'Hint / show steps'}</button><button id="another" hidden>Next question →</button></div><div id="hintarea"></div>`;$('answerform').onsubmit=e=>{e.preventDefault();check($('answer').value)};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b.dataset.answer));$('another').onclick=newQuestion;$('hint').onclick=()=>{if(mode==='game'){missed.push(question);streak=0;round++;newQuestion()}else{$('hintarea').innerHTML=stepHTML(question);$('hint').disabled=true}};updateStats();if($('answer'))$('answer').focus();}
function check(raw){if(answered||mode==='game'&&!active)return;let value=typeof question.answer==='string'?raw:raw.trim().replace(/,/g,'');if(value===''){ $('feedback').textContent='Enter an answer first.';return }let correct=typeof question.answer==='string'?value===question.answer:Number(value)===question.answer;if(correct){answered=true;streak++;score+=mode==='game'?10+Math.min(streak-1,5)*2:1;round++;progress[question.index]=(progress[question.index]||0)+1;save();catalog();$('feedback').className='feedback good';$('feedback').textContent=mode==='game'?`Correct! +${10+Math.min(streak-1,5)*2} points`:'Correct! You’ve got it.';work.classList.remove('celebrate');void work.offsetWidth;work.classList.add('celebrate');$('another').hidden=false;document.querySelectorAll('[data-answer],#check,#answer').forEach(b=>b.disabled=true);$('another').focus();}else{streak=0;$('feedback').className='feedback wrong';$('feedback').textContent=mode==='game'?`Answer: ${F(question.answer)}. Added to review.`:'Try again. Use the steps to find where your answer changed.';if(mode==='game'){answered=true;round++;missed.push(question);$('another').hidden=false;document.querySelectorAll('[data-answer],#check,#answer').forEach(b=>b.disabled=true);$('another').focus();}}updateStats();}
function updateStats(){if(!$('stats'))return;$('stats').innerHTML=mode==='game'?`<strong>${score} points</strong><span>${streak} streak</span><strong>${Math.max(0,Math.ceil((end-Date.now())/1000))}s left</strong>`:`<strong>${score} correct this session</strong><span>${progress[selected]||0} correct on this trick</span>`;}
function startGame(){stop();mixed=$('pool').value==='mixed';score=streak=round=0;missed=[];end=Date.now()+60000;active=true;$('start').disabled=true;$('pool').disabled=true;newQuestion();timer=setInterval(()=>{updateStats();if($('timebar'))$('timebar').style.width=Math.max(0,(end-Date.now())/600)+'%';if(Date.now()>=end)finishGame()},200);}
function finishGame(){stop();let best=0;try{best=Number(localStorage.getItem('mathtricks-best')||0);if(score>best){best=score;localStorage.setItem('mathtricks-best',best)}}catch{}$('gamearea').innerHTML=`<div class="equation">${score} points</div><p>${round} questions completed · Best score: ${best}</p><button id="again" class="primary">Play again</button><h3>Review ${missed.length?missed.length+' skipped or missed questions':'complete — no missed questions'}</h3>${missed.map(p=>`<details><summary>${p.q} → ${F(p.answer)}</summary>${stepHTML(p)}</details>`).join('')}`;$('again').onclick=()=>{render();startGame()};$('start').disabled=false;$('pool').disabled=false;}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('search').oninput=catalog;$('total').textContent=lessons.length+' interactive tricks · Progress saved on this device';catalog();render();
</script></body></html>
