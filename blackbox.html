  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark" />
  <style>
    :root{
      --bg0:#05060a;
      --bg1:#070a12;

      --panel: rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.12);

      --text: rgba(245,248,255,0.90);

      /* electricity palette */
      --blue:#7db6ff;
      --mint:#86f3c6;
      --warm:#ffd07a;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --max: 980px;
      --r: 18px;
      --shadow: 0 22px 90px rgba(0,0,0,0.62);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: var(--mono);
      color: var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(1200px 640px at 18% 18%, rgba(125,182,255,0.12), transparent 55%),
        radial-gradient(900px 520px at 82% 22%, rgba(134,243,198,0.10), transparent 55%),
        radial-gradient(800px 440px at 45% 92%, rgba(255,208,122,0.07), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 34px 16px 70px;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(620px 260px at 15% 0%, rgba(125,182,255,0.18), transparent 55%),
        radial-gradient(620px 260px at 85% 0%, rgba(134,243,198,0.16), transparent 55%);
      opacity: 0.30;
      pointer-events:none;
      filter: blur(7px);
    }

    .content{
      position:relative;
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    /* TOP ELECTRIC “BUS” */
    .busRow{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap: 10px;
      padding: 6px 2px 0;
    }

    .bus{
      display:flex;
      gap:6px;
      align-items:center;

      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.035);

      cursor:pointer;
      user-select:none;

      opacity:0.78;
      transition: opacity 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    .bus:hover{
      opacity:0.98;
      transform: translateY(-1px);
      border-color: rgba(134,243,198,0.26);
    }

    .led{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05);
      transition: background 120ms ease, box-shadow 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .bus:hover .led{
      animation: breathe 1.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 70ms);
    }

    @keyframes breathe{
      0%, 100%{ transform: translateY(0px); }
      50%{ transform: translateY(-1px); }
    }

    .led.on{
      background: rgba(134,243,198,0.65);
      border-color: rgba(134,243,198,0.40);
      box-shadow: 0 0 14px rgba(134,243,198,0.25);
      animation:none;
      transform: translateY(-1px);
    }

    .led.off{
      background: rgba(125,182,255,0.12);
      border-color: rgba(125,182,255,0.20);
      box-shadow:none;
      animation:none;
      transform: translateY(0px);
    }

    .trace{
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(125,182,255,0.00), rgba(125,182,255,0.28), rgba(134,243,198,0.22), rgba(255,208,122,0.16), rgba(125,182,255,0.00));
      opacity:0.40;
      border-radius: 999px;
    }

    .binaryBox{
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      background: rgba(0,0,0,0.30);
      padding: 16px;
      position:relative;
    }

    .binaryCanvas{
      display:block;
      width:100%;
      margin:0;
      font-family:var(--mono);
      cursor:crosshair;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      touch-action:manipulation;
      outline:none;
    }

    .binaryCanvas:focus-visible{
      outline:2px solid rgba(134,243,198,0.65);
      outline-offset:5px;
      border-radius:3px;
    }

    ::selection{ background: rgba(134,243,198,0.22); }

    /* hidden gate to Part 2 */
    .gate{
      margin-top: 10px;
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
      opacity:0.10;
      transition:opacity 180ms ease, transform 180ms ease;
      font-size:13px;
    }

    .gate:hover,
    .gate:focus-within{
      opacity:0.92;
      transform:translateY(-1px);
    }

    .gatePrompt{
      color:rgba(134,243,198,0.75);
      align-self:flex-start;
      padding-top:10px;
    }

    .gateBody{
      flex:1 1 520px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .gateLabel{
      color:rgba(245,248,255,0.58);
    }

    .gateHint{
      color:rgba(245,248,255,0.42);
      font-size:12px;
      line-height:1.55;
    }

    .gate textarea{
      width:100%;
      min-height:118px;
      resize:vertical;
      border:1px solid rgba(255,255,255,0.12);
      border-radius:8px;
      background:rgba(0,0,0,0.28);
      color:rgba(245,248,255,0.92);
      font-family:var(--mono);
      padding:10px 11px;
      outline:none;
      line-height:1.5;
    }

    .gate textarea:focus{
      border-color:rgba(134,243,198,0.45);
      box-shadow:0 0 18px rgba(134,243,198,0.10);
    }

    .gate button{
      align-self:flex-start;
      border:1px solid rgba(134,243,198,0.28);
      border-radius:8px;
      background:rgba(134,243,198,0.08);
      color:rgba(245,248,255,0.86);
      font-family:var(--mono);
      padding:9px 12px;
      cursor:pointer;
    }

    .gate button:hover{
      background:rgba(134,243,198,0.13);
      border-color:rgba(134,243,198,0.44);
    }

    #gateMsg{
      color:rgba(255,208,122,0.72);
      font-size:12px;
      min-height:18px;
    }

    .signal{
      display:none;
      margin-top:2px;
      padding:10px 12px;
      border-left:2px solid rgba(125,182,255,0.28);
      color:rgba(125,182,255,0.62);
      font-size:12px;
      line-height:1.55;
      letter-spacing:.02em;
    }

    .signal.show{
      display:block;
      animation:signalIn 220ms ease both;
    }

    @keyframes signalIn{
      from{opacity:0;transform:translateY(3px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media (max-width: 520px){
      .wrap{ padding-top: 24px; }
      .content{ padding: 14px; }
      .binaryBox{ padding: 14px; }
      .bus{ padding: 7px 9px; }
      .trace{ display:none; }
      .busRow{ justify-content:flex-start; }

      .gateHint{
        padding-left: 0;
      }
    }

<body data-student-area="challenges" data-student-layout="flow">
  <div class="wrap">
    <div class="card">
      <div class="content">
        <!-- (egg) If you're hunting for meaning, start by grouping what repeats. -->

        <!-- Electricity “first”: sits ABOVE the binary -->
        <div class="busRow">
          <div class="trace" aria-hidden="true"></div>
          <div class="bus" id="bus">
            <span class="led" style="--i:0"></span>
            <span class="led" style="--i:1"></span>
            <span class="led" style="--i:2"></span>
            <span class="led" style="--i:3"></span>
            <span class="led" style="--i:4"></span>
            <span class="led" style="--i:5"></span>
            <span class="led" style="--i:6"></span>
            <span class="led" style="--i:7"></span>
          </div>
        </div>

        <p style="margin:0 0 2px;color:rgba(245,248,255,0.58);font-size:13px;line-height:1.6;">A transmission was found.</p>

        <div class="binaryBox">
<canvas id="b" class="binaryCanvas" tabindex="0" role="img" aria-label="Binary transmission displayed in groups of eight. Click a group, or use the arrow keys to choose one, to light the eight LEDs."></canvas>
        </div>

        <div class="signal" id="signal" aria-live="polite"></div>

        <div class="gate" title="Paste the decoded transmission to prove you found it.">
          <span class="gatePrompt">&gt;</span>

          <div class="gateBody">
            <span class="gateLabel">paste the full transmission:</span>
            <textarea id="gateMessage" placeholder="paste the decoded message here" autocomplete="off" spellcheck="false"></textarea>
            <button id="checkGateBtn" type="button">open the next door</button>
            <span id="gateMsg"></span>
            <div class="gateHint">
              capitalization, punctuation, spaces, and line breaks do not have to be perfect
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById("b");
      const ctx = canvas.getContext("2d");
      const bus = document.getElementById("bus");
      const leds = Array.from(bus.querySelectorAll(".led"));

      const raw = [
        "01000011 01001111 01001110 01000111 01010010 01000001 01010100 01010011 00101110 00001010",
        "01011001 01001111 01010101 00100000 01001010 01010101 01010011 01010100 00100000 01010100",
        "01010010 01000001 01001110 01010011 01001100 01000001 01010100 01000101 01000100 00100000",
        "01000101 01001100 01000101 01000011 01010100 01010010 01001001 01000011 01001001 01010100",
        "01011001 00100000 01001001 01001110 01010100 01001111 00100000 01010100 01001000 01001111",
        "01010101 01000111 01001000 01010100 00101110 00001010 01000001 00100000 01001100 01001111",
        "01010100 00100000 01001111 01000110 00100000 01000110 01010101 01010100 01010101 01010010",
        "01000101 01010011 00100000 01010011 01010100 01000001 01010010 01010100 00100000 01010111",
        "01001001 01010100 01001000 00100000 01001111 01001110 01000101 00100000 01001100 01010101",
        "01000011 01001011 01011001 00100000 01000010 01010010 01000101 01000001 01001011 00101110",
        "00001010 01010100 01001000 01001001 01010011 00100000 01000011 01000001 01001110 00100000",
        "01000010 01000101 00100000 01011001 01001111 01010101 01010010 01010011 00101100 00100000",
        "01001001 01000110 00100000 01011001 01001111 01010101 00100000 01001110 01001111 01010100",
        "01001001 01000011 01000101 00100000 01001001 01010100 00100000 01000001 01001110 01000100",
        "00100000 01001011 01000101 01000101 01010000 00100000 01000111 01001111 01001001 01001110",
        "01000111 00101110 00001010 01010100 01001000 01001001 01010011 00100000 01001101 01000101",
        "01010011 01010011 01000001 01000111 01000101 00100000 01001101 01000001 01011001 00100000",
        "01001110 01001111 01010100 00100000 01000110 01010101 01001100 01001100 01011001 00100000",
        "01001101 01000001 01001011 01000101 00100000 01010011 01000101 01001110 01010011 01000101",
        "00100000 01011001 01000101 01010100 00101110 00001010 01001001 01000110 00100000 01011001",
        "01001111 01010101 00100000 01000011 01000001 01001110 00100000 01001101 01000001 01001011",
        "01000101 00100000 01001001 01010100 00100000 01000110 01010101 01010010 01010100 01001000",
        "01000101 01010010 00101100 00100000 01001001 01010100 00100000 01010111 01001001 01001100",
        "01001100 00101110 00001010 01010111 01001000 01000001 01010100 00100000 01010111 01001001",
        "01001100 01001100 00100000 01011001 01001111 01010101 00100000 01000010 01010101 01001001",
        "01001100 01000100 00100000 01010111 01001001 01010100 01001000 00100000 01001001 01010100",
        "00111111 00001010"
      ].join(" ");
      const chunks = raw.split(/\s+/);

      // Findable, but not a solution.
      canvas.dataset.groups = String(chunks.length);
      document.body.setAttribute("data-aux", "ivrj fbhpr");

      const signal = document.getElementById("signal");
      const interactionKey = "blackbox-part1-interactions";
      const failureKey = "blackbox-part1-failures";

      let interactions = Number(localStorage.getItem(interactionKey) || 0);
      let failures = Number(localStorage.getItem(failureKey) || 0);

      function currentClue(){
        if(interactions >= 24 || failures >= 4) return "65 = A";
        if(interactions >= 14 || failures >= 2) return "01000001 = 65";
        if(interactions >= 6 || failures >= 1) return "8 at a time";
        if(interactions >= 1) return "8";
        return "";
      }

      function refreshSignal(){
        const clue = currentClue();
        signal.textContent = clue;
        signal.classList.toggle("show", Boolean(clue));
      }

      function recordInteraction(amount = 1){
        interactions += amount;
        localStorage.setItem(interactionKey, String(interactions));
        refreshSignal();
      }

      refreshSignal();

      function showByte(bits){
        for(let i=0;i<8;i++){
          const bit = bits[i];
          leds[i].classList.remove("on","off");
          leds[i].classList.add(bit === "1" ? "on" : "off");
        }
      }

      function clearBus(){
        leds.forEach(l => l.classList.remove("on","off"));
      }

      // Draw the transmission as pixels, leaving no selectable binary text on the page.
      // Track the rectangle for each byte so tapping still drives the LED bus.
      let byteHitboxes = [];
      let selectedByte = -1;

      function drawBinary(){
        const width = Math.floor(canvas.getBoundingClientRect().width);
        if(width < 1) return;

        const compact = window.matchMedia("(max-width: 520px)").matches;
        const fontSize = compact ? 13 : 14;
        const lineHeight = fontSize * (compact ? 1.6 : 1.65);
        const font = fontSize + "px " + getComputedStyle(canvas).fontFamily;
        ctx.font = font;

        // Draw each character separately to preserve the previous 0.06em spacing.
        const advance = ctx.measureText("0").width + fontSize * 0.06;
        const byteWidth = advance * 8;
        const boxes = [];
        let x = 0;
        let y = 0;

        chunks.forEach((bits, index) => {
          if(x > 0 && x + byteWidth > width){
            x = 0;
            y += lineHeight;
          }
          boxes.push({ x, y, width:byteWidth, height:lineHeight, bits, index });
          x += byteWidth + advance;
        });

        const height = Math.ceil(y + lineHeight + 2);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.height = height + "px";
        canvas.width = Math.ceil(width * dpr);
        canvas.height = Math.ceil(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.font = font;
        ctx.textBaseline = "top";

        boxes.forEach(box => {
          if(box.index === selectedByte){
            ctx.fillStyle = "rgba(134,243,198,0.12)";
            ctx.fillRect(box.x, box.y + 1, box.width, lineHeight - 2);
          }

          ctx.fillStyle = "rgba(245,248,255,0.88)";
          for(let i = 0; i < 8; i++){
            ctx.fillText(box.bits[i], box.x + i * advance, box.y);
          }
        });
        byteHitboxes = boxes;
      }

      function activateByte(index){
        if(index < 0 || index >= chunks.length) return;
        selectedByte = index;
        drawBinary();
        const bits = chunks[index];
        showByte(bits);
        bus.title = bits;
        canvas.setAttribute("aria-label", "Binary group " + (index + 1) + " of " + chunks.length + ": " + bits + ". Use the arrow keys for the next group.");
        recordInteraction(1);
      }

      canvas.addEventListener("click", e => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const hit = byteHitboxes.find(box =>
          x >= box.x && x < box.x + box.width &&
          y >= box.y && y < box.y + box.height
        );
        if(hit) activateByte(hit.index);
      });

      canvas.addEventListener("keydown", e => {
        if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
          e.preventDefault();
          const delta = e.key === "ArrowRight" ? 1 : -1;
          const next = selectedByte < 0 ? 0 : Math.max(0, Math.min(chunks.length - 1, selectedByte + delta));
          activateByte(next);
        }else if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          activateByte(selectedByte < 0 ? 0 : selectedByte);
        }
      });

      // Disable routine copy, right-click and drag operations on the binary canvas.
      canvas.addEventListener("copy", e => e.preventDefault());
      canvas.addEventListener("contextmenu", e => e.preventDefault());
      canvas.addEventListener("dragstart", e => e.preventDefault());

      drawBinary();
      window.addEventListener("resize", () => window.requestAnimationFrame(drawBinary));
      if(document.fonts && document.fonts.ready){
        document.fonts.ready.then(drawBinary);
      }

      // The bus reacts, but does not explain itself.
      bus.addEventListener("click", (e) => {
        e.stopPropagation();
        recordInteraction(1);
      });

      // If they click outside, clear back to “idle”
      window.addEventListener("click", (e) => {
        if(!canvas.contains(e.target) && !bus.contains(e.target)){
          clearBus();
          bus.removeAttribute("title");
        }
      });

      // Hidden gate to Part 2
      const gateMessage = document.getElementById("gateMessage");
      const checkGateBtn = document.getElementById("checkGateBtn");
      const gateMsg = document.getElementById("gateMsg");

      function normalizeMessage(value){
        return value
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, "");
      }

      function decodedTransmission(){
        return chunks
          .map(bits => String.fromCharCode(parseInt(bits, 2)))
          .join("");
      }

      function editDistance(a, b){
        if(a === b) return 0;
        if(!a.length) return b.length;
        if(!b.length) return a.length;

        const previous = Array.from({ length: b.length + 1 }, (_, i) => i);
        const current = new Array(b.length + 1);

        for(let i = 1; i <= a.length; i++){
          current[0] = i;

          for(let j = 1; j <= b.length; j++){
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            current[j] = Math.min(
              current[j - 1] + 1,
              previous[j] + 1,
              previous[j - 1] + cost
            );
          }

          for(let j = 0; j <= b.length; j++){
            previous[j] = current[j];
          }
        }

        return previous[b.length];
      }

      function similarity(a, b){
        const left = normalizeMessage(a);
        const right = normalizeMessage(b);
        const longest = Math.max(left.length, right.length);

        if(longest === 0) return 1;
        return 1 - (editDistance(left, right) / longest);
      }

      function checkGate(){
        const student = gateMessage.value;
        const acceptedTransmissions = [
          decodedTransmission(),
          `CONGRATS.
YOU JUST TRANSLATED ELECTRICITY INTO THOUGHT.
A LOT OF FUTURES START WITH ONE LUCKY BREAK.
THIS CAN BE YOUS, IF YOU KEEP GOING.
NOW GO BUILD.`
        ];
        const score = Math.max(
          ...acceptedTransmissions.map(expected => similarity(student, expected))
        );

        if(score >= 0.95){
          gateMsg.textContent = "transmission accepted. opening...";
          checkGateBtn.disabled = true;
          gateMessage.disabled = true;

          setTimeout(() => {
            window.location.href = "https://dsteckler.com/blackbox2s.html";
          }, 650);
        }else{
          failures += 1;
          localStorage.setItem(failureKey, String(failures));
          refreshSignal();

          if(score >= 0.80){
            gateMsg.textContent = "almost there. one part of the transmission is missing or changed.";
          }else{
            gateMsg.textContent = "that does not match the full transmission yet.";
          }
        }
      }

      checkGateBtn.addEventListener("click", checkGate);

      gateMessage.addEventListener("keydown", (e) => {
        if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){
          checkGate();
        }
      });
    })();
  </script>

  <!--
    NOTES
    Findable eggs:
    1) View Source comment: “grouping what repeats”
    2) Click a group: the 8-LED bus mirrors its pattern
    3) Repeated interaction slowly reveals a rescue path
    4) body[data-aux] ROT13 “view source” (ivrj fbhpr)
    5) Hidden gate:
       paste the full decoded transmission
       formatting is ignored; small transcription mistakes are tolerated
  -->
</body>
