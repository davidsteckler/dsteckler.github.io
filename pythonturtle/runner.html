<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turtle drawing</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:auto;background:white}#drawing{position:relative;width:100%;height:100%;overflow:hidden}#drawing>div{margin:auto!important}#hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#737c78;font:14px/1.8 system-ui;pointer-events:none}#hint strong{color:#202525;font-weight:550}canvas{max-width:100%}</style></head><body><div id="hint"><strong>Your drawing starts here.</strong><span>Run the code to move the turtle.</span></div><div id="drawing"></div>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script>
(()=>{
'use strict';
let running=false;
// Keep turtle animation progressing when an embedded canvas is not being repainted.
window.requestAnimationFrame=callback=>window.setTimeout(()=>callback(performance.now()),1000/60);
window.cancelAnimationFrame=id=>window.clearTimeout(id);
function send(type,data={}){parent.postMessage(Object.assign({type},data),'*');}
if(!window.Sk||!Sk.builtinFiles){send('load-error',{text:'The Python runtime could not load. Check your connection and refresh the page.'});return;}
window.addEventListener('message',async e=>{
 if(e.source!==parent||!e.data||e.data.type!=='run'||running)return;
 const {code,session,width,height}=e.data;if(typeof code!=='string')return;running=true;
 document.getElementById('hint').hidden=true;document.getElementById('hint').style.display='none';
 if(Sk.TurtleGraphics&&Sk.TurtleGraphics.reset)Sk.TurtleGraphics.reset();
 Object.assign(Sk.TurtleGraphics||(Sk.TurtleGraphics={}),{target:'drawing',width:Math.max(250,width),height:Math.max(250,height)});
 Sk.configure({output:text=>send('output',{session,text}),read:path=>{if(Sk.builtinFiles.files[path]===undefined)throw new Error('File not found: '+path);return Sk.builtinFiles.files[path];},__future__:Sk.python3,execLimit:55000,yieldLimit:100,inputfun:question=>Promise.resolve(prompt(question)||''),inputfunTakesPrompt:true});
 try{await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true));send('done',{session});}
 catch(error){send('error',{session,text:error.toString()});}
 finally{running=false;}
});
send('ready');
})();
</script></body></html>
