<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Bulbs: a story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--fg:#14213a;--muted:#5d6b85;--line:#cfd8e6;--off:#d9dfea;--offs:#b5c0d3;--on:#ffc93c;--glow:#ff9d00;--accent:#a51c30;--btn:#14213a;--btnfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#15203a;--fg:#eaf0fb;--muted:#93a2c0;--line:#2a3757;--off:#26324f;--offs:#3b4a6e;--btn:#eaf0fb;--btnfg:#0d1526;--accent:#ff6b7f}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#15203a;--fg:#eaf0fb;--muted:#93a2c0;--line:#2a3757;--off:#26324f;--offs:#3b4a6e;--btn:#eaf0fb;--btnfg:#0d1526;--accent:#ff6b7f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 14px}
h2{font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.cap{font-size:clamp(17px,3.8vw,21px);min-height:5.6em;margin:0 0 14px;max-width:60ch}
.cap.in{animation:cap .45s ease-out}
@keyframes cap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cap b{color:var(--accent)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 10px 14px}
.scroll{overflow-x:auto}
#bulbs{display:flex;gap:4px;justify-content:center;min-width:300px}
.cell{flex:1 1 0;min-width:34px;max-width:96px;text-align:center}
.pv{font-weight:800;font-size:clamp(14px,3.4vw,22px);transition:color .2s}
.pw{color:var(--muted);font-size:13px}
.nopv .pv,.nopv .pw{visibility:hidden}
.bulb{all:unset;display:block;width:100%;max-width:74px;margin:4px auto}
.free .bulb{cursor:pointer}
.bulb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.bulb svg{width:100%;height:auto;display:block;overflow:visible;transition:transform .25s}
.glass{fill:var(--off);stroke:var(--offs);stroke-width:2;transition:fill .25s}
.base{fill:var(--offs)}
.fil{fill:none;stroke:var(--offs);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on .glass{fill:var(--on);stroke:var(--glow);filter:drop-shadow(0 0 12px var(--glow))}
.on .fil{stroke:#fff}
.bit{font-weight:800;font-size:clamp(18px,4.5vw,28px)}
.on .bit{color:var(--accent)}
.flip svg{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.enter{animation:enter .6s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(-16px) scale(.8)}to{opacity:1;transform:none}}
.hl .pv{color:var(--accent)}
.hl svg{transform:scale(1.12)}
.read{margin:16px 0 8px;text-align:center}
.dec{font-size:clamp(56px,16vw,96px);font-weight:800;line-height:1;letter-spacing:-.03em}
.eq{color:var(--muted);font-size:clamp(15px,3.6vw,20px);min-height:1.5em;margin-top:6px;overflow-wrap:anywhere}
.meta{color:var(--muted);margin-top:2px}
.meta b{color:var(--fg)}
.msg{font-size:clamp(34px,10vw,60px);font-weight:800;letter-spacing:.12em;color:var(--accent);min-height:1.2em}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:430px;margin:12px auto 16px}
.dot{width:10px;height:10px;padding:0;border-radius:50%;border:1.5px solid var(--offs);background:none;cursor:pointer}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 20px;border-radius:10px;cursor:pointer}
button.b.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
button.b:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.flip svg,.enter,.cap.in{animation:none}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V55DVP2SHR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V55DVP2SHR');
</script>
</head>
<body>
<main>
<h1>Binary Bulbs: one small step at a time</h1>
<h2 id="title"></h2>
<p class="cap" id="cap" aria-live="polite"></p>
<div class="stage"><div class="scroll"><div id="bulbs"></div></div></div>
<div class="read">
<div class="dec" id="dec">0</div>
<div class="eq" id="eq"></div>
<div class="meta">Binary <b id="bin"></b></div>
<div class="msg" id="msg"></div>
</div>
<div class="dots" id="dots"></div>
<div class="ctl">
<button class="b" id="back">Back</button>
<button class="b" id="replay">Replay</button>
<button class="b main" id="next">Next</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let bits=0,val=0,cur=0,tok=0,free=false,pv=false,last='';
const bulbSVG='<svg viewBox="0 0 60 90" aria-hidden="true"><path class="glass" d="M30 4C14 4 6 16 6 29c0 10 6 16 11 22 3 4 4 7 4 11h18c0-4 1-7 4-11 5-6 11-12 11-22C54 16 46 4 30 4z"/><path class="fil" d="M24 62L27 44L30 54L33 44L36 62"/><rect class="base" x="20" y="64" width="20" height="6" rx="2"/><rect class="base" x="22" y="72" width="16" height="6" rx="2"/></svg>';
function say(h){if(h===last)return;last=h;const c=$('cap');c.innerHTML=h;c.classList.remove('in');void c.offsetWidth;c.classList.add('in')}
async function w(ms){const t=tok;await sleep(ms);if(t!==tok)throw 0}
function hl(i){document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('hl',+c.dataset.i===i))}
function set(v){const o=val;val=v;render(o^v)}
function build(n){
  const prev=bits;bits=n;val=0;
  const box=$('bulbs');box.innerHTML='';
  for(let i=n-1;i>=0;i--){
    const c=document.createElement('div');c.className='cell'+(i>=prev?' enter':'');c.dataset.i=i;
    c.innerHTML='<div class="pv">'+(2**i)+'</div><button class="bulb" aria-label="Bulb worth '+(2**i)+'">'+bulbSVG+'</button><div class="bit">0</div><div class="pw">2<sup>'+i+'</sup></div>';
    c.querySelector('.bulb').onclick=()=>{if(free)set(val^(1<<i))};
    box.appendChild(c);
  }
  render(0);
}
function render(m){
  const on=[];
  document.querySelectorAll('.cell').forEach(c=>{
    const i=+c.dataset.i,o=(val>>i)&1;
    c.classList.toggle('on',!!o);
    c.querySelector('.bit').textContent=o;
    if(o)on.push(2**i);
    if((m>>i)&1){c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip')}
  });
  $('dec').textContent=val;
  $('eq').textContent=!pv?'':on.length>1?on.join(' + ')+' = '+val:on.length?'only the '+val+' bulb is lit':'no bulbs lit';
  $('bin').textContent=val.toString(2).padStart(bits,'0');
  if(free)say(val===42?'That is <b>32 + 8 + 2 = 42</b>. You just spoke binary.':'Your turn. Tap the bulbs to make any number from 0 to 255. Can you make <b>42</b>?');
}
const S=[
{t:'A switch has two states',n:1,go:async()=>{
  set(0);hl(-1);
  say('A computer is built from tiny switches. A switch has only two states: <b>off</b> or <b>on</b>.');
}},
{t:'Off means 0',n:1,go:async()=>{
  set(0);hl(0);
  say('When the switch is <b>off</b>, we write a <b>0</b>.');
}},
{t:'On means 1',n:1,go:async()=>{
  set(1);hl(0);
  say('When the switch is <b>on</b>, we write a <b>1</b>.');
}},
{t:'Add one more switch',n:2,go:async()=>{
  set(0);hl(-1);
  say('Add a second switch. Now we can arrange the two switches in more than one way.');
}},
{t:'Pattern 1: 00',n:2,go:async()=>{
  set(0);hl(-1);
  say('First pattern: <b>00</b>. Both switches are off.');
}},
{t:'Pattern 2: 01',n:2,go:async()=>{
  set(1);hl(0);
  say('Next pattern: <b>01</b>. Only the right switch is on.');
}},
{t:'Pattern 3: 10',n:2,go:async()=>{
  set(2);hl(1);
  say('Next pattern: <b>10</b>. Only the left switch is on.');
}},
{t:'Pattern 4: 11',n:2,go:async()=>{
  set(3);hl(-1);
  say('Last pattern: <b>11</b>. Both switches are on.');
}},
{t:'Two switches make four patterns',n:2,go:async()=>{
  set(3);hl(-1);
  say('With two switches we can make <b>4 patterns</b>: 00, 01, 10, and 11.');
}},
{t:'The right place is worth 1',n:2,pv:1,go:async()=>{
  set(1);hl(0);
  say('To turn a binary pattern into a number, give each place a value. Start on the right: it is worth <b>1</b>.');
}},
{t:'The next place is worth 2',n:2,pv:1,go:async()=>{
  set(2);hl(1);
  say('Move one place left. Its value doubles, so this place is worth <b>2</b>.');
}},
{t:'Read 11',n:2,pv:1,go:async()=>{
  set(3);hl(-1);
  say('Both bulbs are lit, so add their values: <b>2 + 1 = 3</b>. Binary 11 means 3.');
}},
{t:'Add a third place',n:3,pv:1,go:async()=>{
  set(4);hl(2);
  say('Add one more place on the left. The values keep doubling: 1, 2, then <b>4</b>.');
}},
{t:'Read 101',n:3,pv:1,go:async()=>{
  set(5);hl(-1);
  say('Binary <b>101</b> has the 4 and 1 places lit. <b>4 + 1 = 5</b>.');
}},
{t:'Count from 0 to 1',n:3,pv:1,go:async()=>{
  set(1);hl(0);
  say('Start at 000. Add 1 and the right bulb turns on: <b>001 = 1</b>.');
}},
{t:'Count from 1 to 2',n:3,pv:1,go:async()=>{
  set(2);hl(1);
  say('Add 1 again. The 1 place resets to 0 and the 2 place turns on: <b>010 = 2</b>. This is a carry.');
}},
{t:'Count from 3 to 4',n:3,pv:1,go:async()=>{
  set(4);hl(2);
  say('At 011, both lower places are full. Add 1 and they reset while the 4 place turns on: <b>100 = 4</b>.');
}},
{t:'Three places stop at 7',n:3,pv:1,go:async()=>{
  set(7);hl(-1);
  say('With three places, the largest value is <b>111 = 7</b>. Every place is on.');
}},
{t:'Eight bits make a byte',n:8,pv:1,go:async()=>{
  set(0);hl(-1);
  say('Computers often group <b>8 bits</b> together. Eight bits are called a <b>byte</b>. The place values keep doubling.');
}},
{t:'Look at 127',n:8,pv:1,go:async()=>{
  set(127);hl(-1);
  say('Binary <b>01111111</b> is 127. The seven smaller places are all on.');
}},
{t:'Add 1 to make 128',n:8,pv:1,go:async()=>{
  set(128);hl(7);
  say('Add 1 to 127. The seven lower places reset and the 128 place turns on: <b>10000000 = 128</b>.');
}},
{t:'A byte can reach 255',n:8,pv:1,go:async()=>{
  set(255);hl(-1);
  say('Turn on every place and you get <b>11111111 = 255</b>, the largest number one byte can show.');
}},
{t:'Numbers can stand for characters',n:8,pv:1,go:async()=>{
  set(0);hl(-1);
  say('A byte is still just a number. People created agreements that let numbers stand for characters. One of those agreements is <b>ASCII</b>.');
}},
{t:'72 means H',n:8,pv:1,go:async()=>{
  set(72);hl(-1);$('msg').textContent='H';
  say('In ASCII, decimal <b>72</b> stands for the capital letter <b>H</b>.');
}},
{t:'73 means I',n:8,pv:1,go:async()=>{
  set(73);hl(-1);$('msg').textContent='HI';
  say('Decimal <b>73</b> stands for <b>I</b>. Now the bytes spell HI.');
}},
{t:'33 means !',n:8,pv:1,go:async()=>{
  set(33);hl(-1);$('msg').textContent='HI!';
  say('Decimal <b>33</b> stands for <b>!</b>. Three byte values can spell <b>HI!</b>.');
}},
{t:'Your turn',n:8,pv:1,free:1,go:async()=>{
  set(0);hl(-1);
}}
];
async function show(i){
  cur=i;tok++;last='';free=!!S[i].free;pv=!!S[i].pv;
  $('msg').textContent='';$('title').textContent=S[i].t;
  $('bulbs').className=(pv?'':'nopv ')+(free?'free':'');
  document.querySelectorAll('.dot').forEach((d,j)=>d.setAttribute('aria-current',j===i));
  $('back').disabled=i===0;
  $('next').textContent=i===S.length-1?'Start over':'Next';
  build(S[i].n);
  try{await S[i].go()}catch(e){}
}
S.forEach((s,j)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Step '+(j+1)+': '+s.t);b.onclick=()=>show(j);$('dots').appendChild(b)});
$('back').onclick=()=>show(cur-1);
$('replay').onclick=()=>show(cur);
$('next').onclick=()=>show(cur<S.length-1?cur+1:0);
show(0);
</script>
</body>
</html>
