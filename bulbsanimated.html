<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Bulbs: a story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--fg:#14213a;--muted:#5d6b85;--line:#cfd8e6;--off:#d9dfea;--offs:#b5c0d3;--on:#ffc93c;--glow:#ff9d00;--accent:#a51c30;--btn:#14213a;--btnfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#15203a;--fg:#eaf0fb;--muted:#93a2c0;--line:#2a3757;--off:#26324f;--offs:#3b4a6e;--btn:#eaf0fb;--btnfg:#0d1526;--accent:#ff6b7f}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#15203a;--fg:#eaf0fb;--muted:#93a2c0;--line:#2a3757;--off:#26324f;--offs:#3b4a6e;--btn:#eaf0fb;--btnfg:#0d1526;--accent:#ff6b7f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 14px}
h2{font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.cap{font-size:clamp(17px,3.8vw,21px);min-height:5.6em;margin:0 0 14px;max-width:60ch}
.cap.in{animation:cap .45s ease-out}
@keyframes cap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cap b{color:var(--accent)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 10px 14px}
.scroll{overflow-x:auto}
#bulbs{display:flex;gap:4px;justify-content:center;min-width:300px}
.cell{flex:1 1 0;min-width:34px;max-width:96px;text-align:center}
.pv{font-weight:800;font-size:clamp(14px,3.4vw,22px);transition:color .2s}
.pw{color:var(--muted);font-size:13px}
.nopv .pv,.nopv .pw{visibility:hidden}
.bulb{all:unset;display:block;width:100%;max-width:74px;margin:4px auto}
.free .bulb{cursor:pointer}
.bulb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.bulb svg{width:100%;height:auto;display:block;overflow:visible;transition:transform .25s}
.glass{fill:var(--off);stroke:var(--offs);stroke-width:2;transition:fill .25s}
.base{fill:var(--offs)}
.fil{fill:none;stroke:var(--offs);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on .glass{fill:var(--on);stroke:var(--glow);filter:drop-shadow(0 0 12px var(--glow))}
.on .fil{stroke:#fff}
.bit{font-weight:800;font-size:clamp(18px,4.5vw,28px)}
.on .bit{color:var(--accent)}
.flip svg{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.enter{animation:enter .6s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(-16px) scale(.8)}to{opacity:1;transform:none}}
.hl .pv{color:var(--accent)}
.hl svg{transform:scale(1.12)}
.read{margin:16px 0 8px;text-align:center}
.dec{font-size:clamp(56px,16vw,96px);font-weight:800;line-height:1;letter-spacing:-.03em}
.eq{color:var(--muted);font-size:clamp(15px,3.6vw,20px);min-height:1.5em;margin-top:6px;overflow-wrap:anywhere}
.meta{color:var(--muted);margin-top:2px}
.meta b{color:var(--fg)}
.msg{font-size:clamp(34px,10vw,60px);font-weight:800;letter-spacing:.12em;color:var(--accent);min-height:1.2em}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:430px;margin:12px auto 16px}
.dot{width:10px;height:10px;padding:0;border-radius:50%;border:1.5px solid var(--offs);background:none;cursor:pointer}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 20px;border-radius:10px;cursor:pointer}
button.b.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
button.b:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.flip svg,.enter,.cap.in{animation:none}}

.progressWrap{margin:0 0 14px}
.progressMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.progressPill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.progressBar{height:8px;margin-top:8px;background:var(--off);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progressFill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.extra{max-width:700px;margin:8px auto 0}
.challenge{background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));border-radius:12px;padding:10px 12px;color:var(--fg);font-size:15px}
.asciiCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.asciiCard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.asciiCard .binary{font-size:13px;color:var(--muted);letter-spacing:.06em}
.asciiCard .char{font-size:34px;font-weight:800;color:var(--accent);line-height:1.1;margin-top:4px}
.asciiCard .decimal{font-size:13px;color:var(--muted)}
button.b.action{border-color:var(--accent);color:var(--accent)}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V55DVP2SHR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V55DVP2SHR');
</script>
</head>
<body>
<main>
<h1>Binary Bulbs: one small step at a time</h1>
<div class="progressWrap">
  <div class="progressMeta">
    <span class="progressPill" id="sectionTag">Bits</span>
    <span class="progressPill" id="stepTag">Step 1</span>
  </div>
  <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
</div>
<h2 id="title"></h2>
<p class="cap" id="cap" aria-live="polite"></p>
<div class="stage"><div class="scroll"><div id="bulbs"></div></div></div>
<div class="read">
<div class="dec" id="dec">0</div>
<div class="eq" id="eq"></div>
<div class="meta">Binary <b id="bin"></b></div>
<div class="msg" id="msg"></div>
<div class="extra" id="extra"></div>
</div>
<div class="ctl">
<button class="b" id="back">Back</button>
<button class="b" id="replay">Replay</button>
<button class="b action" id="act" hidden>Do it</button>
<button class="b main" id="next">Next</button>
</div>
</main><script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let bits=0,val=0,cur=0,tok=0,free=false,pv=false,last='',target=null,conceal=false,actionDone=false;
const bulbSVG='<svg viewBox="0 0 60 90" aria-hidden="true"><path class="glass" d="M30 4C14 4 6 16 6 29c0 10 6 16 11 22 3 4 4 7 4 11h18c0-4 1-7 4-11 5-6 11-12 11-22C54 16 46 4 30 4z"/><path class="fil" d="M24 62L27 44L30 54L33 44L36 62"/><rect class="base" x="20" y="64" width="20" height="6" rx="2"/><rect class="base" x="22" y="72" width="16" height="6" rx="2"/></svg>';

function say(h){
  if(h===last)return;last=h;
  const c=$('cap');c.innerHTML=h;c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
}
async function w(ms){const t=tok;await sleep(ms);if(t!==tok)throw 0}
function hl(i){document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('hl',+c.dataset.i===i))}
function setVal(v){const o=val;val=v;render(o^v)}
function build(n){
  const previousBits=bits;bits=n;val=0;
  const box=$('bulbs');box.innerHTML='';
  for(let i=n-1;i>=0;i--){
    const c=document.createElement('div');c.className='cell'+(i>=previousBits?' enter':'');c.dataset.i=i;
    c.innerHTML='<div class="pv">'+(2**i)+'</div><button class="bulb" aria-label="Bit worth '+(2**i)+'">'+bulbSVG+'</button><div class="bit">0</div><div class="pw">2<sup>'+i+'</sup></div>';
    c.querySelector('.bulb').onclick=()=>{if(free)setVal(val^(1<<i))};
    box.appendChild(c);
  }
  render(0);
}
function ensureBits(n){
  if(bits!==n) build(n);
}
function render(m){
  const on=[];
  document.querySelectorAll('.cell').forEach(c=>{
    const i=+c.dataset.i,o=(val>>i)&1;
    c.classList.toggle('on',!!o);
    c.querySelector('.bit').textContent=o;
    if(o)on.push(2**i);
    if((m>>i)&1){c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip')}
  });
  const solved=target===null||val===target;
  $('dec').textContent=conceal&&!solved?'?':val;
  $('eq').textContent=!pv?'':conceal&&!solved?'Build the target before revealing the total.':on.length>1?on.join(' + ')+' = '+val:on.length?'only the '+val+' bit is on':'no bits on';
  $('bin').textContent=val.toString(2).padStart(bits,'0');
  if(free&&target!==null){
    if(solved){
      $('msg').textContent='✓';
      say('Yes. You made <b>'+target+'</b>.');
      $('next').disabled=false;
    }else{
      $('msg').textContent='';
      $('next').disabled=true;
    }
  }
}
async function animateIncrement(){
  for(let i=0;i<bits;i++){
    hl(i);await w(260);
    if((val>>i)&1){
      setVal(val&~(1<<i));
      await w(430);
    }else{
      setVal(val|(1<<i));
      await w(430);
      hl(-1);
      return;
    }
  }
  hl(-1);
}
function asciiCards(items){
  return '<div class="asciiCards">'+items.map(x=>'<div class="asciiCard"><div class="decimal">decimal '+x.d+'</div><div class="binary">'+x.b+'</div><div class="char">'+x.c+'</div></div>').join('')+'</div>';
}
function progress(){
  const s=S[cur];
  $('sectionTag').textContent=s.sec;
  $('stepTag').textContent='Step '+(cur+1)+' of '+S.length;
  $('progressFill').style.width=((cur+1)/S.length*100)+'%';
}
const S=[
{sec:'Bits',t:'A bit has two states',n:1,init:0,go:async()=>{hl(-1);say('We will use bulbs to model <b>bits</b>. A bit can be <b>off</b> or <b>on</b>.')}},
{sec:'Bits',t:'Off means 0',n:1,init:0,go:async()=>{hl(0);say('When the bulb is <b>off</b>, the bit is <b>0</b>.')}},
{sec:'Bits',t:'On means 1',n:1,init:1,go:async()=>{hl(0);say('When the bulb is <b>on</b>, the bit is <b>1</b>.')}},

{sec:'Patterns',t:'Add a second bit',n:2,init:0,go:async()=>{hl(-1);say('Add a second bit. Two bits can make more patterns.');$('extra').innerHTML='<div class="challenge"><b>00 · 01 · 10 · 11</b></div>'}},
{sec:'Patterns',t:'Two bits make four patterns',n:2,init:3,go:async()=>{hl(-1);say('Two bits make <b>4 possible patterns</b>. Every extra bit doubles the number of patterns.')}},

{sec:'Values',t:'Each place has a value',n:2,pv:1,init:3,go:async()=>{hl(-1);say('Now give each place a value. Start on the right with <b>1</b>. Move left and double to <b>2</b>.')}},
{sec:'Values',t:'Read 11',n:2,pv:1,init:3,go:async()=>{say('Both places are on: <b>2 + 1 = 3</b>. So binary 11 means 3.')}}, 
{sec:'Values',t:'Add a third bit',n:3,pv:1,init:4,go:async()=>{hl(2);say('Add another place on the left. The values keep doubling: <b>1, 2, 4</b>.')}},
{sec:'Values',t:'Read 101',n:3,pv:1,init:5,go:async()=>{hl(-1);say('Binary <b>101</b> has the 4 and 1 places on. <b>4 + 1 = 5</b>.')}},
{sec:'Try it',t:'Make 5',n:3,pv:1,init:0,free:1,target:5,conceal:1,go:async()=>{say('Tap the bulbs to make <b>5</b>.');$('extra').innerHTML='<div class="challenge">Which two place values add to 5?</div>'}},

{sec:'Counting',t:'What comes after 001?',n:3,pv:1,init:1,act:'Add 1',go:async()=>{say('Predict first. We are at <b>001 = 1</b>. What changes when we add 1?');$('extra').innerHTML='<div class="challenge">Press <b>Add 1</b> when you have a prediction.</div>'},run:async()=>{await animateIncrement();say('The 1 place was on, so it reset and carried left. Now <b>010 = 2</b>.')}},
{sec:'Counting',t:'What comes after 010?',n:3,pv:1,init:2,act:'Add 1',go:async()=>{say('Now we are at <b>010 = 2</b>. Predict the next pattern.');$('extra').innerHTML='<div class="challenge">This one does not need a carry.</div>'},run:async()=>{await animateIncrement();say('The 1 place simply turns on: <b>011 = 3</b>.')}},
{sec:'Counting',t:'Watch a bigger carry',n:3,pv:1,init:3,act:'Add 1',go:async()=>{say('We are at <b>011 = 3</b>. Both lower places are full. What happens when we add 1?');$('extra').innerHTML='<div class="challenge">Watch the carry move across both lower bits.</div>'},run:async()=>{await animateIncrement();say('The two lower bits reset, then the 4 place turns on: <b>100 = 4</b>.')}},
{sec:'Counting',t:'Three bits stop at 7',n:3,pv:1,init:7,go:async()=>{say('With three bits, the largest number is <b>111 = 7</b>. Every place is on.')}},

{sec:'Bigger values',t:'Add a fourth bit',n:4,pv:1,init:8,go:async()=>{hl(3);say('Add one more bit and the next place is worth <b>8</b>. Now the values are 1, 2, 4, 8.')}},
{sec:'Try it',t:'Make 10',n:4,pv:1,init:0,free:1,target:10,conceal:1,go:async()=>{say('Use four bits to make <b>10</b>.');$('extra').innerHTML='<div class="challenge">Which place values add to 10?</div>'}},

{sec:'Byte',t:'Eight bits make a byte',n:8,pv:1,init:0,go:async()=>{say('Computers often group <b>8 bits</b> together. Eight bits are called a <b>byte</b>.')}},
{sec:'Byte',t:'Watch 127 become 128',n:8,pv:1,init:127,act:'Add 1',go:async()=>{say('This is <b>01111111 = 127</b>. Predict what happens when we add 1.');$('extra').innerHTML='<div class="challenge">The same carry idea will ripple across seven bits.</div>'},run:async()=>{await animateIncrement();say('The carry rippled all the way to the 128 place: <b>10000000 = 128</b>.')}},
{sec:'Byte',t:'A full byte is 255',n:8,pv:1,init:255,go:async()=>{say('Turn on every bit in one byte and you get <b>11111111 = 255</b>.')}},

{sec:'Text',t:'Numbers can stand for characters',n:8,pv:1,init:0,go:async()=>{say('A byte is still a number. In <b>ASCII</b>, people agreed that certain numbers stand for characters.')}}, 
{sec:'Text',t:'72 means H',n:8,pv:1,init:72,go:async()=>{$('msg').textContent='H';say('In ASCII, decimal <b>72</b> stands for <b>H</b>.');$('extra').innerHTML=asciiCards([{d:72,b:'01001000',c:'H'}])}},
{sec:'Text',t:'73 means I',n:8,pv:1,init:73,go:async()=>{$('msg').textContent='HI';say('Decimal <b>73</b> stands for <b>I</b>. Keep the first byte visible and add the second.');$('extra').innerHTML=asciiCards([{d:72,b:'01001000',c:'H'},{d:73,b:'01001001',c:'I'}])}},
{sec:'Text',t:'33 means !',n:8,pv:1,init:33,go:async()=>{$('msg').textContent='HI!';say('Decimal <b>33</b> stands for <b>!</b>. Three byte values now spell <b>HI!</b>.');$('extra').innerHTML=asciiCards([{d:72,b:'01001000',c:'H'},{d:73,b:'01001001',c:'I'},{d:33,b:'00100001',c:'!'}])}},

{sec:'Final challenge',t:'Make 42',n:8,pv:1,init:0,free:1,target:42,conceal:1,go:async()=>{say('Final challenge. Tap the bulbs to make <b>42</b>.');$('extra').innerHTML='<div class="challenge">Hint: 42 uses three place values.</div>'}}
];

async function show(i){
  cur=i;tok++;last='';actionDone=false;
  const s=S[i];
  free=!!s.free;pv=!!s.pv;target=s.target??null;conceal=!!s.conceal;
  $('msg').textContent='';$('extra').innerHTML='';
  $('title').textContent=s.t;
  $('bulbs').className=(pv?'':'nopv ')+(free?'free':'');
  $('back').disabled=i===0;
  $('next').textContent=i===S.length-1?'Start over':'Next';
  $('act').hidden=!s.act;$('act').textContent=s.act||'Do it';$('act').disabled=false;
  $('next').disabled=!!s.act||(free&&target!==null);
  ensureBits(s.n);
  setVal(s.init??0);
  hl(-1);
  progress();
  try{await s.go()}catch(e){}
}
$('act').onclick=async()=>{
  const s=S[cur];
  if(!s.run||actionDone)return;
  actionDone=true;$('act').disabled=true;$('next').disabled=true;
  try{await s.run()}catch(e){}
  $('act').disabled=false;$('next').disabled=false;
};
$('back').onclick=()=>show(cur-1);
$('replay').onclick=()=>show(cur);
$('next').onclick=()=>show(cur<S.length-1?cur+1:0);
show(0);
</script>
</body>
</html>
