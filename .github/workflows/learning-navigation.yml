name: Student learning navigation
on:
  push:
    paths:
      - '.github/workflows/learning-navigation.yml'
      - 'learn/**'
      - 'pythoncourse/**'
      - 'tracetable/index.html'
      - 'turtle/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright codemirror@5 skulpt
          npx playwright install --with-deps chromium
      - name: Check home, course, saved work, notes, and mobile layouts
        env:
          LEARNING_HOME_PROOF: learning-navigation-proof
        run: node learn/test-learning-home.mjs
      - name: Check Unit 1 predictions, experiments, and saved evidence
        env:
          UNIT_DEPTH_PROOF: learning-navigation-proof/unit-1
        run: node pythoncourse/test-unit-depth.mjs
      - name: Check Unit 2 loops and output
        run: node pythoncourse/test-unit-two.mjs
      - name: Check code autosave and recovery
        run: node pythoncourse/test-code-history.mjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-navigation-proof
          path: learning-navigation-proof
          if-no-files-found: warn
          retention-days: 7
