name: Form 3D Studio
on:
  push:
    paths:
      - 'cad/**'
      - '.github/workflows/cad.yml'
  pull_request:
    paths:
      - 'cad/**'
      - '.github/workflows/cad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modeling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the committed engine bundle
        working-directory: cad/tools
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../vendor
      - name: Check geometry, project validation, and STL export
        run: |
          node cad/test-model.mjs
          node cad/test-operations.mjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Exercise the design workspace
        run: |
          node cad/test-browser.mjs
          node cad/test-features.mjs
      - name: Save browser proof and exported models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-3d-studio-proof
          path: |
            /tmp/form3d-test
            /tmp/form3d-features-test
          if-no-files-found: warn
          retention-days: 7
