name: Turtle tutorial links and previews
on:
  push:
    paths:
      - '.github/workflows/turtle-tutorial-tests.yml'
      - 'turtleprojects/index.html'
      - 'turtleprojects/tutorial.js'
      - 'turtleprojects/tutorial.css'
      - 'turtleprojects/tutorial-route.js'
      - 'turtleprojects/project.html'
      - 'turtleprojects/tutorial-slugs.js'
      - 'turtleprojects/base-catalog.js'
      - 'turtleprojects/starter-catalog.js'
      - 'turtleprojects/project-levels.js'
      - 'turtleprojects/quick-run.css'
      - 'turtlereference/**'
      - 'turtleprojects/project_art.py'
      - 'turtleprojects/build-project-catalog.py'
      - 'turtleprojects/lessons_starters.py'
      - 'turtleprojects/test-project-levels.mjs'
      - 'turtleprojects/test-project-catalog.py'
      - 'turtleprojects/curated-*.js'
      - 'turtleprojects/test-tutorial.mjs'
      - 'turtleprojects/test-learning.*'
      - 'turtleprojects/lesson_*.py'
      - 'turtleprojects/lessons_authored.py'
      - 'turtleprojects/build-tutorial-steps.py'
      - 'turtleprojects/tutorial-steps.js'
      - 'turtleprojects/lessons/**'
      - 'turtledemo/index.html'
      - 'turtledemo/project.html'
      - 'turtledemo/tutorial-route.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/turtle-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sSf http://127.0.0.1:8765/turtleprojects/project.html >/dev/null && break
            sleep 1
          done
      - name: Test all URLs and rendered previews
        run: node turtleprojects/test-tutorial.mjs
      - name: Check difficulty filters and beginner tutorials
        run: node turtleprojects/test-project-levels.mjs
      - name: Check quick run and all reference examples
        run: node turtlereference/test-reference.mjs
      - name: Check classroom code and drawing zoom
        run: node turtlereference/test-classroom-display.mjs
      - name: Check catalog and beginner constraints
        run: python3 turtleprojects/test-project-catalog.py
      - name: Validate every learning checkpoint
        run: python3 turtleprojects/test-learning.py
      - name: Run every checkpoint in the browser
        run: node turtleprojects/test-learning.mjs
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-tutorial-browser-proof
          path: |
            turtleprojects/tutorial-preview-proof.png
            turtleprojects/tutorial-preview-failure.png
          if-no-files-found: warn
          retention-days: 7
