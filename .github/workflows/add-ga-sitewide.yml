name: Add Google Analytics sitewide

on:
  push:
    paths:
      - ".github/workflows/add-ga-sitewide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Add GA4 tag to every HTML document
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          TARGET_ID = "G-V55DVP2SHR"
          SNIPPET = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-V55DVP2SHR"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-V55DVP2SHR');
          </script>"""

          script_block = re.compile(r"<script\\b[^>]*>.*?</script>", re.IGNORECASE | re.DOTALL)
          gtag_loader = re.compile(
              r"<script\\b(?=[^>]*\\bsrc\\s*=\\s*[\"']https://www\\.googletagmanager\\.com/gtag/js\\?id=G-[^\"']+[\"'])[^>]*>\\s*</script>\\s*",
              re.IGNORECASE | re.DOTALL,
          )
          ga_comment = re.compile(r"<!--\\s*Google tag\\s*\\(gtag\\.js\\)\\s*-->\\s*", re.IGNORECASE)

          changed = []
          skipped = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".github" in path.parts:
                  continue

              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              prefix = text[:8000].lower()
              is_html = path.suffix.lower() in {".html", ".htm", ".hmtl"}
              is_extensionless_html = not path.suffix and ("<!doctype html" in prefix or "<html" in prefix)
              if not (is_html or is_extensionless_html):
                  continue

              original = text
              text = ga_comment.sub("", text)
              text = gtag_loader.sub("", text)

              def remove_ga_inline(match):
                  block = match.group(0)
                  has_datalayer = "window.dataLayer" in block or "window.datalayer" in block.lower()
                  has_ga_config = re.search(
                      r"gtag\\s*\\(\\s*[\"']config[\"']\\s*,\\s*[\"']G-[A-Z0-9]+[\"']",
                      block,
                      re.IGNORECASE,
                  )
                  return "" if has_datalayer and has_ga_config else block

              text = script_block.sub(remove_ga_inline, text)

              head = re.search(r"<head\\b[^>]*>", text, re.IGNORECASE)
              if head:
                  insert_at = head.end()
                  newline = "\\r\\n" if "\\r\\n" in original[:1000] else "\\n"
                  text = text[:insert_at] + newline + SNIPPET.replace("\\n", newline) + newline + text[insert_at:]
              else:
                  html = re.search(r"<html\\b[^>]*>", text, re.IGNORECASE)
                  newline = "\\r\\n" if "\\r\\n" in original[:1000] else "\\n"
                  block = "<head>" + newline + SNIPPET.replace("\\n", newline) + newline + "</head>" + newline
                  if html:
                      text = text[:html.end()] + newline + block + text[html.end():]
                  else:
                      text = SNIPPET.replace("\\n", newline) + newline + text

              if text != original:
                  path.write_bytes(text.encode("utf-8"))
                  changed.append(str(path))
              else:
                  skipped.append(str(path))

          print(f"Updated {len(changed)} HTML documents.")
          for p in changed:
              print(p)
          if skipped:
              print(f"Unchanged: {len(skipped)}")
          PY

      - name: Commit sitewide analytics update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GA4 tracking to every site page"
          git push
