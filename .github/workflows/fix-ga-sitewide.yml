name: Fix Google Analytics sitewide

on:
  push:
    paths:
      - ".github/workflows/fix-ga-sitewide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Normalize GA4 tag on every HTML document
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          SNIPPET = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-V55DVP2SHR"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-V55DVP2SHR');
          </script>"""

          script_block = re.compile(r"<script\b[^>]*>.*?</script>", re.IGNORECASE | re.DOTALL)
          ga_comment = re.compile(r"<!--\s*Google tag\s*\(gtag\.js\)\s*-->\s*", re.IGNORECASE)

          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or ".github" in path.parts:
                  continue

              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              prefix = text[:8000].lower()
              is_html = path.suffix.lower() in {".html", ".htm", ".hmtl"}
              is_extensionless_html = not path.suffix and ("<!doctype html" in prefix or "<html" in prefix)
              if not (is_html or is_extensionless_html):
                  continue

              original = text

              # Remove all existing GA gtag loader/config blocks so each page ends with exactly one.
              text = ga_comment.sub("", text)

              def remove_ga_script(match):
                  block = match.group(0)
                  lower = block.lower()
                  if "googletagmanager.com/gtag/js?id=g-" in lower:
                      return ""
                  if "window.datalayer" in lower and re.search(
                      r"gtag\s*\(\s*['\"]config['\"]\s*,\s*['\"]G-[A-Z0-9]+['\"]",
                      block,
                      re.IGNORECASE,
                  ):
                      return ""
                  return block

              text = script_block.sub(remove_ga_script, text)

              # Clean the literal backslash-n left by the previous pass, only at document start.
              text = re.sub(r"^\s*(?:\\n)+(?=\s*(?:<!doctype|<html))", "", text, flags=re.IGNORECASE)

              newline = "\r\n" if "\r\n" in original[:2000] else "\n"
              snippet = SNIPPET.replace("\n", newline)

              head = re.search(r"<head\b[^>]*>", text, re.IGNORECASE)
              if head:
                  insert_at = head.end()
                  text = text[:insert_at] + newline + snippet + newline + text[insert_at:]
              else:
                  html = re.search(r"<html\b[^>]*>", text, re.IGNORECASE)
                  if html:
                      block = "<head>" + newline + snippet + newline + "</head>" + newline
                      text = text[:html.end()] + newline + block + text[html.end():]
                  else:
                      text = snippet + newline + text

              if text != original:
                  path.write_bytes(text.encode("utf-8"))
                  changed.append(str(path))

          print(f"Normalized {len(changed)} HTML documents.")
          for p in changed:
              print(p)
          PY

      - name: Commit corrected analytics markup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize GA4 tracking sitewide"
          git push
