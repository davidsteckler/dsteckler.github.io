:100px;border-top:3px solid var(--warm)}.motion-caption{min-height:55px;margin:15px 0;color:#c8d8d9;font-size:14px}.scrap{padding:25px;border:1px solid #625a43;background:#29261d;color:#e0d7c4;transform:rotate(-1deg);margin:20px 0}.scrap button{color:var(--warm)}.divider{margin:35px 0;border:0;border-top:1px solid var(--line)}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{50%{border-color:#b4f2d6;box-shadow:0 0 25px #a1dcca22}}@keyframes land{to{bottom:36px}}@media(max-width:800px){.desk{grid-template-columns:1fr;gap:10px}.inventory{position:static;display:flex;gap:7px;overflow:auto;padding:0 0 10px}.inventory>.caption{display:none}.inventory button{white-space:nowrap;width:auto;flex-shrink:0;margin:0}.paper{padding:24px}.cases{grid-template-columns:1fr}.hub{padding-top:45px}.two{grid-template-columns:1fr}header{flex-wrap:wrap}.footer{display:block}.case{min-height:260px}.table-wrap{margin:0 -5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important;scroll-behavior:auto!important}}@media print{.teacher>*:not(.opening-cards){display:none!important}.opening-cards>summary,.opening-cards>p{display:none!important}header,.toolbar,.inventory,.hintbar,.footer,button{display:none!important}body{background:white;color:black}main{width:100%}.paper,.artifact,.teacher details{background:white;color:black;border:1px solid #555}.muted,.caption,.stamp,p,small{color:#333!important}.desk{display:block}.print-card{break-inside:avoid}.teacher{margin:0}a{color:#222}}

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='csweek_investigations_v3';

// Synthesized, local effects. Audio starts only after a user gesture.
const Sound=(()=>{
 let ctx=null,master=null,muted=false,last=0;
 try{muted=localStorage.getItem('csweek_sound_muted')==='1';}catch{}
 const refresh=()=>{const b=$('sound-toggle');if(b){b.textContent=muted?'SOUND OFF':'SOUND ON';b.setAttribute('aria-pressed',String(!muted));b.setAttribute('aria-label',muted?'Sound off. Click to enable.':'Sound on. Click to mute.');}};
 function unlock(){if(muted)return false;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return false;if(!ctx){ctx=new Audio();master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return true;}catch{return false;}}
 function tone(freq,at,duration=.08,level=.16,type='sine',end=freq){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(Math.max(end,25),at+duration);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(level,at+.005);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(master);o.start(at);o.stop(at+duration+.015);}
 function texture(at,duration=.06,level=.16,cutoff=1500){const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate),a=buffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=cutoff;g.gain.setValueAtTime(level,at);g.gain.exponentialRampToValueAtTime(.0001,at+duration);src.connect(filter);filter.connect(g);g.connect(master);src.start(at);src.stop(at+duration);}
 function play(kind='tap'){if(!ctx||muted||ctx.state!=='running')return;const t=ctx.currentTime+.005;if(t-last<.045)return;last=t;
 if(kind==='switch-on'||kind==='switch-off'){texture(t,.035,.36,2200);tone(kind==='switch-on'?720:470,t,.045,.12,'triangle',220);}
 else if(kind==='archive'){texture(t,.14,.25,1100);tone(330,t+.035,.15,.10,'sine',390);}
 else if(kind==='discover'){tone(440,t,.15,.19);tone(660,t+.09,.22,.15);tone(880,t+.18,.25,.08);}
 else if(kind==='measure'){texture(t,.04,.20,1800);tone(1050,t+.025,.065,.12,'sine',780);}
 else if(kind==='retry'){tone(230,t,.16,.15,'sine',170);}
 else if(kind==='landing'){[262,330,392,523].forEach((f,i)=>tone(f,t+i*.10,.48,.14));texture(t,.32,.12,500);}
 else if(kind==='scan'){tone(240,t,.20,.12,'sine',620);texture(t,.11,.10,1300);}
 else tone(650,t,.045,.10,'sine',520);
 }
 function toggle(){muted=!muted;try{localStorage.setItem('csweek_sound_muted',muted?'1':'0');}catch{}refresh();if(muted){if(master&&ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.015);}else{unlock();if(master&&ctx)master.gain.setTargetAtTime(.16,ctx.currentTime,.015);setTimeout(()=>play('tap'),40);}}
 refresh();$('sound-toggle').onclick=toggle;
 document.addEventListener('pointerdown',()=>unlock(),{passive:true});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))unlock();});
 document.addEventListener('click',e=>{const b=e.target.closest?.('button');if(!b||b.disabled||b.id==='sound-toggle')return;unlock();if(b.hasAttribute('data-switch'))play(b.getAttribute('aria-pressed')==='true'?'switch-off':'switch-on');else if(b.hasAttribute('data-start'))play('scan');else if(b.hasAttribute('data-open'))play('archive');else if(b.hasAttribute('data-direction'))play('measure');else if(['measure','compare-rules','restore-reference','test-strip','file-incidents','plot-path','verify-tracking','test-route','run-cycle','release-packet'].includes(b.id))return;else play('tap');},true);
 document.addEventListener('change',e=>{if(e.target.matches('select,input[type=checkbox],input[type=radio]'))play('tap');});
 return {play,unlock};
})();
let saved={};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))saved=x;}catch{}
let active=null,room=null,timers=[],hintLevel=0;
const validRooms={invisible:['cabinet','shannon','bench','hopper','reader','audit','closed'],control:['record','johnson','tracking','hamilton','scheduler','landing','closed']};
const labels={cabinet:'The cabinet',shannon:'1937 · C. Shannon',bench:'Relay bench',hopper:'1952 · G. Hopper',reader:'Instruction reader',audit:'Incident drawer',record:'Flight record',johnson:'1962 · K. Johnson',tracking:'Tracking room',hamilton:'1969 · M. Hamilton',scheduler:'Flight computer',landing:'Landing packet',closed:'Case report'};
function state(){if(!saved[active]||typeof saved[active]!=='object'||Array.isArray(saved[active]))saved[active]={};const s=saved[active];if(!Array.isArray(s.found))s.found=[];if(!s.notes||typeof s.notes!=='object')s.notes={};return s;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));$('save-indicator').textContent='SAVED ON THIS DEVICE';}catch{$('save-indicator').textContent='SAVING UNAVAILABLE · COPY YOUR REPORT';}}
function later(fn,ms){timers.push(setTimeout(fn,ms));}function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function file(target,title,sub=''){return `<button class="file new" data-open="${target}">${title}<small>${sub}</small></button>`;}
function discover(target){const s=state();if(!s.found.includes(target))s.found.push(target);persist();}
function enter(id){active=id;const s=state();const first=validRooms[id][0];discover(first);room=s.found.includes(s.room)&&validRooms[id].includes(s.room)?s.room:first;render();}
function openRoom(target){if(!validRooms[active].includes(target))return;discover(target);room=target;hintLevel=0;render();window.scrollTo({top:0,behavior:'auto'});const h=document.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
function render(){clearTimers();if(!active){home();return;}const s=state();s.room=room;persist();history.replaceState(null,'',location.pathname+'?hunt='+active);$('app').innerHTML=`<div class="toolbar"><button class="quiet" id="home">← Case files</button><span class="name">${active==='invisible'?'01 / THE INVISIBLE COMPUTER':'02 / MISSION CONTROL'}</span><button class="quiet" id="notebook">Notes</button></div><div class="desk"><nav class="inventory" aria-label="Discovered evidence"><div class="caption">Recovered</div>${s.found.filter(r=>validRooms[active].includes(r)).map(r=>`<button data-open="${r}" class="${r===room?'current':''}" ${r===room?'aria-current="page"':''}>${esc(labels[r])}</button>`).join('')}</nav><article class="paper" id="paper">${pages[room]() }<div class="hintbar"><button class="quiet" id="hint">A nudge</button><div class="hint" id="hint-text" role="status"></div></div></article></div><footer class="footer"><span>Progress stays in this browser. Keep your evidence.</span><span>Fictional cases · real computing history</span></footer>`;bindCommon();bindRoom();}
function home(){active=null;room=null;clearTimers();history.replaceState(null,'',location.pathname);$('app').innerHTML=`<section class="hub"><div class="eyebrow">Three investigations · Grade 7</div><h1>Something was<br>left running.</h1><p class="intro">Three case files appeared on this computer.<br>Something was left inside each one.</p><div class="cases"><button class="case" data-start="invisible"><span class="stamp">CASE FILE 01</span><h2>The Invisible<br>Computer</h2><span class="muted">A cabinet. Three switches. A light.</span><span class="case-foot">${saved.invisible?.found?.length?'Return to evidence ↗':'Examine ↗'}</span></button><button class="case" data-start="control"><span class="stamp">CASE FILE 02</span><h2>Mission<br>Control</h2><span class="muted">Two records of the same flight.<br>They disagree.</span><span class="case-foot">${saved.control?.found?.length?'Return to evidence ↗':'Examine ↗'}</span></button><a class="case" style="text-decoration:none;grid-column:1/-1;min-height:220px" href="./caesar.html"><span class="stamp">CASE FILE 03 / CAESAR CIPHER</span><h2>The Unread Letter</h2><span class="muted">The letters are familiar.<br>Someone expected you to read this.</span><span class="case-foot">Examine ↗</span></a></div><p class="caption">Work with a partner. Keep track of what you notice.</p></section>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>enter(b.dataset.start));}
function bindCommon(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRoom(b.dataset.open));$('home').onclick=home;$('notebook').onclick=notebook;$('hint').onclick=()=>{const list=hints[room]||['Look again at the evidence you have already recovered.'];$('hint-text').textContent=list[Math.min(hintLevel++,list.length-1)];};document.querySelectorAll('img').forEach(img=>{img.onerror=()=>img.closest('figure')?.classList.add('failed');});}
function status(id,text,good=false){Sound.play(good?(text.includes('TOUCHDOWN')?'landing':id==='measure-status'?'measure':text.includes('recorded')||text.includes('Recorded')?'measure':'discover'):'retry');const node=$(id);if(!node)return;node.textContent=text;node.className='status '+(good?'good':'');}
function photo(src,alt,credit,link){return `<figure class="photo"><a class="photo-link" href="${link}" target="_blank" rel="noopener"><img src="${src}" alt="${alt}" loading="lazy"><span class="photo-error">Photograph unavailable here. Open the original collection ↗</span></a><figcaption>${credit} · <a href="${link}" target="_blank" rel="noopener">Original photograph / source ↗</a></figcaption></figure>`;}
function source(url,label){return `<p class="caption">History source: <a href="${url}" target="_blank" rel="noopener">${label} ↗</a></p>`;}
function switches(ids,values){return `<div class="switches">${ids.map((n,i)=>`<button class="switch" data-switch="${i}" aria-pressed="${!!values[i]}">${n} · ${values[i]?1:0}</button>`).join('')}</div>`;}
function observe(a,b,c){return Number(!!a&&(!!b||!!c));}
function rule(id,a,b,c){return Number(id==='correct'?!!a&&(!!b||!!c):id==='wide'?!!a||(!!b&&!!c):(!!a&&!!b)||!!c);}
const combinations=Array.from({length:8},(_,i)=>[(i>>2)&1,(i>>1)&1,i&1]);
const pages={
cabinet(){const s=state();return `<div class="stamp">Recovered object / B-3</div><h2>No screen.<br>Still doing something.</h2><p class="muted">The cabinet was warm when everyone left.</p><div class="artifact"><div class="artifact-title"><span>POWER CONNECTED</span><span>INPUTS UNKNOWN</span></div><div class="row spread">${switches(['A','B','C'],s.switches||[0,0,0])}<div class="lamp" id="cabinet-lamp">OFF</div></div><p class="caption gap">0 = open · 1 = closed</p><button class="text" id="plate">Examine the worn plate</button><div id="plate-reveal">${s.plate?file('shannon','C. SHANNON · 1937','A reference number under the paint.'):''}</div></div><p class="caption">Classroom reconstruction</p>`;},
shannon(){return `<div class="stamp">Archive / 1937</div><h2>A decision made<br>of switches.</h2><div class="reading"><p class="lede">Before the tiny chips inside your devices, there were switches you could hear moving.</p>${photo('https://images.computerhistory.org/revonline/images/500004323-03-01.jpg?w=600','Claude Shannon photographed around 1960','Claude Shannon, c. 1960. Courtesy MIT Museum; © MIT. Via Computer History Museum.','https://www.computerhistory.org/revolution/digital-logic/12/269/1332')}<p>Claude Shannon studied electrical engineering and mathematics. In his 1937 MIT master’s thesis, he showed how Boolean algebra could describe circuits built from electrical relays. A relay is an electrically operated switch.</p><p>George Boole had developed the mathematical logic much earlier. Shannon helped connect that logic to machinery. A statement that is true or false could correspond to a switch that is closed or open.</p><p>Today, electronic circuits use the same basic logical relationships. Billions of tiny components can work together, but a single decision is something you can investigate.</p><h3>Follow one path.</h3><p>Imagine two switches controlling a light. With switches in series, current must pass through <strong>both</strong>: A AND B. With parallel paths, current can pass through <strong>either</strong>: A OR B. OR also includes the case where both are closed.</p></div><div class="artifact"><div class="artifact-title">RELAY DEMONSTRATOR / CLASSROOM MODEL</div><div class="row"><label>Connection <select id="demo-gate"><option>AND</option><option>OR</option></select></label>${switches(['A','B'],[0,0])}</div><div id="circuit-drawing"></div><div class="circuit" id="circuit"><span>POWER</span><div class="wire"></div><span class="gate" id="gate-name">AND</span><div class="wire"></div><div class="lamp" id="demo-lamp">OFF</div></div><p class="motion-caption" id="demo-caption">Close a switch. Trace what changes.</p><button id="demo-play">Play worked example</button><button class="quiet" id="demo-step">Step</button></div><div class="reading"><p>A useful experiment distinguishes possible explanations. If you test only A=1, B=1, both AND and OR light the lamp. Testing A=1, B=0 separates them.</p><p>The cabinet has three inputs. Someone has left a testing sheet beside it.</p></div>${source('https://www.computerhistory.org/revolution/digital-logic/12/269','Computer History Museum · Digital logic')}${file('bench','B-3 / TESTING SHEET','The cabinet can be measured.')}`;},
bench(){const s=state(),logs=s.logs||{};return `<div class="stamp">Bench / B-3</div><h2>Eight arrangements.<br>One rule.</h2><p class="muted">The notebook has room for every possible arrangement of three switches.</p><div class="artifact"><div class="artifact-title"><span>DEVICE B-3</span><span id="combination-count">${Object.keys(logs).length} / 8 RECORDED</span></div>${switches(['A','B','C'],s.switches||[0,0,0])}<div class="row gap"><label>Your prediction <select id="prediction"><option value="">Choose</option><option value="0">Lamp OFF</option><option value="1">Lamp ON</option></select></label><button id="measure">Measure & record</button><div class="lamp" id="bench-lamp">?</div></div><p id="measure-status" class="status" role="status"></p></div><div class="table-wrap"><table><thead><tr><th>A B C</th><th>PREDICTED</th><th>OBSERVED</th><th>EDGE MARK</th></tr></thead><tbody>${combinations.map((bits,i)=>`<tr><td>${bits.join(' ')}</td><td>${logs[i]?logs[i].prediction:'—'}</td><td>${logs[i]?logs[i].output:'—'}</td><td>${logs[i]?(i===5?'L':i===6?'A':i===7?'B':'·'):'—'}</td></tr>`).join('')}</tbody></table></div><div class="gap"><p class="caption">Three explanations were found in the notebook.</p><div class="rules">${[['wide','A OR (B AND C)'],['correct','A AND (B OR C)'],['leak','(A AND B) OR C']].map(([id,t])=>`<label><input name="rule" type="radio" value="${id}" ${s.chosenRule===id?'checked':''}>${t}</label>`).join('')}</div><div class="two"><label>A test that disproves<br><code>A OR (B AND C)</code><select id="witness-wide">${comboOptions(s.wideWitness)}</select></label><label>A test that disproves<br><code>(A AND B) OR C</code><select id="witness-leak">${comboOptions(s.leakWitness)}</select></label></div><button id="compare-rules" class="gap">Compare with the notebook</button><p class="status" id="rule-status" role="status"></p></div><div id="bench-reveal">${s.benchSolved?labReveal():''}</div>`;},
hopper(){return `<div class="stamp">Archive / 1952</div><h2>Someone had to<br>write the instructions.</h2><div class="reading"><p class="lede">A machine could follow instructions precisely. Preparing those instructions was another problem.</p>${photo('https://images.computerhistory.org/revonline/images/500001019-03-01.jpg?w=600','Grace Hopper working at a UNIVAC console in 1957','Grace Hopper at UNIVAC, 1957. Hagley Museum and Library / Unisys Corporation, via Computer History Museum.','https://www.computerhistory.org/revolution/artifact/117/2400')}<p>Grace Hopper worked on early computers and developed tools to make programming more accessible. Her A-0 system, developed in the early 1950s, is often described as an early compiler. She later helped develop and promote COBOL with other computing pioneers.</p><p>A compiler is software that translates a program into another form. One readable instruction can become several lower-level operations. Those operations still have to preserve the programmer’s intended meaning.</p><p>A translator can translate a mistaken instruction perfectly. The result will still do the wrong thing. That makes testing important.</p><h3>Watch what gets preserved.</h3><p>In this invented teaching machine, a numbered instruction represents a logic operation. The animation follows the meaning through the translation. These numbers are classroom examples.</p></div><div class="artifact"><div class="artifact-title">TRANSLATION WINDOW / WORKED EXAMPLE</div><pre><span class="code-line" id="translate-0">light = ON if (A AND B) else OFF</span><span class="code-line" id="translate-1">read A = 1; read B = 0</span><span class="code-line" id="translate-2">41(1, 0) → 0</span><span class="code-line" id="translate-3">write light = OFF</span></pre><p id="translation-caption" class="motion-caption">One statement. Several operations.</p><button id="translation-play">Trace translation</button><button id="translation-step" class="quiet">Step</button></div><div class="reading"><p>The instruction reader from the building uses the same numbered notation. Its reference card is damaged. You have its examples, and you have B-3’s behavior recorded in your notebook.</p></div>${source('https://www.computerhistory.org/revolution/story/117','Computer History Museum · Higher-level languages')}${file('reader','INSTRUCTION READER / OPEN COVER','Three numbers survived on the reference card.')}`;},
reader(){const s=state();return `<div class="stamp">Software room / reader 41–43</div><h2>The numbers survived.</h2><p class="muted">The operation names did not.</p><div class="artifact"><div class="artifact-title">REFERENCE CARD / CLASSROOM MACHINE</div><div class="table-wrap"><table><thead><tr><th>NUMBER</th><th>EXAMPLES</th><th>OPERATION</th></tr></thead><tbody>${[['41','(0,1) → 0; (1,0) → 0; (1,1) → 1'],['42','(0,1) → 1; (1,0) → 1; (0,0) → 0'],['43','(0) → 1; (1) → 0']].map(([id,e])=>`<tr><td>${id}</td><td>${e}</td><td><select data-op="${id}" aria-label="Operation ${id}">${opOptions(s.operations?.[id])}</select></td></tr>`).join('')}</tbody></table></div><p class="caption gap">NOT reverses a value: NOT 0 is 1. NOT 1 is 0.</p><button id="restore-reference">Restore reference</button><p id="reference-status" role="status" class="status"></p></div><div id="patch-area">${s.reference?patchMarkup():''}</div><div id="reader-reveal">${s.readerSolved?auditReveal():''}</div>`;},
audit(){const s=state();return `<div class="stamp">Recovered drawer / service records</div><h2>Three calls.<br>Different failures.</h2><p class="muted">The rule is recovered. Each record gives you three places to look.</p><div class="notice">Recovered rule: <code>OCCUPIED AND (HOT OR REQUEST)</code><br>A = occupied · B = hot · C = manual request</div>${incidents.map((v,i)=>`<section class="artifact"><div class="artifact-title">INCIDENT 0${i+1} / ${v.name}</div><p>${v.story}</p><div class="table-wrap"><table><thead><tr><th>ACTUAL INPUTS</th><th>REPORTED INPUTS</th><th>PROGRAM COMMAND</th><th>PHYSICAL FAN</th></tr></thead><tbody><tr><td>${v.actual}</td><td>${v.reported}</td><td>${v.command}</td><td>${v.fan}</td></tr></tbody></table></div><div class="two gap"><label>Investigate<select data-fault="${i}">${faultOptions(s.faults?.[i])}</select></label><label>Evidence that isolates it<select data-proof="${i}">${proofOptions(s.proofs?.[i])}</select></label></div></section>`).join('')}<button id="file-incidents">File the service records</button><p id="audit-status" class="status" role="status"></p><div id="audit-reveal">${s.auditSolved?file('closed','THE CABINET / RETURN','The original object has a name now.'):''}</div>`;},
record(){const s=state();return `<div class="stamp">Recovered object / tracking paper</div><h2>Both say<br>“verified.”</h2><p class="muted">One trace belongs to the flight. One belongs to the computer.</p><div class="artifact">${trajectorySVG([[0,0],[2,3],[4,6],[6,9],[8,7],[10,5],[12,3]],true)}<div class="row spread"><span class="caption">DASHED: COMPUTER RECORD</span><button id="stamp-record" class="text">Examine the handwritten margin</button></div><div id="margin">${s.margin?file('johnson','K. JOHNSON / INDEPENDENT CHECK','A person’s initials beside the word VERIFIED.'):''}</div></div><p class="caption">Fictional tracking record · historical trail</p>`;},
johnson(){return `<div class="stamp">Archive / 1962</div><h2>She checked<br>the machine.</h2><div class="reading"><p class="lede">At NASA, “computer” once described a person’s job.</p>${photo('https://www.nasa.gov/wp-content/uploads/2023/03/1966-l-06717.jpeg?resize=476,600','Katherine Johnson seated at her desk at NASA Langley','Katherine Johnson at work, 1966. Photograph: NASA.','https://www.nasa.gov/image-article/mathematician-katherine-johnson-work/')}<p>Katherine Johnson joined NACA, NASA’s predecessor, in 1953. She began in the segregated West Area Computing section, where Black women performed mathematical calculations for research.</p><p>Johnson’s work included the trajectory for Alan Shepard’s 1961 spaceflight. Before John Glenn’s orbital flight in 1962, he requested that she check the calculations produced by electronic computers. She ran the calculations independently.</p><p>Her work also contributed to Apollo. Spaceflight depended on people who could calculate, question, verify, and work together.</p><h3>A trajectory is a path over time.</h3><p>To check a path, start from an agreed position and apply the movement rule independently. Comparing two copies of the same mistaken calculation would give you the same mistake.</p><p>Our classroom model uses coordinates. The first number is horizontal position, x. The second is height, y. Moving right adds to x; moving up adds to y. The example below starts at (0,0), then adds (2,3) twice.</p></div><div class="artifact"><div class="artifact-title">TRACKING DEMONSTRATOR / SIMPLIFIED COORDINATES</div>${trajectorySVG([[0,0],[2,3],[4,6]],false,'lesson-path')}<p class="motion-caption" id="trajectory-caption">Start: (0,0).</p><button id="trajectory-play">Trace the calculation</button><button id="trajectory-step" class="quiet">Step</button></div><div class="reading"><p>The flight record has a movement rule attached. It can be checked without trusting the computer’s printout.</p></div>${source('https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/','NASA · Katherine Johnson biography')}${file('tracking','TRACKING ROOM / CALCULATION SHEET','The original flight record is attached.')}`;},
tracking(){const s=state();return `<div class="stamp">Tracking room / independent calculation</div><h2>Find where<br>they separate.</h2><div class="scrap"><div class="caption">FLIGHT RULE / CLASSROOM MODEL</div><p>Start at <strong>(0,0)</strong>.<br>Every interval: move <strong>2 right</strong>.<br>For intervals <strong>1, 2, 3</strong>: move <strong>3 up</strong>.<br>For intervals <strong>4, 5, 6</strong>: move <strong>2 down</strong>.</p><small>These coordinates illustrate checking a trajectory; they are not historical flight calculations.</small></div><div class="table-wrap"><table><thead><tr><th>INTERVAL</th><th>YOUR x</th><th>YOUR y</th><th>COMPUTER x,y</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td><td>0,0</td></tr>${Array.from({length:6},(_,i)=>`<tr><td>${i+1}</td><td><input class="small" inputmode="numeric" type="number" data-coordinate="${i+1}-x" aria-label="Interval ${i+1} x" value="${esc(s.coordinates?.[i+1]?.[0]??'')}"></td><td><input class="small" inputmode="numeric" type="number" data-coordinate="${i+1}-y" aria-label="Interval ${i+1} y" value="${esc(s.coordinates?.[i+1]?.[1]??'')}"></td><td>${computerPath[i+1].join(', ')}</td></tr>`).join('')}</tbody></table></div><button class="gap" id="plot-path">Overlay the records</button><p id="tracking-status" class="status" role="status"></p><div id="tracking-plot">${s.pathVerified?trajectorySVG(correctPath,true):''}</div><label class="gap" style="display:block">First interval where the computer disagrees <select id="first-divergence"><option value="">Select</option>${[1,2,3,4,5,6].map(n=>`<option ${s.divergence===String(n)?'selected':''}>${n}</option>`).join('')}</select></label><button id="verify-tracking" class="gap">Annotate the record</button><p id="divergence-status" class="status" role="status"></p><div id="route-area">${s.trackingVerified?routeMarkup():''}</div><div id="tracking-reveal">${s.routeSolved?hamiltonReveal():''}</div>`;},
hamilton(){return `<div class="stamp">Archive / 1969</div><h2>The alarm sounded<br>during the landing.</h2><div class="reading"><p class="lede">A spacecraft’s computer had a limited amount of work it could do at once.</p>${photo('https://assets.science.nasa.gov/dynamicimage/assets/science/psd/solar/2023/07/Margaret_Hamilton.jpg?fit=clip&h=690&w=552','Margaret Hamilton beside the Apollo software listings produced by her teams','Margaret Hamilton, MIT, 1969. Apollo software listings developed by her and her teams. Image via NASA; Instrumentation Laboratory / Draper.','https://science.nasa.gov/people/margaret-hamilton/')}<p>Margaret Hamilton led the Software Engineering Division at MIT’s Instrumentation Laboratory during the Apollo program. The photograph shows listings of software developed by the teams she led.</p><p>During Apollo 11’s descent, the guidance computer raised overload alarms. The software could shed lower-priority work and preserve important guidance work. Mission Control assessed the alarms and allowed the landing to continue.</p><p>This depended on the work of many software and hardware engineers, astronauts, and flight controllers. Reliability had to be designed and tested before the flight.</p><h3>What must happen now?</h3><p>A scheduler decides which work gets time on a processor. A task may have a deadline: the latest time it can finish. If a 4-unit task starts at time 0, it finishes at time 4. A 3-unit task after it finishes at time 7. A task can miss its deadline even when all the work fits in the cycle. A delayed camera image and a delayed steering calculation have different consequences.</p><p>Here, one block represents one unit of processor time. The classroom machine has eight units in each cycle. Watch a schedule that fits.</p></div><div class="artifact"><div class="artifact-title">SCHEDULING DEMONSTRATOR / 8 UNITS</div><div class="queue" id="demo-queue"><span class="queue-empty">Processor waiting</span></div><p class="motion-caption" id="scheduler-caption">Steering needs 4 units. Altitude needs 3. A photo needs 3.</p><button id="schedule-play">Trace one cycle</button><button id="schedule-step" class="quiet">Step</button></div><div class="reading"><p>The machine in your case has three damaged schedules. Its flight notes explain which work matters in each situation. The numbers, tasks, and capacities in this simulation are invented teaching examples.</p></div>${source('https://www.draper.com/media-center/news-releases/detail/23333/margaret-hamilton-apollo-software-engineer-named-a-fellow-by-computer-history-museum','Draper · Hamilton and priority-driven software')}${file('scheduler','LUMINARY / FLIGHT COMPUTER','The processor is waiting for a schedule.')}`;},
scheduler(){const s=state(),round=Math.min(s.scheduleRound||0,2),scene=scenarios[round];return `<div class="stamp">Flight computer / cycle ${round+1}</div><h2>${scene.title}</h2><div class="tokens">${scenarios.map((v,i)=>`<span class="token ${(s.scheduleRound||0)>i?'done':''}">${(s.scheduleRound||0)>i?'✓ ':''}${v.title}</span>`).join('')}</div><div class="scrap"><div class="caption">FLIGHT NOTES</div><p>${scene.note}</p><p class="caption">PROCESSOR CAPACITY: ${scene.capacity} UNITS</p></div><p class="caption">DEADLINES: ${Object.entries(scene.deadlines).map(([id,n])=>scene.tasks.find(t=>t.id===id).name+" must finish by time "+n).join(" · ")}</p><div class="schedule-tasks">${scene.tasks.map(t=>`<label><span><input type="checkbox" data-task="${t.id}" ${(s.taskPicks?.[round]||[]).includes(t.id)?'checked':''}>${t.name}</span><span class="cost">${t.cost} units</span></label>`).join('')}</div><p class="caption">EXECUTION ORDER / TOP RUNS FIRST</p><div id="priority-order"></div><div class="queue" id="live-queue"><span class="queue-empty">No work scheduled</span></div><p class="caption" id="capacity-label">0 / ${scene.capacity} UNITS</p><button id="run-cycle">Run processor cycle</button><p class="status" id="cycle-status" role="status"></p><div id="cycle-timing"></div><div id="cycle-reveal">${s.scheduleRound>=3?landingReveal():''}</div>`;},
landing(){const s=state();return `<div class="stamp">Recovered packet / final simulation</div><h2>Two signatures<br>are missing.</h2><p class="muted">The navigation record and the flight computer must agree before the landing packet can be released.</p><div class="artifact"><div class="artifact-title">NAVIGATION / RESTORED RECORD</div><p>Recovery beacon: <strong>(16,1)</strong>. Your filed route: <code>${esc((s.route||[]).join(' '))}</code></p><label>End of the original six-interval flight: x <input id="final-x" class="small" type="number" value="${esc(s.finalX??'')}" aria-label="Original flight final x"> y <input id="final-y" class="small" type="number" value="${esc(s.finalY??'')}" aria-label="Original flight final y"></label></div><div class="scrap"><div class="caption">LAST TRANSMISSION / 9 UNITS AVAILABLE</div><p>Descent has resumed. Steering and altitude measurement must continue. Mission Control also requires a radio update during this cycle. Photography can wait.</p></div><div class="schedule-tasks">${finalTasks.map(t=>`<label><span><input type="checkbox" data-final-task="${t.id}" ${(s.finalTasks||[]).includes(t.id)?'checked':''}>${t.name}</span><span class="cost">${t.cost} units</span></label>`).join('')}</div><button class="gap" id="release-packet">Run landing packet</button><p class="status" id="landing-status" role="status"></p><div class="flight-scene"><div class="ship" id="ship"></div><div class="pad"></div></div><div id="landing-reveal">${s.landed?file('closed','FLIGHT RECORD / COMPLETE','Return to the two records that started this.'):''}</div>`;},
closed(){const s=state(),invisible=active==='invisible';return `<div class="stamp">Case file / recovered</div><h2>${invisible?'The computer<br>was in the cabinet.':'Both records<br>can be explained.'}</h2>${invisible?`<div class="building restored" aria-label="Building controller restored">${['LIGHTS','VENT','ROOM 1','ROOM 2','ROOM 3','CONTROL'].map(t=>`<div class="window">${t}</div>`).join('')}</div><div class="reading"><p>You observed the circuit’s decisions, reconstructed its instructions, and separated three different faults. The cabinet contained an embedded computer: a computer built into a larger system.</p><p>Shannon’s work helped connect logical rules to electrical circuits. Hopper’s work helped people express and translate programs. You used both ideas to understand one small machine.</p></div>`:`${trajectorySVG(correctPath,true)}<div class="reading"><p>The computer’s record first diverged at interval 3. Your independent calculation exposed the discrepancy. Your schedules then kept essential work within the processor’s limits.</p><p>Johnson’s story showed the value of independent verification. Hamilton and the Apollo teams showed how software could be designed to keep important work running during overload.</p></div>`}<section class="reflection"><label for="reflection"><strong>Choose one moment when the evidence changed your mind.</strong><br>What did you first think? What did you observe? How does it connect to one person you encountered?</label><textarea id="reflection" placeholder="Use an actual test, document, or observation from the case.">${esc(s.reflection||'')}</textarea><p class="caption">Copy your case report and submit it with a screenshot in Schoology. Nothing is sent automatically.</p><button id="copy-report">Copy case report</button><button class="quiet" id="download-report">Download report</button><p id="report-status" role="status" class="status"></p><textarea class="hidden" id="report-fallback" aria-label="Case report for copying"></textarea></section><hr class="divider"><details><summary>One more investigation</summary><p class="gap">${invisible?'Design a different three-input rule. Write down all eight outputs. Give the output sheet to a partner and see whether they can reconstruct your rule.':'Create a new flight-computer cycle. Set a capacity, assign task costs, and explain what would happen if the wrong work were delayed.'}</p><textarea data-note="extension" aria-label="Extension investigation">${esc(s.notes.extension||'')}</textarea></details>`;}
};
const correctPath=[[0,0],[2,3],[4,6],[6,9],[8,7],[10,5],[12,3]];
const computerPath=[[0,0],[2,3],[4,6],[6,8],[8,6],[10,4],[12,2]];
const incidents=[{name:'Empty classroom',story:'The room is empty, hot, and has no manual request. The controller claims someone is inside.',actual:'0 1 0',reported:'1 1 0',command:'ON',fan:'ON',fault:'sensor',proof:'input'},{name:'Unrequested start',story:'The room is empty and cool. A manual request has been recorded. The fan starts anyway.',actual:'0 0 1',reported:'0 0 1',command:'ON',fan:'ON',fault:'software',proof:'rule'},{name:'Silent fan',story:'The occupied room is hot. The controller sends the expected command, but the blades stay still.',actual:'1 1 0',reported:'1 1 0',command:'ON',fan:'OFF',fault:'actuator',proof:'output'}];
const tasks={g:{id:'g',name:'Steering calculation',cost:4},a:{id:'a',name:'Altitude measurement',cost:3},p:{id:'p',name:'Camera image',cost:3},d:{id:'d',name:'Dashboard refresh',cost:2},r:{id:'r',name:'Restart recovery',cost:2},u:{id:'u',name:'Radio update',cost:3}};
const scenarios=[{title:'Descent',capacity:8,note:'Steering and distance measurements must run during descent. A delayed photograph or dashboard refresh can wait for another cycle.',tasks:[tasks.g,tasks.a,tasks.p,tasks.d],required:['g','a'],deadlines:{g:4,a:7}},{title:'Restart',capacity:9,note:'A restart interrupted the computer. Recover its saved work while keeping steering and altitude measurements running. Photography and dashboard updates may wait.',tasks:[tasks.g,tasks.a,tasks.r,tasks.p,tasks.d],required:['g','a','r'],deadlines:{r:2,g:6,a:9}},{title:'Handoff',capacity:7,note:'The spacecraft is holding a stable position. This cycle is reserved for steering and the radio handoff to Mission Control. A new altitude measurement and a photograph can wait one cycle.',tasks:[tasks.g,tasks.u,tasks.a,tasks.p],required:['g','u'],deadlines:{u:3,g:7}}];
const finalTasks=[tasks.g,tasks.a,{id:'u',name:'Radio update',cost:2},{id:'p',name:'High-resolution photograph',cost:4}];
function evaluateSchedule(scene,picks){const selected=[...new Set(picks)].map(id=>scene.tasks.find(t=>t.id===id)).filter(Boolean);const cost=selected.reduce((n,t)=>n+t.cost,0);const missing=scene.required.filter(id=>!picks.includes(id));let elapsed=0;const timing=selected.map(t=>{elapsed+=t.cost;return {id:t.id,name:t.name,finish:elapsed,deadline:scene.deadlines?.[t.id],late:!!scene.deadlines?.[t.id]&&elapsed>scene.deadlines[t.id]};});return {cost,missing,timing,ok:cost<=scene.capacity&&!missing.length&&!timing.some(t=>t.late)};}

function routeResult(route){let x=12,y=3;const visited=[[x,y]];for(let i=0;i<route.length;i++){const c=route[i];if(!['E','W','N','S'].includes(c))return {ok:false,message:'Unknown direction.'};x+=c==='E'?2:c==='W'?-2:0;y+=c==='N'?1:c==='S'?-1:0;if(x<10||x>18||y<0||y>5)return {ok:false,message:`Step ${i+1} leaves the recovery area.`,visited};visited.push([x,y]);if(x===14&&y===3)return {ok:false,message:`Step ${i+1} enters the interference zone at (14,3).`,visited};}return {ok:x===16&&y===1,message:`End: (${x},${y}). ${x===16&&y===1?'Beacon reached.':'Beacon remains at (16,1).'}`,visited};}
function comboOptions(value){return '<option value="">Choose a test</option>'+combinations.map((b,i)=>`<option value="${i}" ${String(value)===String(i)?'selected':''}>${b.join(' ')}</option>`).join('');}
function opOptions(value){return '<option value="">Unknown</option>'+['AND','OR','NOT'].map(t=>`<option ${value===t?'selected':''}>${t}</option>`).join('');}
function faultOptions(value){return '<option value="">Choose</option>'+[['sensor','Sensor / input'],['software','Software / rule'],['actuator','Relay, motor, or wiring / output']].map(([id,t])=>`<option value="${id}" ${value===id?'selected':''}>${t}</option>`).join('');}
function proofOptions(value){return '<option value="">Choose comparison</option>'+[['input','Actual input vs reported input'],['rule','Recovered rule vs program command'],['output','Program command vs physical response']].map(([id,t])=>`<option value="${id}" ${value===id?'selected':''}>${t}</option>`).join('');}

function patchMarkup(){const s=state();return `<section class="artifact"><div class="artifact-title">PROGRAM STRIP / B-3</div><p>The maintenance drawing labels the inputs: A = occupied, B = hot, C = manual request.</p><p class="caption">SAVED NOTEBOOK RULE</p><pre>A AND (B OR C)</pre><p>The reader is running this damaged program:</p><pre>fan = 41(A, 41(B, C))</pre><p>For A=1, B=0, C=1, predict the damaged program’s output. Then check a second case: A=0, B=0, C=1.</p><div class="two"><label>Damaged output at 1 0 1<select id="predict-damaged-1"><option value="">Choose</option><option value="0" ${s.damaged1==='0'?'selected':''}>OFF / 0</option><option value="1" ${s.damaged1==='1'?'selected':''}>ON / 1</option></select></label><label>Damaged output at 0 0 1<select id="predict-damaged-2"><option value="">Choose</option><option value="0" ${s.damaged2==='0'?'selected':''}>OFF / 0</option><option value="1" ${s.damaged2==='1'?'selected':''}>ON / 1</option></select></label></div><div class="gap"><label>Replacement strip<br><code>fan = <select id="patch-outer" aria-label="Outer instruction">${['41','42','43'].map(n=>`<option ${String(s.patchOuter||'41')===n?'selected':''}>${n}</option>`).join('')}</select>(A, <select id="patch-inner" aria-label="Inner instruction">${['41','42','43'].map(n=>`<option ${String(s.patchInner||'41')===n?'selected':''}>${n}</option>`).join('')}</select>(B, C))</code></label></div><button id="test-strip" class="gap">Feed strip through reader</button><p id="patch-status" class="status" role="status"></p><div id="patch-tests"></div></section>`;}

function routeMarkup(){const s=state();return `<section class="artifact"><div class="artifact-title">RECOVERY BEACON / RADIO INTERFERENCE</div><p>The corrected flight ends at <strong>(12,3)</strong>. The beacon is at <strong>(16,1)</strong>. A disturbed region at <strong>(14,3)</strong> blocks direct travel.</p><p class="caption">E/W move 2 horizontally. N/S move 1 vertically. Remain within x=10…18, y=0…5.</p><div id="route-map">${recoverySVG((s.route||[]))}</div><div class="row">${['N','W','E','S'].map(d=>`<button data-direction="${d}">${d}</button>`).join('')}<button id="undo-route" class="quiet">Undo</button><button id="clear-route" class="quiet">Clear</button></div><p id="route-commands" class="terminal">${esc((s.route||[]).join(' ')||'—')}</p><button id="test-route">Transmit route</button><p id="route-status" class="status" role="status"></p></section>`;}

function trajectorySVG(points,dashed=false,id='track-path'){const px=x=>45+x*32,py=y=>325-y*29;const grid=Array.from({length:7},(_,i)=>`<line x1="${px(i*2)}" y1="35" x2="${px(i*2)}" y2="325" stroke="#2c424b"/><text x="${px(i*2)}" y="345" text-anchor="middle">${i*2}</text>`).join('')+Array.from({length:6},(_,i)=>`<line x1="45" y1="${py(i*2)}" x2="460" y2="${py(i*2)}" stroke="#2c424b"/><text x="28" y="${py(i*2)+4}" text-anchor="end">${i*2}</text>`).join('');return `<svg class="diagram" viewBox="0 0 490 365" role="img" aria-label="Trajectory plotted against horizontal position and height${dashed?'; dashed computer record diverges from the solid path':''}">${grid}<text x="430" y="360">x</text><text x="15" y="24">y</text>${dashed?`<polyline points="${computerPath.map(([x,y])=>px(x)+','+py(y)).join(' ')}" stroke="#e6c38d" stroke-width="3" stroke-dasharray="7 7" fill="none"/>`:''}<polyline id="${id}" class="path" points="${points.map(([x,y])=>px(x)+','+py(y)).join(' ')}"/>${points.map(([x,y],i)=>`<circle class="point" cx="${px(x)}" cy="${py(y)}" r="4"/><text x="${px(x)+8}" y="${py(y)-9}">${i}</text>`).join('')}<circle class="trace-dot" id="trace-dot" cx="45" cy="325" r="7"/></svg>`;}
function recoverySVG(route){const result=routeResult(route);const px=x=>40+(x-10)*43,py=y=>270-y*44;return `<svg class="diagram" viewBox="0 0 430 310" role="img" aria-label="Recovery area. Start 12,3. Beacon 16,1. Blocked 14,3.">${[10,12,14,16,18].map(x=>`<line x1="${px(x)}" y1="40" x2="${px(x)}" y2="270" stroke="#30454d"/><text x="${px(x)}" y="295">${x}</text>`).join('')}${[0,1,2,3,4,5].map(y=>`<line x1="40" x2="384" y1="${py(y)}" y2="${py(y)}" stroke="#30454d"/><text x="20" y="${py(y)}">${y}</text>`).join('')}<circle cx="${px(14)}" cy="${py(3)}" r="15" fill="#9d5149"/><text x="${px(14)}" y="${py(3)+4}" text-anchor="middle" style="fill:white">×</text><circle cx="${px(16)}" cy="${py(1)}" r="12" fill="#a1dcca"/><text x="${px(16)+18}" y="${py(1)+4}">BEACON</text><polyline class="path" points="${result.visited.map(([x,y])=>px(x)+','+py(y)).join(' ')}"/><circle class="trace-dot" cx="${px(result.visited.at(-1)[0])}" cy="${py(result.visited.at(-1)[1])}" r="6"/></svg>`;}

function relaySVG(gate,bits){const on=gate==='AND'?bits[0]&&bits[1]:bits[0]||bits[1],color=v=>v?'#a1dcca':'#49616a';const switchPart=(x,y,i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#a4b8bd"/><circle cx="${x+64}" cy="${y}" r="4" fill="#a4b8bd"/><path d="M${x} ${y}L${x+64} ${y-(bits[i]?0:25)}" stroke="${color(bits[i])}" stroke-width="4"/><text x="${x+32}" y="${y+30}" text-anchor="middle">${['A','B'][i]} = ${bits[i]}</text>`;return `<svg viewBox="0 0 540 210" class="diagram" role="img" aria-label="${gate} circuit: ${gate==='AND'?'two switches in series':'two parallel branches'}, inputs ${bits.join(',')}, light ${on?'on':'off'}"><text x="10" y="24">${gate==='AND'?'SERIES / BOTH SWITCHES':'PARALLEL / EITHER PATH'}</text>${gate==='AND'?`<path d="M20 100H115M179 100H280M344 100H490" stroke="${color(on)}" stroke-width="3" fill="none" class="${on?'current-flow':''}"/>${switchPart(115,100,0)}${switchPart(280,100,1)}`:`<path d="M20 100H90M90 100V60H200M264 60H410V100H490" stroke="${color(bits[0])}" stroke-width="3" fill="none" class="${bits[0]?'current-flow':''}"/><path d="M90 100V150H200M264 150H410V100" stroke="${color(bits[1])}" stroke-width="3" fill="none" class="${bits[1]?'current-flow':''}"/>${switchPart(200,60,0)}${switchPart(200,150,1)}`}<circle cx="503" cy="100" r="16" fill="${on?'#e5d19d':'#27333a'}" stroke="#b2c1c4" stroke-width="2"/></svg>`;}
function bindLogicDemo(){let bits=[0,0],frame=0;const frames=[[0,0],[1,0],[0,1],[1,1]];const paint=()=>{const gate=$('demo-gate').value,on=gate==='AND'?bits[0]&&bits[1]:bits[0]||bits[1];document.querySelectorAll('[data-switch]').forEach(b=>{const i=+b.dataset.switch;b.textContent=['A','B'][i]+' · '+bits[i];b.setAttribute('aria-pressed',!!bits[i]);});$('circuit-drawing').innerHTML=relaySVG(gate,bits);$('gate-name').textContent=gate;$('demo-lamp').classList.toggle('on',!!on);$('demo-lamp').textContent=on?'ON':'OFF';document.querySelectorAll('.wire').forEach(el=>el.classList.toggle('live',!!on));$('demo-caption').textContent=`${bits[0]} ${gate} ${bits[1]} = ${Number(!!on)}. ${gate==='AND'?'Both switches in the series path must be closed.':'Either parallel path can carry current.'}`;};document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{clearTimers();bits[+b.dataset.switch]=1-bits[+b.dataset.switch];paint();});$('demo-gate').onchange=()=>{clearTimers();paint();};const step=()=>{bits=frames[frame%4].slice();frame++;paint();};$('demo-step').onclick=()=>{clearTimers();step();};$('demo-play').onclick=()=>{clearTimers();frame=0;step();for(let i=1;i<4;i++)later(step,i*1300);};paint();}
function bindTranslation(){let frame=0;const messages=['The readable statement requests an AND decision.','Inputs are read: A is 1 and B is 0.','Operation 41 preserves AND: both must be 1, so the result is 0.','The result is written to the light: OFF.'];const step=()=>{const i=frame++%4;document.querySelectorAll('.code-line').forEach((el,n)=>el.classList.toggle('lit',n===i));$('translation-caption').textContent=messages[i];};$('translation-step').onclick=()=>{clearTimers();step();};$('translation-play').onclick=()=>{clearTimers();frame=0;step();for(let i=1;i<4;i++)later(step,i*1600);};}
function bindTrajectory(){let frame=0;const points=[[0,0],[2,3],[4,6]];const step=()=>{const i=frame++%3;const [x,y]=points[i];$('trace-dot').setAttribute('cx',45+x*32);$('trace-dot').setAttribute('cy',325-y*29);$('trajectory-caption').textContent=i===0?'Start: (0,0).':`Interval ${i}: add (2,3) to the previous position → (${x},${y}).`;};$('trajectory-step').onclick=()=>{clearTimers();step();};$('trajectory-play').onclick=()=>{clearTimers();frame=0;step();for(let i=1;i<3;i++)later(step,i*1700);};}
function drawQueue(id,selected,capacity){let units=0;const total=selected.reduce((n,t)=>n+t.cost,0),scale=Math.max(total,capacity);$(id).innerHTML=selected.length?selected.map(t=>{const before=units;units+=t.cost;return `<span class="queue-block ${units>capacity?'over':''}" style="flex:0 0 ${100*t.cost/scale}%" title="${esc(t.name)}: units ${before+1}–${units}">${esc(t.name)}<br>${t.cost}</span>`;}).join('')+(total<capacity?`<span class="queue-block" style="flex:1;background:#142027;color:#90a6af" title="${capacity-total} unused units">${capacity-total} free</span>`:''):'<span class="queue-empty">No work scheduled</span>';}

function bindScheduleDemo(){let frame=0;const step=()=>{const i=frame++%3;if(i===0){drawQueue('demo-queue',[tasks.g],8);$('scheduler-caption').textContent='Steering gets 4 of the 8 available units.';}if(i===1){drawQueue('demo-queue',[tasks.g,tasks.a],8);$('scheduler-caption').textContent='Altitude gets 3 more. Total: 7 of 8 units.';}if(i===2){drawQueue('demo-queue',[tasks.g,tasks.a],8);$('scheduler-caption').textContent='Only 1 unit remains. The 3-unit photograph waits. The essential work completes.';}};$('schedule-step').onclick=()=>{clearTimers();step();};$('schedule-play').onclick=()=>{clearTimers();frame=0;step();for(let i=1;i<3;i++)later(step,i*1800);};}
function notebook(){const s=state();clearTimers();const paper=$('paper');paper.innerHTML=`<div class="stamp">Your field notes</div><h2>What changed?</h2><p class="muted">What did you try? What happened? What will you try next?</p><label for="field-notes" class="sr-only">Field notes</label><textarea id="field-notes" rows="10">${esc(s.notes.field||'')}</textarea><p class="caption">Saved on this device.</p><button id="return-evidence">Return to evidence</button>`;$('field-notes').oninput=()=>{s.notes.field=$('field-notes').value;persist();};$('return-evidence').onclick=render;}
function makeReport(){const s=state();let body=(active==='invisible'?'THE INVISIBLE COMPUTER':'MISSION CONTROL')+'\n\n';if(active==='invisible'){body+='Observations (ABC / predicted / observed):\n'+combinations.map((b,i)=>b.join(' ')+': '+(s.logs?.[i]?s.logs[i].prediction+' / '+s.logs[i].output:'not recorded')).join('\n');body+='\n\nRecovered rule: '+(s.chosenRule||'not filed')+'\nCounterexamples: '+(s.wideWitness??'—')+', '+(s.leakWitness??'—')+'\nOperations: '+JSON.stringify(s.operations||{})+'\nPatch: '+(s.patchOuter||'—')+'(A, '+(s.patchInner||'—')+'(B,C))\nIncidents: '+incidents.map((_,i)=>(s.faults?.[i]||'—')+' / '+(s.proofs?.[i]||'—')).join('; ');}else{body+='Independent coordinates: '+JSON.stringify(s.coordinates||{})+'\nFirst divergence: '+(s.divergence||'—')+'\nRecovery route: '+(s.route||[]).join(' ')+'\nSchedules: '+JSON.stringify(s.scheduleEvidence||[])+'\nLanding tasks: '+(s.finalTasks||[]).join(', ');}return body+'\n\nField notes: '+(s.notes.field||'')+'\n\nReflection: '+(s.reflection||'')+'\n\nExtension: '+(s.notes.extension||'');}
async function copyReport(){try{await navigator.clipboard.writeText(makeReport());status('report-status','Case report copied. Submit it with your screenshot.',true);}catch{$('report-fallback').classList.remove('hidden');$('report-fallback').value=makeReport();$('report-fallback').focus();$('report-fallback').select();status('report-status','Select and copy the report below, or use Download report.');}}
const hints={
cabinet:['Try the switches. Then examine the object’s plate.','The reference under the paint can be opened.'],
shannon:['Change AND to OR and compare the same switch arrangement.','The testing sheet below the reading leads back to the cabinet.'],
bench:['Change one input at a time. Record every arrangement, including the ones that keep the lamp off.','A counterexample makes a candidate rule predict the opposite of what you observed.','For the first alternative, test 1 0 0. For the second, test 0 0 1. Read the edge marks on the lit rows.'],
hopper:['Trace the worked example one operation at a time.','The numbered operation 41 requires both values to be 1. The instruction reader is below the source link.'],
reader:['Compare every example for an operation. 41 needs both values; 42 accepts either; 43 reverses one.','For the damaged program, calculate 41(B,C) first, then combine its result with A.','Both damaged predictions are 0. Keep outer operation 41; change the inner operation to 42.'],
audit:['Follow the chain: real world → sensor report → program → physical equipment.','Incident 1 changes the input. Incident 2 follows the wrong rule. Incident 3 fails after a correct command.','Pair sensor with actual/reported input; software with rule/command; output equipment with command/physical response.'],
record:['Examine the handwritten margin beneath the traces.','The initials connect to an archive entry.'],
johnson:['Use the step control to follow the coordinate calculation.','The tracking sheet below uses a different movement rule. Start it independently.'],
tracking:['At each interval, start from your previous position. Interval 3 is still an upward move.','Your y values are 3, 6, 9, 7, 5, 3. Compare these with the printout.','The computer first disagrees at interval 3. For recovery, move south before going east to avoid (14,3).'],
hamilton:['Watch which work fits and which work must wait.','Priority depends on the situation. The flight computer’s notes change between cycles.'],
scheduler:['Read the current flight note before choosing tasks. Add their costs.','Descent needs steering then altitude. Restart needs recovery first. Handoff needs the radio update before steering.','The three essential totals are 7/8, 9/9, and 7/7. Receiving the next event changes the flight note.'],
landing:['The end of the original flight and the recovery beacon are two different positions.','Use (12,3) from the tracking sheet. The final note requires steering, altitude, and radio.','Those three tasks cost 4+3+2=9. The photograph must wait.'],
closed:['Choose one actual observation from your case. Explain how it changed your thinking.']};
function teacher(){clearTimers();active=null;history.replaceState(null,'',location.pathname+'?teacher=1');$('app').innerHTML=`<div class="toolbar"><button id="teacher-home" class="quiet">← Case files</button><span class="caption">TEACHER DESK / SPOILERS</span></div><section class="teacher"><h2>Two class periods.<br>Two evidence trails.</h2><p>Each case targets one 42-minute period. Students work in pairs and switch driver and recorder after the first historical chapter. The timing below is a planning target; student pacing has not been classroom-tested.</p><table><thead><tr><th>TIME</th><th>FOCUS</th></tr></thead><tbody><tr><td>0–3</td><td>Opening object; let students explore.</td></tr><tr><td>3–17</td><td>First archive, demonstration, and evidence investigation.</td></tr><tr><td>17–31</td><td>Second archive, demonstration, and repair/scheduling.</td></tr><tr><td>31–39</td><td>Incident audit or landing packet.</td></tr><tr><td>39–42</td><td>Specific reflection; copy/download case report to Schoology.</td></tr></tbody></table><p class="gap">Teacher prompt: “What did you try? What happened? What will you test next?” The student’s <em>A nudge</em> button reveals progressively more explicit help. A wrong prediction in an experiment is recorded as evidence and does not block progress.</p><details><summary>Invisible Computer · route and solutions</summary><p>Cabinet → examine plate → Shannon archive → testing sheet → measure eight arrangements → choose rule and disprove alternatives → Hopper archive → instruction reader → service drawer → cabinet report.</p><p>Rule: A AND (B OR C). Outputs in order 000…111: 0,0,0,0,0,1,1,1. Edge marks on lit rows spell LAB. Valid counterexamples for A OR (B AND C): 011, 100. Valid counterexamples for (A AND B) OR C: 001, 011.</p><p>Reference: 41=AND, 42=OR, 43=NOT. Damaged predictions: 0 and 0. Repair: 41(A,42(B,C)). Audit: sensor/input comparison; software/rule comparison; output equipment/command vs physical response.</p><p>Fast finishers design a new three-input truth table and exchange it with another pair.</p></details><details><summary>Mission Control · route and solutions</summary><p>Record → handwritten margin → Johnson archive → tracking room → independent coordinates → first divergence → recovery route → Hamilton archive → three schedules → landing packet → report.</p><p>Coordinates after each interval: (2,3), (4,6), (6,9), (8,7), (10,5), (12,3). First discrepancy: interval 3. A recovery route is S E E S; S S E E also works. E first is blocked.</p><p>Schedules, in execution order: descent steering→altitude (7/8); restart recovery→steering→altitude (9/9); handoff radio→steering (7/7). Students must satisfy both capacities and deadlines. Final packet: original flight endpoint (12,3); steering+altitude+radio (9/9). The final radio task has a different cost shown on that packet.</p><p>Fast finishers invent a processor overload and justify a revised schedule.</p></details><details><summary>Setup, saving, and classroom access</summary><p>Open the site on student devices before class to check images and interactions. All essential history is written on the site; external links provide the original articles. Photograph links remain available if an image is blocked. All controls work with keyboard input; motion has step controls and respects reduced-motion preferences. Optional synthesized sound cues respond to switches, opened documents, measurements, successful repairs, retries, and touchdown. The header sound control mutes effects and remembers the preference. No task depends on hearing a sound. Headphones are recommended in the library.</p><p>Progress, experiments, notes, and reflections stay in this browser. The two hunts save separately, and the earlier mockup’s saved data is untouched. Work is not sent to a teacher automatically. Students can copy or download a plain-text report from the ending and submit it with a screenshot.</p><p>For shared computers, clear this version’s progress between groups. This only clears the selected investigation on this device.</p><div class="row"><button data-reset="invisible">Reset Invisible Computer</button><button data-reset="control">Reset Mission Control</button></div><p id="reset-status" role="status"></p></details><details class="opening-cards"><summary>Optional physical opening cards</summary><p>Place a card in an accessible classroom location. Students can also begin entirely on screen. The later evidence lives inside the site.</p><div class="print-card"><strong>CASE 01 / B-3</strong><p>A cabinet was still drawing power after everyone left.<br>dsteckler.com/csweek/?hunt=invisible</p><span>Look at what was left on the object.</span></div><div class="print-card"><strong>CASE 02 / TRACKING</strong><p>Two records. Both marked verified.<br>dsteckler.com/csweek/?hunt=control</p><span>Someone wrote in the margin.</span></div><button id="print-opening">Print opening cards</button></details><details><summary>The Unread Letter · Caesar cipher</summary><p>Independent additional investigation: examine seal → history and animated mapping → first strip (key 3) → margin (key 11) → six strips (key 19) → test possible keys → reflection. The desk includes a rotating alphabet, hypothesis log, notes, and a stylus-friendly sketchpad.</p><p>First strip: START WITH ONE WORD. LEAVE A TRACE. Margin: LOOK FOR WHAT REPEATS. OPEN THE THIRD ENVELOPE. The final strips read: YOUR FIRST GUESS CAN CHANGE. KEEP THE EVIDENCE. TRY ONE THING. WATCH WHAT HAPPENS. CHANGE ONE THING. ASK A BETTER QUESTION.</p><p>The security conclusion is that the small number of possible keys allows an interceptor to test them all. There are 25 non-identity shifts in the modern English alphabet. No physical stylus prize is promised. Notes save on this device; screenshot the sketchpad to keep drawn work.</p><p>Suggested pacing: opening/history 8 minutes; first strip 6; margin 8; third envelope 10; interception and reflection 10. This is a planning estimate.</p><p><a href="./caesar.html">Open The Unread Letter</a></p></details><details><summary>History and model boundaries</summary><p>The people, photographs, and historical contributions are real. The cabinet, reference cards, instruction numbers, tracking coordinates, task costs, and service reports are fictional teaching models. They are labelled on the student pages.</p><ul><li><a href="https://www.computerhistory.org/revolution/digital-logic/12/269" target="_blank" rel="noopener">Computer History Museum: digital logic and Shannon</a></li><li><a href="https://www.computerhistory.org/revolution/story/117" target="_blank" rel="noopener">Computer History Museum: higher-level languages and Hopper</a></li><li><a href="https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/" target="_blank" rel="noopener">NASA: Katherine Johnson biography</a></li><li><a href="https://science.nasa.gov/people/margaret-hamilton/" target="_blank" rel="noopener">NASA / MIT: Hamilton and the Apollo software photograph</a></li><li><a href="https://www.draper.com/media-center/news-releases/detail/23333/margaret-hamilton-apollo-software-engineer-named-a-fellow-by-computer-history-museum" target="_blank" rel="noopener">Draper: Apollo software priorities</a></li></ul><p>A-0 is described as an early compiler, without assigning Hopper sole credit for modern programming languages. Apollo software is credited to Hamilton and the wider teams. The scheduler is an illustration of prioritization, not a reproduction of the Apollo Guidance Computer.</p></details></section>`;$('teacher-home').onclick=home;document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Clear this investigation’s progress on this device?')){delete saved[b.dataset.reset];persist();$('reset-status').textContent='Investigation reset on this device.';}});$('print-opening').onclick=()=>{document.querySelector('.opening-cards').open=true;window.print();};}
$('save-indicator').onclick=()=>alert('Progress saves in this browser. Notes and reflections are not sent automatically. At the end, copy or download your case report.');
