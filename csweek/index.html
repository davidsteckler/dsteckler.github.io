:100px;border-top:3px solid var(--warm)}.motion-caption{min-height:55px;margin:15px 0;color:#c8d8d9;font-size:14px}.scrap{padding:25px;border:1px solid #625a43;background:#29261d;color:#e0d7c4;transform:rotate(-1deg);margin:20px 0}.scrap button{color:var(--warm)}.divider{margin:35px 0;border:0;border-top:1px solid var(--line)}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{50%{border-color:#b4f2d6;box-shadow:0 0 25px #a1dcca22}}@keyframes land{to{bottom:36px}}@media(max-width:800px){.desk{grid-template-columns:1fr;gap:10px}.inventory{position:static;display:flex;gap:7px;overflow:auto;padding:0 0 10px}.inventory>.caption{display:none}.inventory button{white-space:nowrap;width:auto;flex-shrink:0;margin:0}.paper{padding:24px}.cases{grid-template-columns:1fr}.hub{padding-top:45px}.two{grid-template-columns:1fr}header{flex-wrap:wrap}.footer{display:block}.case{min-height:260px}.table-wrap{margin:0 -5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important;scroll-behavior:auto!important}}@media print{.teacher>*:not(.opening-cards){display:none!important}.opening-cards>summary,.opening-cards>p{display:none!important}header,.toolbar,.inventory,.hintbar,.footer,button{display:none!important}body{background:white;color:black}main{width:100%}.paper,.artifact,.teacher details{background:white;color:black;border:1px solid #555}.muted,.caption,.stamp,p,small{color:#333!important}.desk{display:block}.print-card{break-inside:avoid}.teacher{margin:0}a{color:#222}}

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='csweek_investigations_v3';

// Synthesized, local effects. Audio starts only after a user gesture.
const Sound=(()=>{
 let ctx=null,master=null,muted=false,last=0;
 try{muted=localStorage.getItem('csweek_sound_muted')==='1';}catch{}
 const refresh=()=>{const b=$('sound-toggle');if(b){b.textContent=muted?'SOUND OFF':'SOUND ON';b.setAttribute('aria-pressed',String(!muted));b.setAttribute('aria-label',muted?'Sound off. Click to enable.':'Sound on. Click to mute.');}};
 function unlock(){if(muted)return false;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return false;if(!ctx){ctx=new Audio();master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return true;}catch{return false;}}
 function tone(freq,at,duration=.08,level=.16,type='sine',end=freq){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(Math.max(end,25),at+duration);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(level,at+.005);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(master);o.start(at);o.stop(at+duration+.015);}
 function texture(at,duration=.06,level=.16,cutoff=1500){const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate),a=buffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=cutoff;g.gain.setValueAtTime(level,at);g.gain.exponentialRampToValueAtTime(.0001,at+duration);src.connect(filter);filter.connect(g);g.connect(master);src.start(at);src.stop(at+duration);}
 function play(kind='tap'){if(!ctx||muted||ctx.state!=='running')return;const t=ctx.currentTime+.005;if(t-last<.045)return;last=t;
 if(kind==='switch-on'||kind==='switch-off'){texture(t,.035,.36,2200);tone(kind==='switch-on'?720:470,t,.045,.12,'triangle',220);}
 else if(kind==='archive'){texture(t,.14,.25,1100);tone(330,t+.035,.15,.10,'sine',390);}
 else if(kind==='discover'){tone(440,t,.15,.19);tone(660,t+.09,.22,.15);tone(880,t+.18,.25,.08);}
 else if(kind==='measure'){texture(t,.04,.20,1800);tone(1050,t+.025,.065,.12,'sine',780);}
 else if(kind==='retry'){tone(230,t,.16,.15,'sine',170);}
 else if(kind==='landing'){[262,330,392,523].forEach((f,i)=>tone(f,t+i*.10,.48,.14));texture(t,.32,.12,500);}
 else if(kind==='scan'){tone(240,t,.20,.12,'sine',620);texture(t,.11,.10,1300);}
 else tone(650,t,.045,.10,'sine',520);
 }
 function toggle(){muted=!muted;try{localStorage.setItem('csweek_sound_muted',muted?'1':'0');}catch{}refresh();if(muted){if(master&&ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.015);}else{unlock();if(master&&ctx)master.gain.setTargetAtTime(.16,ctx.currentTime,.015);setTimeout(()=>play('tap'),40);}}
 refresh();$('sound-toggle').onclick=toggle;
 document.addEventListener('pointerdown',()=>unlock(),{passive:true});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))unlock();});
 document.addEventListener('click',e=>{const b=e.target.closest?.('button');if(!b||b.disabled||b.id==='sound-toggle')return;unlock();if(b.hasAttribute('data-switch'))play(b.getAttribute('aria-pressed')==='true'?'switch-off':'switch-on');else if(b.hasAttribute('data-start'))play('scan');else if(b.hasAttribute('data-open'))play('archive');else if(b.hasAttribute('data-direction'))play('measure');else if(['measure','compare-rules','restore-reference','test-strip','file-incidents','plot-path','verify-tracking','test-route','run-cycle','release-packet'].includes(b.id))return;else play('tap');},true);
 document.addEventListener('change',e=>{if(e.target.matches('select,input[type=checkbox],input[type=radio]'))play('tap');});
 return {play,unlock};
})();
let saved={};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))saved=x;}catch{}
let active=null,room=null,timers=[],hintLevel=0;
const validRooms={invisible:['cabinet','shannon','relayLab','bench','hopper','translationLab','reader','audit','closed'],control:['record','johnson','plotLab','tracking','hamilton','scheduleLab','scheduler','landing','closed']};
const labels={cabinet:'The cabinet',shannon:'1937 · C. Shannon',relayLab:'Relay demonstrator',bench:'Relay bench',hopper:'1952 · G. Hopper',translationLab:'Translation window',reader:'Instruction reader',audit:'Incident drawer',record:'Flight record',johnson:'1962 · K. Johnson',plotLab:'Tracking demonstrator',tracking:'Tracking room',hamilton:'1969 · M. Hamilton',scheduleLab:'Processor simulator',scheduler:'Flight computer',landing:'Landing packet',closed:'Case report'};
function state(){if(!saved[active]||typeof saved[active]!=='object'||Array.isArray(saved[active]))saved[active]={};const s=saved[active];if(!Array.isArray(s.found))s.found=[];if(!s.notes||typeof s.notes!=='object')s.notes={};return s;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));$('save-indicator').textContent='SAVED ON THIS DEVICE';}catch{$('save-indicator').textContent='SAVING UNAVAILABLE · COPY YOUR REPORT';}}
function later(fn,ms){timers.push(setTimeout(fn,ms));}function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function file(target,title,sub=''){return `<button class="file new" data-open="${target}">${title}<small>${sub}</small></button>`;}
function discover(target){const s=state();if(!s.found.includes(target))s.found.push(target);persist();}
function unlockedRooms(s){
  return Fieldwork.unlockedPrefix(validRooms[active],{
    cabinet:s.plate, shannon:s.storyDoors?.shannon, relayLab:s.labChecks?.relayLab,
    bench:s.benchSolved, hopper:s.storyDoors?.hopper, translationLab:s.labChecks?.translationLab,
    reader:s.readerSolved, audit:s.auditSolved,
    record:s.margin, johnson:s.storyDoors?.johnson, plotLab:s.labChecks?.plotLab,
    tracking:s.routeSolved, hamilton:s.storyDoors?.hamilton, scheduleLab:s.labChecks?.scheduleLab,
    scheduler:s.scheduleRound>=3, landing:s.landed
  });
}
function enter(id){
  active=id;hintLevel=0;
  const s=state(),allowed=unlockedRooms(s);
  room=allowed.includes(s.room)&&s.found.includes(s.room)?s.room:allowed.at(-1);
  discover(room);render();
}
function openRoom(target){
  if(!unlockedRooms(state()).includes(target))return;
  discover(target);room=target;hintLevel=0;render();focusRoom();
}
function focusRoom(){
  window.scrollTo({top:0,behavior:'auto'});
  const h=document.querySelector('#paper h2');
  if(h){h.tabIndex=-1;h.focus({preventScroll:true});}
}
function render(){clearTimers();if(!active){home();return;}const s=state(),visited=unlockedRooms(s).filter(r=>s.found.includes(r));s.room=room;persist();history.replaceState(null,'',location.pathname+'?hunt='+active);$('app').innerHTML=`<div class="toolbar"><button class="quiet" id="home">← Case files</button><span class="name">${active==='invisible'?'01 / THE INVISIBLE COMPUTER':'02 / MISSION CONTROL'}</span><button class="quiet" id="notebook">Notes</button></div><div class="desk"><nav class="inventory" aria-label="Discovered evidence"><div class="room-count">EVIDENCE · ${visited.length} / ${validRooms[active].length}</div>${visited.map(r=>`<button data-open="${r}" class="${r===room?'current':''}" ${r===room?'aria-current="page"':''}>${esc(labels[r])}</button>`).join('')}</nav><article class="paper ${Object.hasOwn(storyFiles,room)?'story-page':'puzzle-page'}" id="paper">${pages[room]() }<div class="hintbar"><button class="quiet" id="hint">A nudge</button><div class="hint" id="hint-text" role="status"></div></div></article></div><footer class="footer"><span>Progress stays in this browser. Keep your evidence.</span><span>Fictional cases · real computing history</span></footer>`;bindCommon();bindRoom();}
function home(){
  active=null;room=null;clearTimers();
  history.replaceState(null,'',location.pathname+location.hash);
  const cards=Fieldwork.cases.map(({id,title,intro,image},i)=>{
    const target=id==='letter'?'href="./caesar.html"':`href="?hunt=${id}" data-start="${id}"`;
    const progress=id==='letter'?letterProgress():saved[id]?.found?.length;
    return `<a class="case" ${target}><img class="case-cover" src="./${image}" width="1050" height="700" alt=""><span class="case-copy"><span class="stamp">CASE FILE 0${i+1}</span><h2>${title}</h2><span class="muted">${intro}</span><span class="case-foot">${progress?'Return to evidence':'Open case'} ↗</span></span></a>`;
  }).join('');
  $('app').innerHTML=`<section class="hub"><div class="eyebrow">Computer Science Week · Grade 7</div><h1>Something was<br>left running.</h1><p class="intro">Three files were left open. Pick one.</p><div class="cases">${cards}</div><p class="caption">Work with a partner. Take turns testing and recording.</p>${Fieldwork.indexCard()}</section>`;
  document.querySelectorAll('[data-start]').forEach(link=>link.onclick=event=>{
    if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
    event.preventDefault();
    enter(link.dataset.start);
    focusRoom();
  });
  Fieldwork.bindIndex(Sound.play);
}
function letterProgress(){
  try{return JSON.parse(localStorage.getItem('csweek_caesar_v1')||'{}')?.found?.length>1;}catch{return false;}
}

function checkRelayInspection(data){
  const indices=data.getAll('probe').map(Number);
  if(indices.length!==2)return {ok:false,message:'Choose exactly two different input patterns.'};
  const options=[['correct','A AND (B OR C)'],['wide','A OR (B AND C)'],['leak','(A AND B) OR C']];
  const signatures=options.map(([id,label])=>[label,...indices.map(i=>rule(id,...combinations[i]))]);
  $('probe-results').innerHTML=`<div class="table-wrap inspection-readout"><table><thead><tr><th>Candidate rule</th>${indices.map(i=>`<th>${combinations[i].join(' ')}</th>`).join('')}</tr></thead><tbody>${signatures.map(([label,a,b])=>`<tr><td>${label}</td><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`;
  const ok=new Set(signatures.map(([,a,b])=>`${a}${b}`)).size===options.length;
  return {ok,message:ok?'Each rule has a different signature. A scrap slid out of the sleeve.':'At least two rules give identical readings. Change one probe and compare again.'};
}

function relaySVG(gate,bits){const on=gate==='AND'?bits[0]&&bits[1]:bits[0]||bits[1],color=v=>v?'#a1dcca':'#49616a';const switchPart=(x,y,i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#a4b8bd"/><circle cx="${x+64}" cy="${y}" r="4" fill="#a4b8bd"/><path d="M${x} ${y}L${x+64} ${y-(bits[i]?0:25)}" stroke="${color(bits[i])}" stroke-width="4"/><text x="${x+32}" y="${y+30}" text-anchor="middle">${['A','B'][i]} = ${bits[i]}</text>`;return `<svg viewBox="0 0 540 210" class="diagram" role="img" aria-label="${gate} circuit: ${gate==='AND'?'two switches in series':'two parallel branches'}, inputs ${bits.join(',')}, light ${on?'on':'off'}"><text x="10" y="24">${gate==='AND'?'SERIES / BOTH SWITCHES':'PARALLEL / EITHER PATH'}</text>${gate==='AND'?`<path d="M20 100H115M179 100H280M344 100H490" stroke="${color(on)}" stroke-width="3" fill="none" class="${on?'current-flow':''}"/>${switchPart(115,100,0)}${switchPart(280,100,1)}`:`<path d="M20 100H90M90 100V60H200M264 60H410V100H490" stroke="${color(bits[0])}" stroke-width="3" fill="none" class="${bits[0]?'current-flow':''}"/><path d="M90 100V150H200M264 150H410V100" stroke="${color(bits[1])}" stroke-width="3" fill="none" class="${bits[1]?'current-flow':''}"/>${switchPart(200,60,0)}${switchPart(200,150,1)}`}<circle cx="503" cy="100" r="16" fill="${on?'#e5d19d':'#27333a'}" stroke="#b2c1c4" stroke-width="2"/></svg>`;}
function drawQueue(id,selected,capacity){let units=0;const total=selected.reduce((n,t)=>n+t.cost,0),scale=Math.max(total,capacity);$(id).innerHTML=selected.length?selected.map(t=>{const before=units;units+=t.cost;return `<span class="queue-block ${units>capacity?'over':''}" style="flex:0 0 ${100*t.cost/scale}%" title="${esc(t.name)}: units ${before+1}–${units}">${esc(t.name)}<br>${t.cost}</span>`;}).join('')+(total<capacity?`<span class="queue-block" style="flex:1;background:#142027;color:#90a6af" title="${capacity-total} unused units">${capacity-total} free</span>`:''):'<span class="queue-empty">No work scheduled</span>';}

function teacher(){clearTimers();active=null;history.replaceState(null,'',location.pathname+'?teacher=1');$('app').innerHTML=`<div class="toolbar"><button id="teacher-home" class="quiet">← Case files</button><span class="caption">TEACHER DESK / SPOILERS</span></div><section class="teacher"><h2>Two class periods.<br>Two evidence trails.</h2><p>Each case targets one 42-minute period. Students work in pairs and switch driver and recorder after the first historical chapter. The timing below is a planning target; student pacing has not been classroom-tested.</p><table><thead><tr><th>TIME</th><th>FOCUS</th></tr></thead><tbody><tr><td>0–3</td><td>Opening object; let students explore.</td></tr><tr><td>3–17</td><td>First story and evidence investigation.</td></tr><tr><td>17–31</td><td>Second story and repair or scheduling.</td></tr><tr><td>31–39</td><td>Incident audit or landing packet.</td></tr><tr><td>39–42</td><td>Specific reflection; copy/download case report to Schoology.</td></tr></tbody></table><p class="gap">Teacher prompt: “What did you try? What happened? What will you test next?” The student’s <em>A nudge</em> button reveals progressively more explicit help. A wrong prediction in an experiment is recorded as evidence and does not block progress.</p><details><summary>Invisible Computer · route and solutions</summary><p>Cabinet → light the lamp → Shannon story (BOOLE + PARALLEL) → relay demonstrator → testing sheet → compare 111 to 011 → compare 100, 101 and 110 → recover the rule → Hopper story (A-0 + STORED ROUTINES) → translation window → instruction reader → service drawer → cabinet report.</p><p>Rule: A AND (B OR C). Outputs in order 000…111: 0,0,0,0,0,1,1,1. A is the cutoff. With A on, either B or C can light the lamp.</p><p>Reference: 41=AND, 42=OR, 43=NOT. Damaged predictions: 0 and 0. Repair: 41(A,42(B,C)). Audit: sensor/input comparison; software/rule comparison; output equipment/command vs physical response.</p><p>Fast finishers design a new three-input truth table and exchange it with another pair.</p></details><details><summary>Mission Control · route and solutions</summary><p>Receiver test → first split at mark 4 → Johnson story (FRIENDSHIP 7 + MECHANICAL CALCULATOR) → tracking demonstrator → tracking room → independent coordinates → first divergence → recovery route → Hamilton story (1202 + GUIDANCE) → processor simulator → three schedules → landing packet → report.</p><p>Coordinates after each interval: (2,3), (4,6), (6,9), (8,7), (10,5), (12,3). First discrepancy: interval 3. A recovery route is S E E S; S S E E also works. E first is blocked.</p><p>Schedules, in execution order: descent steering→altitude (7/8); restart recovery→steering→altitude (9/9); handoff radio→steering (7/7). Students must satisfy both capacities and deadlines. Final packet: original flight endpoint (12,3); steering+altitude+radio (9/9). The final radio task has a different cost shown on that packet.</p><p>Fast finishers invent a processor overload and justify a revised schedule.</p></details><details><summary>Setup, saving, and classroom access</summary><p>Open the site on student devices before class to check images and interactions. All essential history is written on the site; external links provide the original articles. Photograph links remain available if an image is blocked. All controls work with keyboard input; motion has step controls and respects reduced-motion preferences. Optional synthesized sound cues respond to switches, opened documents, measurements, successful repairs, retries, and touchdown. The header sound control mutes effects and remembers the preference. No task depends on hearing a sound. Headphones are recommended in the library.</p><p>Progress, experiments, notes, and reflections stay in this browser. The two hunts save separately, and the earlier mockup’s saved data is untouched. Work is not sent to a teacher automatically. Students can copy or download a plain-text report from the ending and submit it with a screenshot.</p><p>For shared computers, clear this version’s progress between groups. This only clears the selected investigation on this device.</p><div class="row"><button data-reset="invisible">Reset Invisible Computer</button><button data-reset="control">Reset Mission Control</button></div><p id="reset-status" role="status"></p></details><details><summary>Optional archive trail · Spoilers</summary><p>The relay bench and flight computer each have an inspection tab. The relay puzzle accepts any pair of probes that gives three different two-bit signatures. For example, 001 and 100 work. The flight drill needs radio → steering → altitude. The letter reverse uses keys 5 and 12. In case order the stamped words are CIRCUIT, SIGNAL, TRACE. Students enter them in the small print at the bottom of the case index.</p></details><details class="opening-cards"><summary>Optional physical opening cards</summary><p>Place a card in an accessible classroom location. Students can also begin entirely on screen. The later evidence lives inside the site.</p><div class="print-card"><strong>CASE 01 / B-3</strong><p>A cabinet was still drawing power after everyone left.<br>dsteckler.com/csweek/?hunt=invisible</p><span>Find a way to light the lamp.</span></div><div class="print-card"><strong>CASE 02 / TRACKING</strong><p>Two records. Both marked verified.<br>dsteckler.com/csweek/?hunt=control</p><span>Find the first mark that differs.</span></div><button id="print-opening">Print opening cards</button></details><details><summary>The Unread Letter · Caesar cipher</summary><p>Independent additional investigation: decode START → Caesar story (SUETONIUS + D) → alphabet test → first strip (key 3) → margin (key 11) → six strips (key 19) → test possible keys → reflection. The desk includes a rotating alphabet, hypothesis log, notes, and a stylus-friendly sketchpad.</p><p>First strip: START WITH ONE WORD. LEAVE A TRACE. Margin: LOOK FOR WHAT REPEATS. OPEN THE THIRD ENVELOPE. The final strips read: YOUR FIRST GUESS CAN CHANGE. KEEP THE EVIDENCE. TRY ONE THING. WATCH WHAT HAPPENS. CHANGE ONE THING. ASK A BETTER QUESTION.</p><p>The security conclusion is that the small number of possible keys allows an interceptor to test them all. There are 25 non-identity shifts in the modern English alphabet. No physical stylus prize is promised. Notes save on this device; screenshot the sketchpad to keep drawn work.</p><p>Suggested pacing: opening/history 8 minutes; first strip 6; margin 8; third envelope 10; interception and reflection 10. This is a planning estimate.</p><p><a href="./caesar.html">Open The Unread Letter</a></p></details><details><summary>History and model boundaries</summary><p>The people, photographs, and historical contributions are real. The cabinet, reference cards, instruction numbers, tracking coordinates, task costs, and service reports are fictional teaching models. They are labelled on the student pages.</p><ul><li><a href="https://www.computerhistory.org/revolution/digital-logic/12/269" target="_blank" rel="noopener">Computer History Museum: digital logic and Shannon</a></li><li><a href="https://www.computerhistory.org/revolution/story/117" target="_blank" rel="noopener">Computer History Museum: higher-level languages and Hopper</a></li><li><a href="https://www.nasa.gov/centers-and-facilities/langley/katherine-johnson-biography/" target="_blank" rel="noopener">NASA: Katherine Johnson biography</a></li><li><a href="https://science.nasa.gov/people/margaret-hamilton/" target="_blank" rel="noopener">NASA / MIT: Hamilton and the Apollo software photograph</a></li><li><a href="https://www.draper.com/media-center/news-releases/detail/23333/margaret-hamilton-apollo-software-engineer-named-a-fellow-by-computer-history-museum" target="_blank" rel="noopener">Draper: Apollo software priorities</a></li></ul><p>A-0 is described as an early compiler, without assigning Hopper sole credit for modern programming languages. Apollo software is credited to Hamilton and the wider teams. The scheduler is an illustration of prioritization, not a reproduction of the Apollo Guidance Computer.</p></details></section>`;$('teacher-home').onclick=home;document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Clear this investigation’s progress on this device?')){delete saved[b.dataset.reset];Fieldwork.clear(b.dataset.reset);persist();$('reset-status').textContent='Investigation reset on this device.';}});$('print-opening').onclick=()=>{document.querySelector('.opening-cards').open=true;window.print();};}
