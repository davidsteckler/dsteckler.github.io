 let ctx=null,master=null,muted=false,last=0;
 try{muted=localStorage.getItem('csweek_sound_muted')==='1';}catch{}

 if(kind==='switch-on'||kind==='switch-off'){texture(t,.035,.36,2200);tone(kind==='switch-on'?720:470,t,.045,.12,'triangle',220);}
 else if(kind==='archive'){texture(t,.14,.25,1100);tone(330,t+.035,.15,.10,'sine',390);}
 else if(kind==='discover'){tone(440,t,.15,.19);tone(660,t+.09,.22,.15);tone(880,t+.18,.25,.08);}

function ciphertext(text){return `<div class="cipher">${[...text].map((c,i)=>/[A-Z]/.test(c)?`<button data-letter="${c}" aria-label="Inspect encrypted ${c}, position ${i+1}">${c}</button>`:esc(c)).join('')}</div>`;}
function render(){clearInterval(timer);timer=null;const room=s.room;const names={letter:'The letter',history:'The seal',first:'The first strip',second:'The margin',third:'Envelope III',security:'The intercepted copy',ending:'What you left behind'};$('app').innerHTML=`<div class="toolbar"><a href="./">← Case files</a><span class="caption">AN UNSIGNED LETTER</span><button id="notebook-jump" class="quiet">Your workspace ↓</button></div><nav class="desk-tabs" aria-label="Recovered documents">${s.found.map(r=>`<button data-room="${r}" class="${room===r?'active':''}" ${room===r?'aria-current="page"':''}>${names[r]}</button>`).join('')}</nav><div class="desk"><article class="paper">${pages[room]()}<p class="status" id="feedback" role="status"></p><div id="recovered"></div><div class="hintbar"><button class="quiet" id="hint">A nudge</button><p class="hint" id="hint-text" role="status"></p></div></article><aside class="workspace" id="workspace" aria-label="Decoding workspace"><div class="caption">YOUR DESK / KEEP YOUR EVIDENCE</div><div class="desk-tabs gap"><button data-tab="wheel">Alphabet</button><button data-tab="notes">Notes</button><button data-tab="draw">Draw / stylus</button><button data-tab="attempts">Attempts</button></div><div id="workspace-content"></div></aside></div><footer class="footer"><span>Local notes · no automatic submission</span><span>Original classroom mystery · historical cipher</span></footer>`;bind();workspace(tab);}
const pages={
letter(){return `<div class="stamp">Recovered / no signature</div><h1 style="font-size:48px">The letters<br>are familiar.</h1><p class="muted">Someone expected you to read this. The fold is worn through. The wax is still in place.</p>${Fieldwork.object("letter","Unsigned envelope · Wax seal marked III")}<div class="envelope">${ciphertext(shift(messages.first,3))}<button class="text gap" id="seal">Examine the seal</button></div><p class="smallprint">There is room beside the letter to work.</p>${s.found.includes('history')?link('history','THE MARK IN THE WAX','An alphabet was drawn beneath it.'):''}`;},
history(){return `<div class="stamp">Archive / the shifting alphabet</div><h2>A message could travel<br>farther than its author.</h2><div class="reading"><p class="lede">A letter could be carried, copied, or opened along the way.</p><p>Julius Caesar is associated with a simple way to disguise writing: replace each letter with another a fixed distance along the alphabet. The Roman writer Suetonius described his use of a shift of three.</p><p>Using our modern 26-letter English alphabet, A becomes D, B becomes E, and C becomes F. Near the end, the alphabet wraps around: X becomes A, Y becomes B, Z becomes C.</p><p>The rule is the <strong>algorithm</strong>. The number of places moved is the <strong>key</strong>. The original writing is <strong>plaintext</strong>; the disguised writing is <strong>ciphertext</strong>.</p><p>To recover the message, follow the mapping backward. If A was changed to D, then a received D stands for A. One consistent rule must explain every letter.</p></div><div class="artifact"><div class="caption">A SMALL EXAMPLE / KEY 3</div><div class="steps-strip"><span id="motion-input">Z</span><span>→</span><span id="motion-output">?</span></div><p class="motion" id="motion-caption">Follow a letter across the end of the alphabet.</p><button id="play">Play the mapping</button><button class="quiet" id="step">Step</button><button class="quiet" id="pause">Pause</button></div><div class="reading"><p>At your desk, the outer alphabet holds the original letters. The inner alphabet holds the encrypted ones. Changing the key rotates the inner ring. A key of 26 would bring it back to where it started.</p><p>If both people know the rule, the key tells them which mapping to use. A reader who finds a key still has to check that it makes sense across the whole message. The first letter has the old key written into its seal: <strong>III</strong>.</p></div><p class="smallprint">History: <a href="https://www.cs.trincoll.edu/~crypto/historical/caesar.html" target="_blank" rel="noopener">Trinity College · Caesar cipher</a>. The documents in this activity are fictional; the modern English alphabet is a teaching model.</p>${link('first','UNFOLD THE FIRST STRIP','The same letters. A way to investigate them.')}`;},
first(){return `<div class="stamp">Strip I / seal III</div><h2>Start somewhere.</h2>${ciphertext(shift(messages.first,3))}<p class="gap">Three pencil marks sit under the strip. Recover those letters before restoring the sentence.</p><div class="row">${['V','W','D'].map(c=>`<label>${c} → <input class="small" data-match="${c}" aria-label="Plaintext for encrypted ${c}" maxlength="1" value="${esc(s.matches[c]||'')}"></label>`).join('')}</div><label class="gap" style="display:block" for="answer">Your reading of the strip</label><textarea id="answer" rows="4" spellcheck="false" placeholder="Use the alphabet at your desk.">${esc(s.answers.first||'')}</textarea><button id="restore" class="gap">Lay your reading over the strip</button>${s.firstSolved?link('second','A NOTE APPEARED IN THE MARGIN','The key was changed before the next message.'):''}`;},
second(){const text=shift(messages.second,11);return `<div class="stamp">Margin / key missing</div><h2>The next key<br>was left out.</h2>${ciphertext(text)}<div class="frequency" role="img" aria-label="Letter-frequency bars for this ciphertext">${[...ABC].map(c=>{const n=[...text].filter(v=>v===c).length;return `<div style="height:${Math.max(2,n*13)}px" title="${c}: ${n}"><span>${c}</span></div>`;}).join('')}</div><p class="smallprint gap">The bars count letters in this strip. Repeated letters stay repeated after a Caesar shift. A frequent letter is a clue to test; it does not prove a particular mapping.</p><div class="scrap"><p>A pencilled guess: <strong>“These first four letters might say LOOK.”</strong></p><p class="smallprint">Test whether that guess explains the rest. Start with the L and the W. Then check whether both Os become the same encrypted letter.</p></div><label for="answer">Your reading</label><textarea id="answer" rows="4">${esc(s.answers.second||'')}</textarea><button id="restore" class="gap">Compare the whole message</button>${s.secondSolved?link('third','THE THIRD ENVELOPE','There are six strips inside.'):''}`;},
third(){return `<div class="stamp">Envelope III / six strips</div><h2>The handwriting<br>continues.</h2><p class="muted">One new key was used for all six strips. The first encrypted word stands for YOUR. Once you have a key that fits that word, check it against a second strip before decoding all six.</p>${messages.last.map((line,i)=>`<section class="cipher-line"><div class="caption">STRIP ${i+1} ${s.lines[i]?' / RESTORED':''}</div>${ciphertext(shift(line,19))}<label class="sr-only" for="line-${i}">Decoded strip ${i+1}</label><input id="line-${i}" data-line="${i}" value="${esc(s.answers['line'+i]||'')}" placeholder="Your reading"><button data-check="${i}" class="quiet">Fit strip ${i+1}</button></section>`).join('')}<div class="gap" id="strip-count">${Object.values(s.lines).filter(Boolean).length} / 6 strips restored</div>${s.thirdSolved?link('security','ANOTHER COPY WAS FOUND','Someone else received the same message.'):''}${reverseInspection()}`;},
security(){return `<div class="stamp">Intercepted copy / no key supplied</div><h2>Someone else<br>has the letter.</h2><div class="reading"><p>You kept the key out of the envelope. Another reader still has the alphabet, the message, and time to try possibilities.</p><p>For a 26-letter alphabet, there are only 25 shifts that change the letters. A computer can try them all. Watch the first few words of the third envelope under each key. This is called a brute-force search. The computer generates the candidates quickly. A reader still has to decide which candidate makes sense.</p></div><div class="artifact"><div class="caption" id="scan-key">NO KEY TESTED</div><p class="cipher" id="scan-output">${shift(messages.last[0],19)}</p><button id="scan">Try the possible keys</button><button id="stop-scan" class="quiet">Pause</button><div id="scan-trials"></div></div><fieldset class="choices"><legend>What does this show about a Caesar cipher?</legend><label><input type="radio" name="security" value="safe">Keeping the key separate makes the message secure against anyone.</label><label><input type="radio" name="security" value="small">A reader can recover the message by testing the small number of possible keys.</label><label><input type="radio" name="security" value="long">A longer message creates more possible shift keys.</label></fieldset><label class="row gap">Key that recovers the opening words <input class="small" id="intercept-key" type="number" min="1" max="25" value="${esc(s.interceptKey??'')}" aria-label="Recovered encryption key"></label><button id="security-check" class="gap">Attach your conclusion</button><p class="smallprint gap">Modern encryption uses much larger key spaces and different methods. This cipher is useful for learning and puzzles; it should not protect private information. <a href="https://www.csfieldguide.org.nz/en/chapters/coding-encryption/substitution-ciphers/" target="_blank" rel="noopener">Read the Computer Science Field Guide ↗</a></p>${s.securitySolved?link('ending','RETURN TO THE FIRST LETTER','You left something beside it.'):''}`;},
ending(){return `<div class="stamp">The first letter / opened again</div><h2>Leave a trace.</h2><div class="reading"><p class="lede">At the beginning, you had a sentence you could not read.</p><p>You chose a letter. You moved an alphabet. You tried a possibility and looked at what changed.</p><p>Somewhere along the way, a few letters became a word. That word gave you enough to try another.</p><p>The page started to make sense because you gave yourself something to work with.</p><p class="bigLine">Look at what you left beside the message.</p><p>A guess. A mapping. A crossed-out attempt. A note about something that repeated.</p><p>Those marks let you return to a thought and change it. A stylus can help you circle a pattern, sketch a possibility, or put two ideas beside each other. So can a pencil. Your workspace gives your thinking somewhere to stay while you work.</p><p>In CodeHS, you have done this when you predicted a drawing, ran the program, and found the line that needed attention. Today you used that same habit on a message.</p><p>There will be other things you cannot read immediately.</p><p class="bigLine">Stay with one of them for five more minutes.</p><p>Try one thing. Watch what happens. Keep enough of a record to ask a better question.</p><p>You may find yourself able to do something that felt out of reach when you arrived.</p></div><label for="reflection">Which mark, test, or observation helped you move forward? What would you try first on a new message?</label><textarea id="reflection" rows="4">${esc(s.reflection||'')}</textarea><div class="row gap"><button id="copy">Copy your case report</button><button class="quiet" id="download">Download report</button></div><textarea class="hidden" id="report" aria-label="Case report"></textarea><details class="gap"><summary>Make a message for someone else</summary><p class="gap">Choose a key, write a short message, and give your partner the ciphertext. Keep the key separate. Compare the clues they used to recover it.</p><textarea id="own-message" rows="3" placeholder="Your plaintext">${esc(s.own||'')}</textarea><button id="encode">Encrypt with the desk key</button><pre id="own-output"></pre></details>`;}
};
const reverseLines=[
  {plain:'CHECK THE FOLD',key:5},
  {plain:'CHECK THE INK',key:12}
];
function reverseInspection(){
  return Fieldwork.inspect('Turn over the third envelope', `
    <p>Two lines are written across the fold. Both begin with <strong>CHECK</strong>. The person who wrote them changed the key halfway down the page. Use the alphabet at your desk to find the two keys, then decode each whole line.</p>
    <form id="field-form"><div class="letter-mapping">${reverseLines.map((line,i)=>`<section class="fragment"><span class="caption">REVERSE LINE ${i+1}</span><code>${shift(line.plain,line.key)}</code><label>Key <input class="small" name="key" type="number" min="0" max="25" required></label><label>Reading <input name="reading" type="text" spellcheck="false" required></label></section>`).join('')}</div><button>Read the writing on the fold</button></form>
    <p class="caption">Start by matching the first encrypted character to C. Then see if the same key explains H, E, C, and K.</p>`, 'letter');
}
function checkReverse(data){
  const keys=data.getAll('key');
  const readings=data.getAll('reading');
  const mismatch=reverseLines.findIndex((line,i)=>Number(keys[i])!==line.key||clean(readings[i])!==clean(line.plain));
  return {ok:mismatch===-1,message:mismatch===-1?'Both lines fit. There is a stamp under the fold.':`Line ${mismatch+1} needs another look. Check the key against CHECK, then use it for the rest of the line.`};
}
function wheel(){const points=r=>[...ABC].map((c,i)=>{const a=(i*360/26-90)*Math.PI/180;return `<text x="${170+Math.cos(a)*r}" y="${170+Math.sin(a)*r}" transform="rotate(${i*360/26} ${170+Math.cos(a)*r} ${170+Math.sin(a)*r})">${c}</text>`;}).join('');return `<svg class="wheel" viewBox="0 0 340 340" role="img" aria-label="Cipher wheel. Outer ring plaintext; inner ring ciphertext. Key ${s.key}."><circle cx="170" cy="170" r="157" fill="#0b171d" stroke="#57737a"/><circle cx="170" cy="170" r="119" fill="#172b30" stroke="#57737a"/>${points(140)}<g class="inner" id="inner-wheel" style="transform:rotate(${-s.key*360/26}deg)">${points(101)}</g><circle cx="170" cy="170" r="73" fill="#0c181e" stroke="#415b64"/><text x="170" y="160" style="font-size:11px">ENCRYPTION KEY</text><text x="170" y="185" id="wheel-key" style="font-size:27px;fill:#a1dcca">${s.key}</text></svg>`;}
function workspace(which){tab=which;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));const el=$('workspace-content');if(which==='wheel'){el.innerHTML=wheel()+`<div class="row controls"><button id="less" aria-label="Decrease shift">−</button><label>Key <input id="key" class="small" type="number" min="0" max="25" value="${s.key}"></label><button id="more" aria-label="Increase shift">+</button></div><input id="key-slider" class="slider" aria-label="Encryption shift" type="range" min="0" max="25" value="${s.key}"><p class="smallprint">OUTER = ORIGINAL · INNER = ENCRYPTED</p><p class="smallprint">Read the pair from the inner ring back to the outer ring when you decode.</p><div class="alphabet" id="alphabet"></div><div class="notice"><span id="letter-reading"></span></div><button id="log-key">Keep this key as a hypothesis</button><p class="smallprint gap">Tap a ciphertext letter to inspect its mapping. The workspace uses the modern English alphabet.</p>`;$('less').onclick=()=>setKey(s.key-1);$('more').onclick=()=>setKey(s.key+1);$('key').onchange=()=>setKey(Number($('key').value));$('key-slider').oninput=()=>setKey(Number($('key-slider').value));$('log-key').onclick=()=>{const text=s.room==='second'?shift(messages.second,11):s.room==='third'?shift(messages.last[0],19):shift(messages.first,3);s.attempts.push({key:s.key,sample:shift(text.slice(0,18),-s.key)});s.attempts=s.attempts.slice(-30);save();Sound.play('measure');$('log-key').textContent='Hypothesis saved in Attempts';};setKey(s.key,false);}else if(which==='notes'){el.innerHTML=`<label for="notes">What did you notice?</label><textarea id="notes" rows="14" placeholder="Keep guesses, letter mappings, questions, and things you tried.">${esc(s.notes)}</textarea><p class="smallprint">Your notes stay here while you open other documents.</p>`;$('notes').oninput=()=>{s.notes=$('notes').value;save();};}else if(which==='attempts'){el.innerHTML=`<p class="smallprint">Candidate keys and short samples you kept.</p>${s.attempts.map(a=>`<div class="attempt">KEY ${a.key}<br>${esc(a.sample)}</div>`).join('')||'<p>No hypotheses kept yet.</p>'}`;}else{el.innerHTML=`<p class="smallprint">Circle, connect, sketch. Finger, mouse, or stylus.</p><canvas class="canvas" id="pad" width="680" height="460" aria-label="Drawing workspace. Use Notes for a keyboard-accessible alternative."></canvas><div class="row"><button id="undo">Undo stroke</button><button id="clear-pad">Clear sketch</button></div><p class="smallprint">Sketch saved on this browser. The text report includes notes and hypotheses; take a screenshot to keep your drawing.</p>`;bindPad();}}
function setKey(value,sound=true){s.key=((Math.round(value||0)%26)+26)%26;save();if($('inner-wheel'))$('inner-wheel').style.transform=`rotate(${-s.key*360/26}deg)`;if($('wheel-key'))$('wheel-key').textContent=s.key;if($('key'))$('key').value=s.key;if($('key-slider'))$('key-slider').value=s.key;if($('alphabet'))$('alphabet').innerHTML=[...ABC].map(c=>`<span>${c}\n${shift(c,s.key)}</span>`).join('');showLetter();if(sound)Sound.play('tap');}
function showLetter(){if($('letter-reading'))$('letter-reading').textContent=`Received ${selected} → original ${shift(selected,-s.key)} at key ${s.key}.`;}
function bind(){document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{Sound.play('archive');go(b.dataset.room);});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>workspace(b.dataset.tab));document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{selected=b.dataset.letter;document.querySelectorAll('[data-letter]').forEach(v=>v.classList.toggle('selected',v===b));workspace('wheel');showLetter();Sound.play('tap');});$('notebook-jump').onclick=()=>{$('workspace').scrollIntoView({behavior:'auto'});workspace('notes');$('notes').focus();};let hintsUsed=0;const hints={letter:['Examine the seal on the envelope.'],history:['The seal says III. The first key is 3.','Read the inner ring backward to the outer ring.'],first:['At key 3, encrypted V maps back to S.','V W D starts S T A. Recover each letter consistently.'],second:['Test the suggestion LOOK against the opening WZZV.','L becomes W when encrypted with key 11. See whether that shift explains the whole strip.'],third:['The first word RHNK stands for YOUR.','Y becomes R after wrapping around at encryption key 19. Apply that same key throughout.'],security:['Pause after several keys and inspect the candidates.','A small number of possible keys lets another reader test all of them.'],ending:['Choose something you actually tried or marked.']};$('hint').onclick=()=>{$('hint-text').textContent=hints[s.room][Math.min(hintsUsed++,hints[s.room].length-1)];Sound.play('tap');};
if($('seal'))$('seal').onclick=()=>go('history');
if(s.room==='history'){const frames=[['Z','Z','Start at Z. Encrypt forward three positions.'],['Z','A','First step: wrap from Z to A.'],['Z','B','Second step: A to B.'],['Z','C','Third step: B to C. Z encrypted with key 3 becomes C.'],['C','Z','Decrypt by following the mapping backward: C returns to Z.']];const step=()=>{const f=frames[animFrame++%frames.length];$('motion-input').textContent=f[0];$('motion-output').textContent=f[1];$('motion-caption').textContent=f[2];Sound.play('tap');};$('step').onclick=()=>{clearInterval(timer);step();};$('play').onclick=()=>{clearInterval(timer);animFrame=0;step();timer=setInterval(()=>{if(animFrame>=frames.length){clearInterval(timer);return;}step();},1400);};$('pause').onclick=()=>clearInterval(timer);}
if(['first','second'].includes(s.room)){document.querySelectorAll('[data-match]').forEach(i=>i.oninput=()=>{s.matches[i.dataset.match]=i.value;save();});$('answer').oninput=()=>{s.answers[s.room]=$('answer').value;save();};$('restore').onclick=()=>{const first=s.room==='first';if(first&&Object.entries({V:'S',W:'T',D:'A'}).some(([c,v])=>clean(s.matches[c]||'')!==v)){status('Recover the three pencilled letters first. Read from ciphertext back to plaintext.');return;}if(clean($('answer').value)!==clean(first?messages.first:messages.second)){status('Some of the reading still disagrees. Check repeated letters and the direction of your shift. Punctuation and spacing do not matter.');return;}s[first?'firstSolved':'secondSolved']=true;save();status('The words fit. Another part of the letter is visible below.',true);$('recovered').innerHTML=first?link('second','THE MARGIN','A different key. The same kind of rule.'):link('third','THE THIRD ENVELOPE','Six strips. One new key.');document.querySelectorAll('#recovered [data-room]').forEach(b=>b.onclick=()=>go(b.dataset.room));};}
if(s.room==='third'){Fieldwork.check('letter',checkReverse,Sound.play);document.querySelectorAll('[data-line]').forEach(i=>i.oninput=()=>{s.answers['line'+i.dataset.line]=i.value;save();});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const i=+b.dataset.check;if(clean(s.answers['line'+i]||'')!==clean(messages.last[i])){status(`Strip ${i+1} still has a mismatch. Try one short word and check the same key elsewhere.`);return;}s.lines[i]=true;save();b.textContent='Strip fitted ✓';b.disabled=true;status('Strip '+(i+1)+' fitted.',true);const strip=b.closest('.cipher-line');strip.querySelector('.caption').textContent='STRIP '+(i+1)+' / RESTORED';$('strip-count').textContent=Object.values(s.lines).filter(Boolean).length+' / 6 strips restored';if(messages.last.every((_,i)=>s.lines[i])){s.thirdSolved=true;save();$('recovered').innerHTML=link('security','ANOTHER COPY WAS FOUND','An unknown reader has your message.');document.querySelector('#recovered [data-room]').onclick=()=>go('security');}});}
if(s.room==='security'){let trial=0;$('intercept-key').oninput=()=>{s.interceptKey=$('intercept-key').value;save();};const step=()=>{trial++;if(trial>25){clearInterval(timer);return;}s.scanCount=Math.max(s.scanCount||0,trial);save();$('scan-key').textContent='TESTING KEY '+trial;$('scan-output').textContent=shift(shift(messages.last[0],19),-trial);const row=document.createElement('div');row.className='attempt';row.textContent=trial+': '+$('scan-output').textContent;$('scan-trials').append(row);Sound.play('measure');};$('scan').onclick=()=>{clearInterval(timer);trial=0;$('scan-trials').innerHTML='';step();timer=setInterval(step,250);};$('stop-scan').onclick=()=>clearInterval(timer);$('security-check').onclick=()=>{if((s.scanCount||0)<3){status('Run a few key tests and inspect the results before drawing a conclusion.');return;}if(!s.securitySolved&&Number($('intercept-key').value)!==19){status('Find the candidate whose first words match the restored strip. Enter its key.');return;}if(document.querySelector('[name=security]:checked')?.value!=='small'){status('Consider how many possibilities the other reader has to try. Does message length change that number?');return;}s.securitySolved=true;save();status('Conclusion attached. The first letter is waiting.',true);$('recovered').innerHTML=link('ending','THE FIRST LETTER','Return to what you left behind.');document.querySelector('#recovered [data-room]').onclick=()=>go('ending');};}
if(s.room==='ending'){$('reflection').oninput=()=>{s.reflection=$('reflection').value;save();};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());status('Report copied. Keep a screenshot if you used the sketchpad.',true);}catch{$('report').classList.remove('hidden');$('report').value=report();$('report').select();status('Copy the selected report, or use Download.');}};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([report()],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='unread-letter-case-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('own-message').oninput=()=>{s.own=$('own-message').value;save();};$('encode').onclick=()=>{$('own-output').textContent=shift($('own-message').value,s.key);Sound.play('measure');};}}
function report(){return 'THE UNREAD LETTER\n\nFirst strip: '+(s.answers.first||'')+'\n\nMargin: '+(s.answers.second||'')+'\n\nEnvelope III:\n'+messages.last.map((_,i)=>s.answers['line'+i]||'').join('\n')+'\n\nHypotheses:\n'+s.attempts.map(a=>'Key '+a.key+': '+a.sample).join('\n')+'\n\nField notes:\n'+s.notes+'\n\nReflection:\n'+(s.reflection||'');}
function bindPad(){const canvas=$('pad'),ctx=canvas.getContext('2d');let stroke=null;const draw=()=>{ctx.clearRect(0,0,680,460);ctx.strokeStyle='#b5e8d3';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';for(const line of s.strokes){if(!line.length)continue;ctx.beginPath();ctx.moveTo(...line[0]);for(const pt of line.slice(1))ctx.lineTo(...pt);if(line.length===1)ctx.lineTo(line[0][0]+.1,line[0][1]+.1);ctx.stroke();}};const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*680/r.width,(e.clientY-r.top)*460/r.height];};canvas.onpointerdown=e=>{if(s.strokes.reduce((n,l)=>n+l.length,0)>12000){status('Sketchpad is full. Undo or clear some marks, or continue in Notes.');return;}canvas.setPointerCapture(e.pointerId);stroke=[point(e)];s.strokes.push(stroke);draw();};canvas.onpointermove=e=>{if(!stroke||stroke.length>=1000)return;stroke.push(point(e));draw();};const finish=()=>{stroke=null;save();};canvas.onpointerup=finish;canvas.onpointercancel=finish;$('undo').onclick=()=>{s.strokes.pop();draw();save();};$('clear-pad').onclick=()=>{if(confirm('Clear the sketch on this device?')){s.strokes=[];draw();save();}};draw();}
if(!Object.keys(pages).includes(s.room))s.room='letter';render();
</script></body></html>
