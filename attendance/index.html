<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173c35"><meta name="robots" content="noindex,nofollow"><title>Field Trip Attendance · Steckler</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#183a33;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}header{background:#173c35;color:white;padding:26px 20px 22px}header>div,main,.status-inner{max-width:620px;margin:auto}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:#b9d3c8;text-transform:uppercase}h1{font-size:29px;letter-spacing:-.04em;margin:8px 0 6px}header p{margin:0;color:#d2e0da;font-size:14px}.status{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dce3db;padding:16px 20px 12px;box-shadow:0 3px 12px #183a3308}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px}#count{font-size:30px;font-weight:750;letter-spacing:-.05em}#count span{font-weight:450;font-size:18px;letter-spacing:0;color:#63756c}#message{font-size:13px;margin-top:2px;color:#63756c}.reset{border:1px solid #ccd8ce;background:white;color:#173c35;border-radius:10px;padding:12px 15px;font-size:14px;font-weight:650;min-height:46px}button:focus-visible,label:focus-within{outline:3px solid #edaa35;outline-offset:3px}.track{height:5px;background:#e9eee8;border-radius:9px;margin-top:14px;overflow:hidden}#progress{height:100%;background:#2b8561;transition:width .15s}.tools{display:flex;gap:8px;margin:18px 0 12px}main{padding:0 16px 40px}.filter{flex:1;border:1px solid #d7dfd5;background:transparent;color:#506258;border-radius:10px;padding:11px 6px;font-size:14px;font-weight:600}.filter[aria-pressed=true]{background:#173c35;color:#fff;border-color:#173c35}.list{display:grid;gap:7px}.student{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e0e6de;border-radius:12px;min-height:72px;padding:13px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}.student.checked{background:#e6f1e7;border-color:#bad4c0}.student input{width:27px;height:27px;flex-shrink:0;margin:0;accent-color:#287851;cursor:pointer}.name{font-size:18px;font-weight:650;line-height:1.3}.surname{font-size:14px;color:#627168;margin-top:2px}.number{margin-left:auto;font-size:12px;color:#839087;font-variant-numeric:tabular-nums}.note{text-align:center;color:#728175;font-size:12px;line-height:1.6;margin:20px 0 0}#empty{text-align:center;background:#e6f1e7;border-radius:12px;padding:32px 15px;font-weight:600}.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#173c35;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 5px 22px #0002;display:flex;align-items:center;justify-content:space-between;gap:20px;width:calc(100% - 32px);max-width:588px;z-index:5;font-size:14px}.toast button{background:#e2eedf;border:0;color:#173c35;border-radius:8px;padding:10px 14px;font-weight:700}[hidden]{display:none!important}@media(min-width:650px){header{padding-top:38px;padding-bottom:30px}h1{font-size:34px}main{padding-left:0;padding-right:0}.student{min-height:76px}}

.rosters{display:flex;gap:8px;margin-top:18px}.roster{flex:1;border:1px solid #537569;color:#dce9e2;background:transparent;border-radius:10px;padding:12px 8px;font-weight:650;font-size:15px}.roster[aria-pressed=true]{background:#eff5eb;color:#173c35;border-color:#eff5eb}.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#627168;padding:12px 4px 3px}.badge{font-size:11px;border-radius:5px;background:#edf1eb;padding:3px 5px;margin-left:7px;color:#64756b}.search{width:100%;background:white;color:#183a33;border:1px solid #d7dfd5;border-radius:10px;padding:12px 14px;margin-bottom:12px;min-height:46px;font-size:16px}.search:focus{outline:2px solid #287851;outline-offset:1px}#adults-count{font-size:13px;color:#506258;margin-top:3px}.roster:focus-visible{outline:3px solid #edaa35;outline-offset:3px}h1{margin-bottom:9px}
</style></head><body>
<header><div><div class="eyebrow">Field trip attendance</div><h1>Check-in list</h1><p id="subtitle">Guerrero / Steckler · Group F</p><nav class="rosters" aria-label="Attendance lists"><button class="roster" id="group-tab" type="button" aria-pressed="true">Group F · 19 students</button><button class="roster" id="bus-tab" type="button" aria-pressed="false">Bus 3 · 38 students</button></nav></div></header>
<section class="status" aria-label="Attendance status"><div class="status-inner"><div class="summary"><div aria-live="polite" aria-atomic="true"><div id="count"></div><div id="adults-count" hidden></div><div id="message"></div></div><button type="button" class="reset" id="reset">Reset checks</button></div><div class="track"><div id="progress"></div></div></div></section>
<main><div class="tools" aria-label="Show people"><button type="button" class="filter" id="all" aria-pressed="true">Everyone</button><button type="button" class="filter" id="missing" aria-pressed="false">Still missing</button></div><input id="search" class="search" type="search" placeholder="Find a name" aria-label="Find a name" autocomplete="off"><div class="list" id="list"></div><div id="empty" hidden></div><p class="note" id="note">Checks save automatically on this device.<br>Reset checks to start the next check-in.</p></main>
<div class="toast" id="toast" hidden><span role="status" id="reset-message">Checks reset.</span><button type="button" id="undo">Undo</button></div>
<script>
'use strict';
const groupF=[['Stephany','Contreras Paguay'],['Jhostin','Sandoval Zepeda'],['Ashly','Cruz Gomez'],['Snayder','Hilario Contreras'],['Matthew','Whittle'],['Nicholas','Brady'],['Mia','Munoz Ortega'],['Carolina','Allende Perez'],['Jesus','Sarabia Flores'],['Mario','Tapia Lozada'],['Denny','Morocho Enriquez'],['Isabelle','Rivera Chavez'],['Miles','Riegelhaupt'],['Lucas','Valdez'],['Arantza','Garcia Flores'],['Roberto','Sanchez Novola'],['Philip','Laquercia'],['Samuel','Montoya'],['Oscar','Tunque']];
const groupE=[['Daniel','Antigua'],['Jonas','Perez'],['Ariana','Pedraza'],['Bibiana','Vega Agront'],['Thiago','Lopez Meza'],['Gesler','Ardeano Juarez'],['Rubi','Rocha'],['Esmeralda','Rocha'],['Joshua','Lipa Huaypar'],['Diego','Osorio Lora'],['Patrick','Jackson'],['Damian','Aguilar Garcia'],['Jacob','Bobadilla Egusquiz'],['Gylmar','Dulanto Gonzales'],['Thiago','Flores Moron'],['Angel','Vicente Perez'],['Cristel','Guzman Zavala'],['Joseline','Cuautle'],['Valentina','Caputo']];
const asPeople=(arr,group)=>arr.map(([first,last])=>({first,last,group,adult:false}));
const lists={group:{title:'Group F',students:19,people:asPeople(groupF,'F')},bus:{title:'Bus 3',students:38,people:[...asPeople(groupE,'E'),...asPeople(groupF,'F'),...['Nisianakis','Ruggiero','Guerrero','Steckler'].map(name=>({first:name,last:'Adult',group:'',adult:true}))]}};
const state={};for(const [id,cfg] of Object.entries(lists)){state[id]=cfg.people.map(()=>false);try{const saved=JSON.parse(localStorage.getItem('steckler-attendance-v2-'+id));if(Array.isArray(saved)&&saved.length===cfg.people.length)state[id]=saved.map(v=>v===true)}catch(e){}}
let active=new URLSearchParams(location.search).get('list')==='bus'?'bus':'group',onlyMissing=false,backup=null,query='';
const list=document.getElementById('list');
function save(){try{localStorage.setItem('steckler-attendance-v2-'+active,JSON.stringify(state[active]))}catch(e){document.getElementById('note').textContent='Checks stay while this page is open. Device storage is unavailable.'}}
function build(){list.replaceChildren();lists[active].people.forEach((person,i)=>{const row=document.createElement('label');row.className='student';row.dataset.index=i;const box=document.createElement('input');box.type='checkbox';box.setAttribute('aria-label',person.first+' '+(person.adult?'(adult)':person.last));const names=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=person.first;const surname=document.createElement('div');surname.className='surname';surname.textContent=person.last;if(active==='bus'&&!person.adult){const badge=document.createElement('span');badge.className='badge';badge.textContent='Group '+person.group;surname.append(badge)}names.append(name,surname);const num=document.createElement('span');num.className='number';num.textContent=person.adult?'ADULT':String(i+1).padStart(2,'0');row.append(box,names,num);box.addEventListener('change',()=>{state[active][i]=box.checked;backup=null;document.getElementById('toast').hidden=true;save();render()});list.append(row)});render()}
function render(){const cfg=lists[active],checks=state[active],n=checks.slice(0,cfg.students).filter(Boolean).length,a=checks.slice(cfg.students).filter(Boolean).length,total=checks.filter(Boolean).length,remaining=checks.length-total;document.getElementById('count').innerHTML=n+' <span>/ '+cfg.students+' students</span>';document.getElementById('adults-count').hidden=active!=='bus';document.getElementById('adults-count').textContent=a+' / 4 adults';document.getElementById('message').textContent=remaining===0?'Everyone is checked in.':remaining+' still to check';document.getElementById('progress').style.width=(total/checks.length*100)+'%';document.getElementById('reset').disabled=total===0;document.getElementById('reset').style.opacity=total===0?'.45':'1';let visible=0;[...list.children].forEach((row,i)=>{row.classList.toggle('checked',checks[i]);row.querySelector('input').checked=checks[i];const person=cfg.people[i];row.hidden=(onlyMissing&&checks[i])||!(person.first+' '+person.last).toLowerCase().includes(query);if(!row.hidden)visible++});document.getElementById('empty').hidden=visible!==0;document.getElementById('empty').textContent=remaining===0&&onlyMissing&&!query?'Everyone is checked in.':'No matching names.';document.getElementById('all').setAttribute('aria-pressed',String(!onlyMissing));document.getElementById('missing').setAttribute('aria-pressed',String(onlyMissing));document.getElementById('missing').textContent='Still missing ('+remaining+')';document.getElementById('group-tab').setAttribute('aria-pressed',String(active==='group'));document.getElementById('bus-tab').setAttribute('aria-pressed',String(active==='bus'));document.getElementById('subtitle').textContent=active==='group'?'Guerrero / Steckler · Group F':'Bus 3 · 38 students + 4 adults'}
function switchList(id){active=id;backup=null;query='';document.getElementById('search').value='';document.getElementById('toast').hidden=true;const url=new URL(location.href);if(id==='bus')url.searchParams.set('list','bus');else url.searchParams.delete('list');history.replaceState(null,'',url);build()}
document.getElementById('group-tab').onclick=()=>switchList('group');document.getElementById('bus-tab').onclick=()=>switchList('bus');
document.getElementById('all').onclick=()=>{onlyMissing=false;render()};document.getElementById('missing').onclick=()=>{onlyMissing=true;render()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
document.getElementById('reset').onclick=()=>{backup=[...state[active]];state[active]=state[active].map(()=>false);save();render();document.getElementById('reset-message').textContent=lists[active].title+' checks reset.';document.getElementById('toast').hidden=false};
document.getElementById('undo').onclick=()=>{if(backup){state[active]=backup;backup=null;save();render()}document.getElementById('toast').hidden=true};build();
</script></body></html>
